<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bossy | StudySprint</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="bossy.css"
    >

</head>


<body>

<main id="bossy-game">

    <!-- =====================================================
         HUD
    ====================================================== -->

    <header class="bossy-hud">

        <div class="bossy-brand">
            🚀 StudySprint
        </div>

        <div class="bossy-title">
            👹 BOSSY
        </div>

        <div
            id="bossy-player-count"
            class="bossy-player-count"
        >
            👥 0 Players
        </div>

    </header>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <div class="game-container">

        <canvas id="game-canvas"></canvas>


        <!-- Loading -->

        <div
            id="game-loading"
            class="game-loading"
        >

            <div class="loading-spinner"></div>

            <h2>
                Loading Bossy...
            </h2>

            <p>
                Connecting to the game
            </p>

        </div>


        <!-- Error -->

        <div
            id="game-error"
            class="game-message"
            style="display:none;"
        >
        </div>


        <!-- Controls -->

        <div class="controls-hint">

            <span>A</span>
            Move

            <span>D</span>
            Move

            <span>SPACE</span>
            Jump

        </div>

    </div>


    <!-- =====================================================
         BOTTOM BAR
    ====================================================== -->

    <div class="bossy-bottom-bar">

        <div>

            <strong>
                LOBBY
            </strong>

            <span id="bossy-code">
                ------
            </span>

        </div>


        <div
            id="connection-status"
            class="connection-status"
        >
            CONNECTING
        </div>

    </div>

</main>


<script
    type="module"
    src="bossy.js"
></script>

</body>

</html>
