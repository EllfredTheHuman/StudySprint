<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bossy | StudySprint</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="bossy.css"
    >

</head>


<body>

<header>

    <div class="logo">
        🚀 StudySprint
    </div>

    <nav>

        <a href="../../index.html">
            Home
        </a>

        <a href="../../study/index.html">
            📚 Study
        </a>

        <a href="../../sprint/index.html">
            🏃 Sprint
        </a>

        <a href="../../games/index.html">
            🎮 Games
        </a>

        <a href="../../profile/index.html">
            👤 Profile
        </a>

    </nav>

</header>


<main id="bossy-game">

    <!-- =====================================================
         LOADING
    ====================================================== -->

    <section
        id="bossy-loading"
        class="bossy-loading"
    >

        <div class="loading-spinner"></div>

        <h1>
            Loading Bossy...
        </h1>

        <p>
            Connecting to your game.
        </p>

    </section>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <section
        id="bossy-world"
        class="bossy-world"
        style="display:none;"
    >

        <div class="bossy-topbar">

            <div>

                <span class="bossy-label">
                    STUDYSPRINT GAME
                </span>

                <h1>
                    👹 Bossy
                </h1>

            </div>


            <div class="bossy-lobby-code">

                <span>
                    LOBBY
                </span>

                <strong id="bossy-code">
                    ------
                </strong>

            </div>

        </div>


        <!-- =================================================
             GAME MAP
        ================================================== -->

        <div
            id="game-map"
            class="game-map"
        >

            <div class="sky"></div>

            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>

            <div class="ground"></div>

            <div
                id="players-container"
                class="players-container"
            ></div>

        </div>


        <!-- =================================================
             CONTROLS
        ================================================== -->

        <div class="bossy-controls">

            <div class="control">

                <kbd>
                    A
                </kbd>

                <span>
                    Move Left
                </span>

            </div>


            <div class="control">

                <kbd>
                    D
                </kbd>

                <span>
                    Move Right
                </span>

            </div>


            <div class="control">

                <kbd>
                    SPACE
                </kbd>

                <span>
                    Jump
                </span>

            </div>

        </div>

    </section>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <section
        id="bossy-error"
        class="bossy-error"
        style="display:none;"
    >

        <div class="error-icon">
            ⚠️
        </div>

        <h1>
            Unable to join Bossy
        </h1>

        <p id="bossy-error-message">
            Something went wrong.
        </p>

        <a
            href="../../games/index.html"
            class="back-button"
        >
            ← BACK TO GAMES
        </a>

    </section>

</main>


<script
    type="module"
    src="bossy.js"
></script>

</body>

</html>
