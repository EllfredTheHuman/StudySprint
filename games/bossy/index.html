```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bossy | StudySprint</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="bossy.css"
    >

</head>


<body>

<header>

    <div class="logo">
        🚀 StudySprint
    </div>

    <nav>

        <a href="../../index.html">
            Home
        </a>

        <a href="../../study/index.html">
            📚 Study
        </a>

        <a href="../../sprint/index.html">
            🏃 Sprint
        </a>

        <a href="../../games/index.html">
            🎮 Games
        </a>

        <a href="../../profile/index.html">
            👤 Profile
        </a>

    </nav>

</header>


<main id="bossy-game">


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <section
        id="bossy-loading"
        class="bossy-loading"
    >

        <div class="loading-spinner"></div>

        <h1>
            Loading Bossy...
        </h1>

        <p id="loading-status">
            Connecting to your game.
        </p>

    </section>



    <!-- =====================================================
         ERROR
    ====================================================== -->

    <section
        id="bossy-error"
        class="bossy-error"
        style="display:none;"
    >

        <div class="error-icon">
            ⚠️
        </div>

        <h1>
            Unable to join Bossy
        </h1>

        <p id="bossy-error-message">
            Something went wrong.
        </p>

        <a
            href="../../games/index.html"
            class="back-button"
        >
            ← BACK TO GAMES
        </a>

    </section>



    <!-- =====================================================
         GAME
    ====================================================== -->

    <section
        id="bossy-world"
        class="bossy-world"
        style="display:none;"
    >


        <!-- =================================================
             TOP HUD
        ================================================= -->

        <div class="bossy-hud">

            <div class="bossy-brand">
                🚀 StudySprint
            </div>

            <div class="bossy-title">
                👹 BOSSY
            </div>

            <div class="bossy-hud-right">

                <span id="bossy-player-count">
                    0 Players
                </span>

                <span
                    id="bossy-connection"
                    class="connection-status"
                >
                    Connecting...
                </span>

            </div>

        </div>



        <!-- =================================================
             WORLD
        ================================================= -->

        <div
            id="game-map"
            class="game-map"
        >

            <div class="sky-background"></div>

            <div class="sun"></div>

            <div class="cloud cloud-one"></div>

            <div class="cloud cloud-two"></div>

            <div class="cloud cloud-three"></div>


            <div class="background-hill hill-one"></div>

            <div class="background-hill hill-two"></div>


            <div class="ground">

                <div class="ground-top"></div>

                <div class="ground-pattern"></div>

            </div>


            <div
                id="players-container"
                class="players-container"
            ></div>

        </div>



        <!-- =================================================
             CONTROLS
        ================================================= -->

        <div class="controls-hint">

            <span>
                A
            </span>

            <span>
                D
            </span>

            <span>
                SPACE
            </span>

            <label>
                Move & Jump
            </label>

        </div>



        <!-- =================================================
             BOTTOM BAR
        ================================================= -->

        <div class="bossy-bottom-bar">

            <div>

                <strong>
                    LOBBY
                </strong>

                <span id="bossy-code">
                    ------
                </span>

            </div>

            <div
                id="bossy-local-name"
                class="local-player-name"
            >
                Player
            </div>

        </div>

    </section>

</main>


<script
    type="module"
    src="bossy.js"
></script>

</body>

</html>
```
