```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bossy | StudySprint</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="bossy.css"
    >

</head>


<body>

<main id="bossy-game">


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <section
        id="bossy-loading"
        class="bossy-loading"
    >

        <div class="loading-spinner"></div>

        <h1>
            Loading Bossy...
        </h1>

        <p>
            Connecting to your game.
        </p>

    </section>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <section
        id="bossy-world"
        class="bossy-world"
        style="display:none;"
    >


        <!-- =================================================
             HUD
        ================================================== -->

        <header class="bossy-hud">

            <div class="bossy-brand">
                🚀 StudySprint
            </div>

            <div class="bossy-title">
                👹 BOSSY
            </div>

            <div class="bossy-lobby">

                <span>
                    LOBBY
                </span>

                <strong id="bossy-code">
                    ------
                </strong>

            </div>

        </header>


        <!-- =================================================
             GAME MAP
        ================================================== -->

        <div
            id="game-map"
            class="game-map"
        >


            <!-- SKY -->

            <div class="sky"></div>


            <!-- BACKGROUND -->

            <div class="mountain mountain-one"></div>
            <div class="mountain mountain-two"></div>

            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
            <div class="cloud cloud-three"></div>


            <!-- PLATFORM -->

            <div class="ground">

                <div class="ground-top"></div>

            </div>


            <!-- PLAYERS -->

            <div
                id="players-container"
                class="players-container"
            ></div>


            <!-- CONTROLS -->

            <div class="controls-hint">

                <span class="key">
                    A
                </span>

                <span>
                    Move
                </span>

                <span class="key">
                    D
                </span>

                <span>
                    Move
                </span>

                <span class="key space">
                    SPACE
                </span>

                <span>
                    Jump
                </span>

            </div>


            <!-- PLAYER COUNT -->

            <div class="player-count">

                👥

                <strong id="player-count">
                    0
                </strong>

                players

            </div>

        </div>


    </section>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <section
        id="bossy-error"
        class="bossy-error"
        style="display:none;"
    >

        <div class="error-icon">
            ⚠️
        </div>

        <h1>
            Unable to join Bossy
        </h1>

        <p id="bossy-error-message">
            Something went wrong.
        </p>

        <a
            href="../../games/index.html"
            class="back-button"
        >
            ← BACK TO GAMES
        </a>

    </section>


</main>


<script
    type="module"
    src="bossy.js"
></script>

</body>

</html>
```
