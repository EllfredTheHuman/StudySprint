<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sign In | StudySprint</title>

<link
    rel="stylesheet"
    href="auth.css"
>

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div
    id="auth-loading"
    class="auth-loading"
>

    <div class="loading-spinner"></div>

    <p>
        Loading StudySprint...
    </p>

</div>


<!-- =====================================================
     AUTH APP
===================================================== -->

<main
    id="auth-app"
    class="auth-page"
    style="display:none;"
>


    <section class="auth-card">


        <!-- LOGO -->

        <div class="auth-logo">

            <a href="../index.html">
                🚀 StudySprint
            </a>

        </div>


        <p class="auth-tagline">
            Learn. Sprint. Level up.
        </p>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                id="login-tab"
                class="auth-tab active"
                type="button"
            >
                Sign In
            </button>


            <button
                id="signup-tab"
                class="auth-tab"
                type="button"
            >
                Sign Up
            </button>

        </div>


        <!-- =================================================
             LOGIN
        ================================================== -->

        <form
            id="login-form"
            class="auth-form"
        >

            <h1>
                Welcome back.
            </h1>

            <p class="form-description">
                Sign in to continue your StudySprint journey.
            </p>


            <label for="login-email">
                Email
            </label>

            <input
                id="login-email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="login-password">
                Password
            </label>

            <input
                id="login-password"
                type="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                🚀 Sign In
            </button>


            <div
                id="login-message"
                class="auth-message"
            ></div>

        </form>


        <!-- =================================================
             SIGN UP
        ================================================== -->

        <form
            id="signup-form"
            class="auth-form"
            style="display:none;"
        >

            <h1>
                Create your account.
            </h1>

            <p class="form-description">
                Join StudySprint and start leveling up.
            </p>


            <label for="signup-username">
                Username
            </label>

            <input
                id="signup-username"
                type="text"
                placeholder="Your username"
                maxlength="20"
                autocomplete="username"
                required
            >


            <label for="signup-email">
                Email
            </label>

            <input
                id="signup-email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="signup-password">
                Password
            </label>

            <input
                id="signup-password"
                type="password"
                placeholder="At least 6 characters"
                minlength="6"
                autocomplete="new-password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                ✨ Create Account
            </button>


            <div
                id="signup-message"
                class="auth-message"
            ></div>

        </form>


        <p class="auth-footer">
            StudySprint © 2026
        </p>


    </section>


</main>


<script
    type="module"
    src="auth.js"
></script>


</body>

</html>
