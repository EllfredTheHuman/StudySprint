```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>StudySprint | Sign In</title>

<link
    rel="stylesheet"
    href="auth.css"
>

</head>


<body>


<main class="auth-page">


    <div class="auth-brand">

        <div class="auth-logo">
            🚀 StudySprint
        </div>

        <p>
            LEARN • SPRINT • MASTER
        </p>

    </div>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <section
        id="login-section"
        class="auth-card"
    >

        <div class="auth-card-header">

            <span class="auth-label">
                WELCOME BACK
            </span>

            <h1>
                Sign in.
            </h1>

            <p>
                Continue your StudySprint journey.
            </p>

        </div>


        <form id="login-form">


            <label for="login-email">
                Email
            </label>

            <input
                id="login-email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >


            <label for="login-password">
                Password
            </label>

            <input
                id="login-password"
                type="password"
                autocomplete="current-password"
                placeholder="Your password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                SIGN IN
            </button>


        </form>


        <div
            id="login-message"
            class="auth-message"
        ></div>


        <div class="auth-switch">

            Don't have an account?

            <button
                id="show-signup"
                type="button"
            >
                Create one
            </button>

        </div>

    </section>


    <!-- =====================================================
         SIGN UP
    ====================================================== -->

    <section
        id="signup-section"
        class="auth-card hidden"
    >

        <div class="auth-card-header">

            <span class="auth-label">
                NEW PLAYER
            </span>

            <h1>
                Create account.
            </h1>

            <p>
                Start earning XP and leveling up.
            </p>

        </div>


        <form id="signup-form">


            <label for="signup-username">
                Username
            </label>

            <input
                id="signup-username"
                type="text"
                autocomplete="username"
                maxlength="20"
                placeholder="Your username"
                required
            >


            <label for="signup-email">
                Email
            </label>

            <input
                id="signup-email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >


            <label for="signup-password">
                Password
            </label>

            <input
                id="signup-password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                placeholder="At least 6 characters"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                CREATE ACCOUNT
            </button>


        </form>


        <div
            id="signup-message"
            class="auth-message"
        ></div>


        <div class="auth-switch">

            Already have an account?

            <button
                id="show-login"
                type="button"
            >
                Sign in
            </button>

        </div>

    </section>


</main>


<script
    type="module"
    src="auth.js"
></script>


</body>

</html>
```
