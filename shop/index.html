<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop | StudySprint</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="shop.css"
    >

</head>


<body class="shop-page">


<header class="shop-header">

    <a
        href="../index.html"
        class="shop-logo"
    >
        STUDY<span>SPRINT</span>
    </a>


    <div class="shop-currency">

        <div class="currency-coin">
            ●
        </div>

        <span id="coin-count">
            0
        </span>

        <span class="currency-label">
            COINS
        </span>

    </div>

</header>



<main class="shop-container">


    <section class="shop-intro">

        <div class="shop-tag">
            FORTNIGHTLY SHOP
        </div>

        <h1>
            Cosmetic Shop
        </h1>

        <p>
            Grab a new Goober, banner or title.
            The shop changes every two weeks.
        </p>

        <div class="shop-refresh">

            <span>
                NEXT ROTATION
            </span>

            <strong id="shop-countdown">
                Loading...
            </strong>

        </div>

    </section>



    <section
        id="shop-items"
        class="shop-grid"
    ></section>


</main>



<script src="shop.js"></script>

</body>

</html>
