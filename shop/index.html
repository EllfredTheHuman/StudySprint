```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop | StudySprint</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="shop.css"
    >

</head>


<body class="shop-page">


<header class="shop-header">

    <a
        href="../index.html"
        class="shop-logo"
    >
        STUDY<span>SPRINT</span>
    </a>


    <div class="shop-header-right">

        <div class="coin-display">

            <span class="coin-symbol">●</span>

            <span id="coin-count">
                0
            </span>

            <span class="coin-label">
                COINS
            </span>

        </div>


        <button
            id="mod-button"
            class="mod-button"
            type="button"
        >
            MOD
        </button>

    </div>

</header>



<main class="shop-container">


    <section class="shop-hero">

        <div>

            <div class="shop-kicker">
                STUDYSPRINT SHOP
            </div>

            <h1>
                Make it yours.
            </h1>

            <p class="shop-description">
                Grab banners, titles and frames
                to customise your StudySprint profile.
            </p>

        </div>


        <div class="rotation-box">

            <span>
                NEXT ROTATION
            </span>

            <strong id="shop-countdown">
                Loading...
            </strong>

        </div>

    </section>



    <section class="shop-section">

        <div class="section-heading">

            <div>

                <div class="section-label">
                    FEATURED
                </div>

                <h2>
                    Today's Shop
                </h2>

            </div>

        </div>


        <div
            id="shop-items"
            class="shop-grid"
        >
        </div>

    </section>


</main>



<div
    id="mod-overlay"
    class="mod-overlay"
>

    <div class="mod-panel">

        <div class="mod-header">

            <div>

                <div class="section-label">
                    DEVELOPER TOOLS
                </div>

                <h2>
                    Mod Panel
                </h2>

            </div>


            <button
                id="close-mod"
                class="close-mod"
                type="button"
            >
                ×
            </button>

        </div>



        <section class="mod-section">

            <h3>
                Give Coins
            </h3>

            <div class="mod-row">

                <input
                    id="mod-coins"
                    type="number"
                    min="0"
                    placeholder="Amount"
                >

                <button
                    id="give-coins"
                    class="mod-action"
                    type="button"
                >
                    GIVE
                </button>

            </div>

        </section>



        <section class="mod-section">

            <h3>
                Unlock Shop Item
            </h3>

            <div class="mod-row">

                <select
                    id="mod-item"
                    class="mod-select"
                >
                </select>

                <button
                    id="unlock-item"
                    class="mod-action"
                    type="button"
                >
                    UNLOCK
                </button>

            </div>

        </section>



        <section class="mod-section">

            <h3>
                Shop Controls
            </h3>

            <div class="mod-controls">

                <button
                    id="reroll-shop"
                    class="mod-action"
                    type="button"
                >
                    REROLL SHOP
                </button>

                <button
                    id="reset-shop"
                    class="mod-action"
                    type="button"
                >
                    RESET ROTATION
                </button>

                <button
                    id="clear-owned"
                    class="mod-action danger"
                    type="button"
                >
                    CLEAR SHOP ITEMS
                </button>

            </div>

        </section>



        <div
            id="mod-status"
            class="mod-status"
        >
        </div>

    </div>

</div>



<script src="shop.js"></script>

</body>

</html>
```
