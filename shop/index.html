<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"

<title>Shop | StudySprint</title>

<style>

/* =========================================================
   SHOP
========================================================= */

.shop-page {

    max-width:1200px;
    margin:auto;
    padding:35px 20px 80px;

}

.shop-header {

    text-align:center;
    margin-bottom:25px;

}

.shop-header h1 {

    font-size:46px;
    font-weight:900;
    margin-bottom:8px;

}

.shop-header p {

    color:#6b7280;
    font-size:18px;

}


/* =========================================================
   CURRENCY
========================================================= */

.currency-bar {

    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:25px auto 30px;

}

.currency {

    background:white;
    padding:12px 22px;
    border-radius:18px;
    font-size:18px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,0,0,.08);

}


/* =========================================================
   NAVIGATION
========================================================= */

.shop-navigation {

    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
    flex-wrap:wrap;

}

.shop-navigation button {

    border:none;
    padding:13px 24px;
    border-radius:15px;
    background:#e5e7eb;
    font-weight:900;
    cursor:pointer;
    transition:.2s;

}

.shop-navigation button:hover {

    transform:translateY(-2px);

}

.shop-navigation button.active {

    background:#6366f1;
    color:white;

}


/* =========================================================
   COUNTDOWN
========================================================= */

.shop-countdown {

    text-align:center;
    margin-bottom:35px;
    font-weight:800;
    color:#6b7280;

}

.shop-countdown strong {

    color:#6366f1;

}


/* =========================================================
   SECTION
========================================================= */

.shop-section {

    margin-bottom:50px;

}

.shop-section h2 {

    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;

}


/* =========================================================
   GRID
========================================================= */

.shop-grid,
.ticket-grid {

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:22px;

}


/* =========================================================
   CARD
========================================================= */

.shop-card,
.ticket-card {

    position:relative;
    background:white;
    border-radius:25px;
    padding:18px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.08);

    overflow:hidden;

    transition:
        transform .2s,
        box-shadow .2s;

}

.shop-card:hover,
.ticket-card:hover {

    transform:translateY(-6px);

    box-shadow:
        0 18px 40px rgba(0,0,0,.14);

}


/* =========================================================
   RARITY
========================================================= */

.rarity {

    position:absolute;

    top:13px;
    left:13px;

    padding:5px 10px;

    border-radius:9px;

    font-size:11px;
    font-weight:900;

    text-transform:uppercase;

    background:#e5e7eb;

    z-index:20;

}

.rarity.common {

    background:#e5e7eb;
    color:#374151;

}

.rarity.rare {

    background:#dbeafe;
    color:#1d4ed8;

}

.rarity.epic {

    background:#ede9fe;
    color:#7c3aed;

}

.rarity.legendary {

    background:#fef3c7;
    color:#b45309;

}

.rarity.pass {

    background:#fce7f3;
    color:#be185d;

}


/* =========================================================
   PREVIEW
========================================================= */

.item-preview,
.ticket-item-preview {

    height:220px;

    margin:-18px -18px 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc
        );

}


/* =========================================================
   CHARACTER
========================================================= */

.character {

    width:125px;
    height:180px;

    position:relative;

    transform-origin:center bottom;

    animation:
        characterFloat 3s ease-in-out infinite;

}

@keyframes characterFloat {

    0%,100% {

        transform:translateY(0);

    }

    50% {

        transform:translateY(-5px);

    }

}


/* =========================================================
   CHARACTER BODY
========================================================= */

.character .body {

    position:absolute;

    width:70px;
    height:65px;

    left:27px;
    top:68px;

    border-radius:
        25px
        25px
        18px
        18px;

    background:#6366f1;

    z-index:4;

}


/* =========================================================
   ARMS
========================================================= */

.character .arm {

    position:absolute;

    width:19px;
    height:54px;

    top:76px;

    border-radius:12px;

    background:#f3bd96;

    z-index:3;

}

.character .arm.left {

    left:14px;
    transform:rotate(10deg);

}

.character .arm.right {

    right:14px;
    transform:rotate(-10deg);

}


/* =========================================================
   HANDS
========================================================= */

.character .hand {

    position:absolute;

    width:19px;
    height:19px;

    border-radius:50%;

    background:#f3bd96;

    z-index:5;

}

.character .hand.left {

    left:10px;
    top:121px;

}

.character .hand.right {

    right:10px;
    top:121px;

}


/* =========================================================
   LEGS
========================================================= */

.character .leg {

    position:absolute;

    width:27px;
    height:48px;

    top:125px;

    border-radius:
        10px
        10px
        13px
        13px;

    background:#374151;

    z-index:2;

}

.character .leg.left {

    left:31px;

}

.character .leg.right {

    right:31px;

}


/* =========================================================
   SHOES
========================================================= */

.character .shoe {

    position:absolute;

    width:34px;
    height:14px;

    top:164px;

    border-radius:
        10px
        10px
        7px
        7px;

    background:#111827;

    z-index:5;

}

.character .shoe.left {

    left:24px;

}

.character .shoe.right {

    right:24px;

}


/* =========================================================
   HEAD
========================================================= */

.character .head {

    position:absolute;

    width:82px;
    height:82px;

    left:21px;
    top:5px;

    border-radius:45%;

    background:#f3bd96;

    z-index:8;

}


/* =========================================================
   EARS
========================================================= */

.character .ear {

    height:25px;

    top:34px;

    background:#e8ad89;

.character .ear.left {

    left:16px;

}

.character .ear.right {

    right:16px;

}


/* =========================================================

========================================================= */

.character .eye {

.character .eye.left {

}

.character .eye.right {

    left:71px;

}


.character .mouth {

    width:16px;
    height:8px;

    left:54px;
    top:58px;

    border-bottom:

    border-radius:50%;

    z-index:12;

}


/* =========================================================
   HAIR
========================================================= */

.character .hair {

    position:absolute;

    width:82px;
    height:34px;

    left:21px;
    top:2px;

    border-radius:
        45px
        45px
        15px
        15px;

    background:#3b2a24;

    z-index:10;

}


/* =========================================================
   CHARACTER VARIANTS
========================================================= */

.character.blue .body {

    background:#3b82f6;

}

.character.green .body {

    background:#22c55e;

}

.character.red .body {

    background:#ef4444;

}

.character.orange .body {

    background:#f97316;

}

.character.yellow .body {

    background:#eab308;

}

.character.purple .body {

    background:#8b5cf6;

}

.character.cyan .body {

    background:#06b6d4;

}

.character.pink .body {

    background:#ec4899;

}

.character.dark .body {

    background:#334155;

}


/* =========================================================

========================================================= */

.character.blonde .hair {

.character.blackhair .hair {

.character.redhair .hair {

    background:#b45309;

.character.whitehair .hair {

    background:#e5e7eb;

.character.purplehair .hair {

    background:#7c3aed;

/* =========================================================
   ACCESSORIES
========================================================= */

.character .accessory {

    position:absolute;

    z-index:20;

    pointer-events:none;

/* glasses */

.character.glasses .accessory {

    height:17px;

    left:31px;
    top:35px;

    border:

    border-radius:8px;

}


/* headphones */

.character.headphones .accessory {

    width:91px;
    height:78px;

    left:17px;
    top:7px;

    border:
        8px solid #374151;

    border-bottom:none;

    border-radius:
        50px
        50px
        0
        0;

}


/* crown */

.character.crown .accessory {

    width:65px;
    height:42px;

    left:30px;
    top:-22px;

    background:
        linear-gradient(
            180deg,
            #fff7ae,
            #ffd43b,
            #d99a00
        );

    clip-path:polygon(
        0 100%,
        10% 20%,
        30% 60%,
        50% 0,
        70% 60%,
        90% 20%,
        100% 100%
    );

    filter:
        drop-shadow(
            0 0 7px #ffd43b
        );

}


/* wizard */

.character.wizard .accessory {

    width:0;
    height:0;

    left:25px;
    top:-38px;

    border-left:38px solid transparent;
    border-right:38px solid transparent;
    border-bottom:65px solid #7c3aed;

    filter:
        drop-shadow(
            0 4px 4px rgba(0,0,0,.2)
        );

}


/* =========================================================
   CHARACTER DATA LABEL
========================================================= */

.character-name {

    position:absolute;

    bottom:15px;

    font-size:12px;

    font-weight:900;

    color:rgba(17,24,39,.35);

}


/* =========================================================
   BANNER PREVIEW
========================================================= */

.banner-preview {

    width:180px;
    height:115px;

    border-radius:18px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.15);

}

.banner-sprint {

    background:
        linear-gradient(
            135deg,
            #312e81,
            #6366f1
        );

    background-image:
        linear-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            135deg,
            #312e81,
            #6366f1
        );

    background-size:
        18px 18px,
        18px 18px,
        auto;

}

.banner-sunset {

    background:
        linear-gradient(
            135deg,
            #f97316,
            #ec4899
        );

}

.banner-ocean {

    background:
        linear-gradient(
            135deg,
            #0284c7,
            #22d3ee
        );

}

.banner-space {

    background:

            white 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 70% 65%,
            white 0 2px,
            transparent 3px
        ),
        linear-gradient(
            135deg,
            #111827,
            #4c1d95
        );

/* =========================================================
   EFFECT PREVIEWS
========================================================= */

.effect-preview {

    width:145px;
    height:145px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:55px;

}


/* =========================================================
   TICKET SHOP
========================================================= */

#ticket-shop {

    display:none;

}

.crown-card {

    background:
        linear-gradient(
            145deg,
            #fffdf0,
            #fff7c2
        );

}


/* =========================================================
   CARD CONTENT
========================================================= */

.shop-card h3,
.ticket-card h3 {

    margin:8px 0 4px;

    font-size:20px;
    font-weight:900;

}

.shop-card p,
.ticket-card p {

    color:#6b7280;

    margin:4px 0;

    min-height:22px;

}

.shop-price,
.ticket-price {

    margin-top:15px;

    font-weight:900;
    font-size:17px;

}


/* =========================================================
   BUY
========================================================= */

.buy-button {

    width:100%;

    margin-top:14px;

    border:none;

    border-radius:14px;

    padding:12px;

    background:#6366f1;

    color:white;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;

}

.buy-button:hover:not(:disabled) {

    transform:translateY(-2px);

    filter:brightness(1.08);

}

.buy-button:disabled {

    background:#d1d5db;
    color:#6b7280;
    cursor:default;

}


/* =========================================================
   DEBUG
========================================================= */

.debug-button {

    display:block;

    margin:40px auto 0;

    border:none;

    border-radius:14px;

    padding:11px 20px;

    background:#111827;

    color:white;

    font-weight:900;

    cursor:pointer;

    opacity:.65;

}

.debug-button:hover {

    opacity:1;
    transform:translateY(-2px);

}


/* =========================================================
   DEBUG OVERLAY
========================================================= */

.debug-overlay {

    position:fixed;

    inset:0;

    z-index:999999;

    background:rgba(0,0,0,.55);

    display:flex;

    align-items:center;
    justify-content:center;

    font-family:Arial,sans-serif;

}

.debug-box {

    width:360px;

    max-width:90%;

    background:white;

    padding:25px;

    border-radius:22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.3);

}

.debug-box h2 {

    margin-top:0;

}

.debug-box select,
.debug-box input {

    width:100%;

    box-sizing:border-box;

    padding:12px;

    border-radius:10px;

    border:1px solid #ddd;

    margin-bottom:12px;

}

.debug-apply,
.debug-close {

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    font-weight:800;

    cursor:pointer;

}

.debug-apply {

    background:#4f46e5;
    color:white;

}

.debug-close {

    background:#eee;
    margin-top:8px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px) {

    .shop-grid,
    .ticket-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

    }

}

@media(max-width:500px) {

    .shop-grid,
    .ticket-grid {

        grid-template-columns:1fr;

    }

    .shop-header h1 {

        font-size:36px;

    }

}

</style>

</head>

/* =========================================================

========================================================= */

function getOwnedItems() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "shopOwnedItems"
            )
        ) || [];

    }

    catch {

        return [];

    }

}


function saveOwnedItems(items) {

    localStorage.setItem(
        "shopOwnedItems",
        JSON.stringify(items)
    );

}


function ownsItem(id) {

    return getOwnedItems()
        .includes(id);

}


/* =========================================================
   UNLOCK
========================================================= */

function unlockItem(id,type) {

    const keys = {

        Character:
            "unlocked_characters",

        Banner:
            "unlocked_banners",

        Effect:
            "unlocked_effects",

        Hat:
            "unlocked_hats"

    };

    const key =
        keys[type];

    if(!key)
        return;

    let unlocked = [];

    try {

        unlocked =
            JSON.parse(
                localStorage.getItem(key)
            ) || [];

    }

    catch {

        unlocked = [];

    }

    if(
        !unlocked.includes(id)
    ) {

        unlocked.push(id);

    }

    localStorage.setItem(
        key,
        JSON.stringify(unlocked)
    );

}

/* =========================================================
   GENERATE SHOP
========================================================= */

function generateShop() {

    const shuffled =
        [...ROTATING_ITEMS]
            .sort(
                () =>
                    Math.random() - .5
            );


    /*
        EXACTLY SIX ITEMS.
    */

    const selected =
        shuffled
            .slice(0,6)
            .map(
                item =>
                    item.id
            );


    localStorage.setItem(
        "fortnightlyShopItems",
        JSON.stringify(selected)
    );


    localStorage.setItem(
        "fortnightlyShopStart",
        Date.now()
    );


    return selected;

}


/* =========================================================
   CURRENT SHOP
========================================================= */

function getCurrentShop() {

    let items = null;

    try {

        items =
            JSON.parse(
                localStorage.getItem(
                    "fortnightlyShopItems"
                )
            );

    }

    catch {

        items = null;

    }


    const start =
        Number(
            localStorage.getItem(
                "fortnightlyShopStart"
            )
        ) || 0;


    /*
        Old shop data with 8
        or fewer items gets replaced.
    */

    if(
        !Array.isArray(items) ||
        items.length !== 6 ||
        !start
    ) {

        return generateShop();

    }


    if(
        Date.now() -
        start >=
        SHOP_REFRESH_TIME
    ) {

        return generateShop();

    }


    return items;

}

    return ROTATING_ITEMS.find(
        item =>
            item.id === id

/* =========================================================
   BUY MAIN ITEM
========================================================= */

function buyMainItem(
    item,
    button
) {

    if(
        ownsItem(
            item.id
        )
    )
        return;


    const coins =
        getCoins();


    if(
        coins <
        item.price
    ) {

        alert(
            "You don't have enough coins!"
        );

        return;

    }


    setCoins(
        coins -
        item.price
    );


    unlockItem(
        item.id,
        item.type
    );


    const owned =
        getOwnedItems();


    if(
        !owned.includes(
            item.id
        )
    ) {

        owned.push(
            item.id
        );

    }


    saveOwnedItems(
        owned
    );


    button.disabled =
        true;

    button.textContent =
        "OWNED";


    updateCurrency();

}

/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown() {

    const element =
        document.getElementById(
            "countdown"
        );


    if(!element)
        return;


    let start =
        Number(
            localStorage.getItem(
                "fortnightlyShopStart"
            )
        ) || 0;


    if(!start) {

        getCurrentShop();

        start =
            Number(
                localStorage.getItem(
                    "fortnightlyShopStart"
                )
            );

    }


    let remaining =
        start +
        SHOP_REFRESH_TIME -
        Date.now();


    if(
        remaining <= 0
    ) {

        generateShop();

        displayMainShop();

        start =
            Number(
                localStorage.getItem(
                    "fortnightlyShopStart"
                )
            );

        remaining =
            start +
            SHOP_REFRESH_TIME -
            Date.now();

    }


    const days =
        Math.floor(
            remaining /
            86400000
        );


    const hours =
        Math.floor(
            remaining %
            86400000 /
            3600000
        );


    const minutes =
        Math.floor(
            remaining %
            3600000 /
            60000
        );


    const seconds =
        Math.floor(
            remaining %
            60000 /
            1000
        );


    element.textContent =
        days +
        "d " +
        hours +
        "h " +
        minutes +
        "m " +
        seconds +
        "s";

}

/* =========================================================
   DEBUG POPUP
========================================================= */

function openDebug() {

    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "debug-overlay";


    const box =
        document.createElement(
            "div"
        );

    box.className =
        "debug-box";


    box.innerHTML = `

        <h2>
            🛠️ StudySprint Debug
        </h2>

        <p>
            What do you want to change?
        </p>

        <select id="debug-type">

            <option value="xp">
                ⭐ XP
            </option>

            <option value="coins">
                🪙 Coins
            </option>

            <option value="tickets">
                🎟️ Tickets
            </option>

            <option value="streak">
                🔥 Streak
            </option>

            <option value="reset">
                🗑️ Reset Account
            </option>

        </select>


        <input
            id="debug-value"
            type="number"
            placeholder="Amount"
        >


        <button
            class="debug-apply"
            id="debug-apply"
        >
            Apply
        </button>


        <button
            class="debug-close"
            id="debug-close"
        >
            Cancel
        </button>

    `;


    overlay.appendChild(
        box
    );

    document.body.appendChild(
        overlay
    );


    const type =
        box.querySelector(
            "#debug-type"
        );


    const value =
        box.querySelector(
            "#debug-value"
        );


    function updateInput() {

        value.style.display =
            type.value === "reset"
                ? "none"
                : "block";

    }


    type.addEventListener(
        "change",
        updateInput
    );


    updateInput();


    box.querySelector(
        "#debug-close"
    ).onclick =
        () => {

            overlay.remove();

        };


    box.querySelector(
        "#debug-apply"
    ).onclick =
        () => {

            const selected =
                type.value;


            if(
                selected === "reset"
            ) {

                const confirmed =
                    confirm(
                        "⚠️ Reset your entire StudySprint account?"
                    );


                if(!confirmed)
                    return;


                localStorage.clear();

                alert(
                    "✅ Account reset!"
                );

                location.reload();

                return;

            }


            const amount =
                Number(
                    value.value
                );


            if(
                !Number.isFinite(
                    amount
                )
            ) {

                alert(
                    "Enter a valid number."
                );

                return;

            }


            const keys = {

                xp:"xp",

                coins:"coins",

                tickets:"shopTickets",

                streak:"streak"

            };


            localStorage.setItem(
                keys[selected],
                amount
            );


            alert(
                "✅ " +
                selected +
                " set to " +
                amount +
                "!"
            );


            overlay.remove();

            location.reload();

        };

}
