<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop | StudySprint</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="shop.css"
    >

</head>


<body class="shop-page">


<header class="shop-header">

    <h1>
        STUDY<span>SPRINT</span>
    </h1>


    <div class="shop-currency">

        <span class="coin-icon">●</span>

        <span id="coin-count">
            0
        </span>

        <span>
            COINS
        </span>

    </div>

</header>



<main class="shop-container">


    <section class="shop-intro">

        <h2>
            Cosmetic Shop
        </h2>

        <p>
            Customise your avatar with hats,
            accessories, outfits and more.
        </p>

        <div class="shop-refresh">

            NEXT ROTATION:
            <span id="shop-countdown">
                Loading...
            </span>

        </div>

    </section>



    <section
        id="shop-items"
        class="shop-grid"
    >

        <!-- Shop items generated by shop.js -->

    </section>


</main>



<script src="shop.js"></script>

</body>

</html>
