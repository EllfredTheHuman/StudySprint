<style>

/* ==================================================
   SHOP PAGE
================================================== */

.shop-page {
    max-width:1200px;
    margin:auto;
    padding:35px 20px 80px;
}

.shop-header {
    text-align:center;
    margin-bottom:25px;
}

.shop-header h1 {
    font-size:46px;
    font-weight:900;
    margin-bottom:8px;
}

.shop-header p {
    color:#6b7280;
    font-size:18px;
}

/* ==================================================
   CURRENCY
================================================== */

.currency-bar {
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:25px auto 35px;
}

.currency {
    background:white;
    padding:12px 22px;
    border-radius:18px;
    font-size:18px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

/* ==================================================
   COUNTDOWN
================================================== */

.shop-countdown {
    text-align:center;
    margin-bottom:30px;
    font-weight:800;
    color:#6b7280;
}

.shop-countdown strong {
    color:#6366f1;
}

/* ==================================================
   NAVIGATION
================================================== */

.shop-navigation {
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:35px;
    flex-wrap:wrap;
}

.shop-navigation button {
    border:none;
    padding:13px 24px;
    border-radius:15px;
    background:#e5e7eb;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.shop-navigation button:hover {
    transform:translateY(-2px);
}

.shop-navigation button.active {
    background:#6366f1;
    color:white;
}

/* ==================================================
   SHOP SECTION
================================================== */

.shop-section {
    margin-bottom:50px;
}

.shop-section h2 {
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;
}

.shop-grid,
.ticket-grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

/* ==================================================
   SHOP CARD
================================================== */

.shop-card,
.ticket-card {
    position:relative;
    background:white;
    border-radius:25px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.2s;
    overflow:hidden;
}

.shop-card:hover,
.ticket-card:hover {
    transform:translateY(-6px);
    box-shadow:0 18px 40px rgba(0,0,0,.14);
}

/* ==================================================
   RARITY
================================================== */

.rarity {
    position:absolute;
    top:13px;
    left:13px;
    padding:5px 10px;
    border-radius:9px;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    background:#e5e7eb;
    z-index:20;
}

.rarity.rare {
    background:#dbeafe;
    color:#1d4ed8;
}

.rarity.ultra {
    background:#ede9fe;
    color:#7c3aed;
}

.rarity.mythic {
    background:#fce7f3;
    color:#be185d;
}

.rarity.legendary {
    background:#fef3c7;
    color:#b45309;
}

/* ==================================================
   PREVIEW
================================================== */

.item-preview,
.ticket-item-preview {
    height:210px;
    margin:-18px -18px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
}

/* ==================================================
   GOOBER CHARACTER
================================================== */

.goober {
    position:relative;
    width:125px;
    height:145px;
    transform:translateY(5px);
    transition:.25s;
}

.shop-card:hover .goober {
    transform:
        translateY(-4px)
        scale(1.04);
}

/*
   Main body.
   These are intentionally NOT human-shaped.
*/

.goober-body {
    position:absolute;
    left:17px;
    top:32px;
    width:91px;
    height:91px;

    border-radius:
        45% 55% 48% 52% /
        48% 45% 55% 52%;

    background:#6366f1;

    box-shadow:
        inset 0 -8px 0 rgba(0,0,0,.08),
        0 10px 18px rgba(0,0,0,.12);

    z-index:3;
}

/* little feet */

.goober-foot {
    position:absolute;
    width:32px;
    height:18px;
    top:112px;
    border-radius:50%;
    background:#4f46e5;
    z-index:2;
}

.goober-foot.left {
    left:22px;
    transform:rotate(8deg);
}

.goober-foot.right {
    right:22px;
    transform:rotate(-8deg);
}

/* eyes */

.goober-eye {
    position:absolute;
    width:13px;
    height:18px;
    top:62px;
    border-radius:50%;
    background:#111827;
    z-index:8;
}

.goober-eye.left {
    left:43px;
}

.goober-eye.right {
    right:43px;
}

/* eye shine */

.goober-eye::after {
    content:"";
    position:absolute;
    width:4px;
    height:5px;
    top:3px;
    left:3px;
    border-radius:50%;
    background:white;
}

/* mouth */

.goober-mouth {
    position:absolute;
    width:25px;
    height:13px;
    left:50px;
    top:88px;
    border-bottom:4px solid #111827;
    border-radius:0 0 50% 50%;
    z-index:8;
}

/* tiny arms */

.goober-arm {
    position:absolute;
    width:27px;
    height:14px;
    top:78px;
    border-radius:50%;
    background:#5558d8;
    z-index:2;
}

.goober-arm.left {
    left:2px;
    transform:rotate(25deg);
}

.goober-arm.right {
    right:2px;
    transform:rotate(-25deg);
}

/* ==================================================
   GOOBER THEMES
================================================== */

.goober.ocean .goober-body {
    background:#06b6d4;
}

.goober.ocean .goober-foot,
.goober.ocean .goober-arm {
    background:#0891b2;
}

.goober.sunny .goober-body {
    background:#facc15;
}

.goober.sunny .goober-foot,
.goober.sunny .goober-arm {
    background:#eab308;
}

.goober.lime .goober-body {
    background:#84cc16;
}

.goober.lime .goober-foot,
.goober.lime .goober-arm {
    background:#65a30d;
}

}

.goober.berry .goober-foot,

}

.goober.fire .goober-body {

}

.goober.fire .goober-foot,
.goober.fire .goober-arm {
    background:#ea580c;
}

.goober.mint .goober-body {
    background:#34d399;
}

.goober.mint .goober-foot,
.goober.mint .goober-arm {
    background:#059669;
}

.goober.rose .goober-body {
    background:#fb7185;
}

.goober.rose .goober-foot,
.goober.rose .goober-arm {
    background:#e11d48;
}

.goober.shadow .goober-body {

}

.goober.shadow .goober-foot,

    background:#1f2937;
}

.goober.sky .goober-body {
    background:#60a5fa;
}

.goober.sky .goober-foot,
.goober.sky .goober-arm {
    background:#2563eb;
}

.goober.gold .goober-body {
    background:#f59e0b;
}

.goober.gold .goober-foot,
.goober.gold .goober-arm {
    background:#d97706;
}

/* ==================================================
   CHARACTER ACCESSORIES
================================================== */

.goober-accessory {
    position:absolute;
    z-index:15;
}

/* antenna */

.accessory-antenna {
    width:7px;
    height:30px;
    left:59px;
    top:7px;
    background:#374151;
    border-radius:10px;
}

.accessory-antenna::after {
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    left:-3px;
    top:-7px;
    border-radius:50%;
    background:#f43f5e;
}

/* crown */

.accessory-crown {
    width:72px;
    height:40px;
    left:26px;
    top:4px;

    background:
        linear-gradient(
            180deg,
            #fff7ae,
            #ffd43b 45%,
            #d99a00
        );

    clip-path:polygon(
        0 25%,
        18% 58%,
        32% 8%,
        50% 58%,
        68% 8%,
        82% 58%,
        100% 25%,
        90% 100%,
        10% 100%
    );

    filter:drop-shadow(0 0 7px #ffd43b);
    animation:crownFloat 2s ease-in-out infinite;
}

@keyframes crownFloat {
    0%,100% {
        transform:translateY(0);
    }

    50% {
        transform:translateY(-5px);
    }
}

/* ==================================================
   EFFECT PREVIEWS
================================================== */

.preview-effect {
    position:absolute;
    inset:20px;
    border-radius:50%;
    pointer-events:none;
    z-index:1;
}

.preview-effect.sparkle {
    background:
        radial-gradient(circle at 15% 20%,white 0 3px,transparent 4px),
        radial-gradient(circle at 85% 20%,white 0 3px,transparent 4px),
        radial-gradient(circle at 80% 80%,white 0 3px,transparent 4px),
        radial-gradient(circle at 20% 80%,white 0 2px,transparent 3px);

    animation:spin 3s linear infinite;
}

.preview-effect.fire {
    box-shadow:
        0 0 15px #ff4500,
        0 0 35px #ff7300,
        inset 0 0 25px #ff4500;

    border:5px solid #ff7300;
    animation:firePulse .7s infinite alternate;
}

.preview-effect.lightning {
    border:4px solid #fde047;
    box-shadow:
        0 0 15px #facc15,
        inset 0 0 20px #facc15;

    animation:flash .6s infinite;
}

.preview-effect.rainbow {
    border:7px solid transparent;

    background:
        linear-gradient(white,white) padding-box,
        conic-gradient(
            red,
            orange,
            yellow,
            lime,
            cyan,
            blue,
            violet,
            red
        ) border-box;

    animation:spin 4s linear infinite;
}

.preview-effect.glitch {
    border:4px dashed #22d3ee;
    box-shadow:
        5px 0 #ec4899,
        -5px 0 #22d3ee;

    animation:glitch .2s infinite;
}

.preview-effect.shadow {
    box-shadow:
        0 0 35px #111827,
        inset 0 0 30px #111827;
}

.preview-effect.crystal {
    border:5px solid #67e8f9;
    box-shadow:
        0 0 15px #67e8f9,
        0 0 30px #22d3ee;

    animation:firePulse 1.2s infinite alternate;
}

.preview-effect.cosmic {
    background:
        radial-gradient(circle at 20% 20%,white 0 2px,transparent 3px),
        radial-gradient(circle at 80% 30%,#c084fc 0 3px,transparent 4px),
        radial-gradient(circle at 30% 80%,#60a5fa 0 2px,transparent 3px),
        radial-gradient(circle at 75% 75%,white 0 2px,transparent 3px);

    box-shadow:0 0 30px #8b5cf6;
    animation:spin 5s linear infinite;
}

/* ==================================================
   ANIMATIONS
================================================== */

@keyframes spin {
    to {
        transform:rotate(360deg);
    }
}

@keyframes firePulse {
    from {
        transform:scale(.94);
    }

    to {
        transform:scale(1.04);
    }
}

@keyframes flash {
    0%,100% {
        opacity:.35;
    }

    20% {
        opacity:1;
    }

    25% {
        opacity:.4;
    }

    30% {
        opacity:1;
    }
}

@keyframes glitch {
    0% {
        transform:translate(0);
    }

    25% {
        transform:translate(3px,-2px);
    }

    50% {
        transform:translate(-3px,2px);
    }

    75% {
        transform:translate(2px,3px);
    }

    100% {
        transform:translate(0);
    }
}

/* ==================================================
   BANNER PREVIEW
================================================== */

.banner-preview {

    height:105px;
    border-radius:18px;

.banner-sprint {

.shop-card h3,

    font-size:20px;

.shop-card p,
.ticket-card p {

.shop-price,

}

/* ==================================================
   BUY BUTTON
================================================== */

.buy-button {
    width:100%;
    margin-top:14px;
    border:none;
    border-radius:14px;
    padding:12px;
    background:#6366f1;
    color:white;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.buy-button:hover:not(:disabled) {
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.buy-button:disabled {
    background:#d1d5db;
    color:#6b7280;
    cursor:default;
}

/* ==================================================
   TICKET SHOP
================================================== */

#ticket-shop {
    display:none;
}

.ticket-card {
    background:
        linear-gradient(
            145deg,
            white,
            #f5f3ff
        );
}

.crown-card {
    background:
        linear-gradient(
            145deg,
            #fffdf0,
            #fff7c2
        );

    box-shadow:
        0 10px 30px rgba(234,179,8,.18);
}

/* ==================================================
   DEBUG BUTTON
================================================== */

.debug-area {
    margin-top:70px;
    text-align:center;
}

.debug-button {
    border:none;
    background:#111827;
    color:white;
    padding:11px 18px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
    opacity:.75;
}

.debug-button:hover {
    opacity:1;
    transform:translateY(-2px);
}

/* ==================================================
   DEBUG POPUP
================================================== */

.debug-overlay {
    position:fixed;
    inset:0;
    z-index:999999;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
}

.debug-box {
    width:360px;
    max-width:90%;
    background:white;
    padding:25px;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.debug-box h2 {
    margin-top:0;
}

.debug-select,
.debug-input {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:12px;
    font-size:15px;
}

.debug-apply,
.debug-close {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
}

.debug-apply {
    background:#4f46e5;
    color:white;
}

.debug-close {
    background:#eee;
    margin-top:8px;
}

/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:800px) {

    .shop-grid,
    .ticket-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:500px) {

    .shop-header h1 {
        font-size:36px;
    }

    .shop-grid,
    .ticket-grid {
        grid-template-columns:1fr;
    }

}

</style>

</head>

        Effect:"unlocked_effects",

        Hat:"unlocked_hats"

    };

    const key =
        keys[type];

    if(!key)
        return;

    let unlocked = [];

    try {

        unlocked =
            JSON.parse(
                localStorage.getItem(key)
            ) || [];

    catch {

        unlocked = [];

    if(
        !unlocked.includes(id)

        key,

/* ==================================================
   SECOND SUNDAY CALCULATOR
================================================== */

function getSecondSunday(
    year,
    month
) {

    const date =
        new Date(
            year,
            month,
            1
        );

    const firstDay =
        date.getDay();

    const daysToSunday =
        (7 - firstDay) % 7;

    const firstSunday =
        1 +
        daysToSunday;

    return firstSunday + 7;

}


/* ==================================================
   NEXT SHOP REFRESH
================================================== */

function getNextShopRefresh() {

    const now =
        new Date();

    let year =
        now.getFullYear();

    let month =
        now.getMonth();

    /*
       We treat the displayed schedule as AEST
       (UTC+10), which is the fixed Australian
       Eastern Standard Time schedule requested
       for StudySprint.
    */

    function makeRefresh(
        y,
        m,
        day
    ) {

        /*
           12:00 AM AEST =
           14:00 UTC on the previous day.
        */

        return new Date(
            Date.UTC(
                y,
                m,
                day - 1,
                14,
                0,
                0,
                0
            )
        );

    }

    let day =
        getSecondSunday(
            year,
            month
        );

    let refresh =
        makeRefresh(
            year,
            month,
            day
        );

    if(
        refresh <= now
    ) {

        month++;

        if(
            month > 11
        ) {

            month = 0;
            year++;

        }

        day =
            getSecondSunday(
                year,
                month
            );

        refresh =
            makeRefresh(
                year,
                month,
                day
            );

    }

    return refresh;

}


/* ==================================================
   SHOP ROTATION KEY
================================================== */

function getRotationKey() {

    const refresh =
        getNextShopRefresh();

    const previous =
        new Date(
            refresh.getTime() -
            14 * 24 * 60 * 60 * 1000
        );

    return (
        previous.getUTCFullYear() +
        "-" +
        String(
            previous.getUTCMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            previous.getUTCDate()
        ).padStart(2,"0")
    );

}


/* ==================================================
   DETERMINISTIC SHUFFLE
================================================== */

function seededRandom(seed) {

    let value = 0;

    for(
        let i = 0;
        i < seed.length;
        i++
    ) {

        value =
            (
                value * 31 +
                seed.charCodeAt(i)
            ) >>> 0;

    }

    return function() {

        value =
            (
                value * 1664525 +
                1013904223
            ) >>> 0;

        return value / 4294967296;

    };

}


/* ==================================================
   GENERATE SHOP
================================================== */

function generateShop() {

    const items =
        getAllShopItems();

    const random =
        seededRandom(
            getRotationKey()
        );

    const shuffled =
        [...items];

    for(
        let i =
            shuffled.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                random() *
                (i + 1)
            );

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }

    const selected =
        shuffled
            .slice(
                0,
                SHOP_ITEMS_PER_ROTATION
            )
            .map(
                item => item.id
            );

    localStorage.setItem(
        "fortnightlyShopItems",
        JSON.stringify(selected)
    );

    localStorage.setItem(
        "fortnightlyShopRotation",
        getRotationKey()
    );

    return selected;

}


/* ==================================================
   CURRENT SHOP
================================================== */

function getCurrentShop() {

    const rotation =
        getRotationKey();

    let savedRotation =
        localStorage.getItem(
            "fortnightlyShopRotation"
        );

    let items = null;

    try {

        items =
            JSON.parse(
                localStorage.getItem(
                    "fortnightlyShopItems"
                )
            );

    }

    catch {

        items = null;

    }

    if(
        savedRotation !== rotation ||
        !Array.isArray(items) ||
        items.length !==
            SHOP_ITEMS_PER_ROTATION
    ) {

        return generateShop();

    }

    return items;

}

function updateCountdown() {

    const element =
        document.getElementById(
            "countdown"
        );

    if(!element)
        return;

    const refresh =
        getNextShopRefresh();

    const remaining =
        refresh.getTime() -
        Date.now();

    if(
        remaining <= 0
    ) {

        generateShop();

        displayMainShop();

        return;

    }

    const days =
        Math.floor(
            remaining /
            86400000
        );

    const hours =
        Math.floor(
            (
                remaining %
                86400000
            ) /
            3600000
        );

    const minutes =
        Math.floor(
            (
                remaining %
                3600000
            ) /
            60000
        );

    const seconds =
        Math.floor(
            (
                remaining %
                60000
            ) /
            1000
        );

    element.textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;

}
