<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Results | StudySprint</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>


<nav>

<a href="../index.html">Home</a>

<a href="index.html">📚 Study</a>

<a href="../profile/index.html">👤 Profile</a>

</nav>


</header>





<main>


<section class="results-screen">


<div class="results-card">


<h1>
🎉 Quiz Complete!
</h1>



<h2 id="message">
Great job!
</h2>



<div class="score-circle">

<p>
Score
</p>

<h3 id="score">
0/0
</h3>

</div>




<div class="result-stats">


<div class="stat">

<h2 id="xp">
⭐ +0 XP
</h2>

<p>
Experience
</p>

</div>




<div class="stat">

<h2 id="percentage">
🎯 0%
</h2>

<p>
Accuracy
</p>

</div>


</div>





<h2>
🏆 Achievements
</h2>


<div id="new-achievements">

</div>





<br>


<a href="index.html" class="main-button">
📚 Study Again
</a>


<a href="../index.html" class="main-button">
🏠 Home
</a>



</div>


</section>


</main>





<footer>

© 2026 StudySprint

</footer>




<script src="../achievements.js"></script>


<script>


let score =
localStorage.getItem("quizScore");


let total =
localStorage.getItem("quizTotal");


let percentage =
localStorage.getItem("quizPercentage");


let xp =
localStorage.getItem("quizXP");



document.getElementById("score").textContent =
score + "/" + total;


document.getElementById("percentage").textContent =
"🎯 " + percentage + "%";


document.getElementById("xp").textContent =
"⭐ +" + xp + " XP";





let message =
document.getElementById("message");



if(percentage == 100){

message.textContent =
"🏆 Perfect Score!";

}

else if(percentage >= 80){

message.textContent =
"🔥 Amazing Work!";

}

else if(percentage >= 50){

message.textContent =
"👍 Good Progress!";

}

else{

message.textContent =
"💪 Keep Practicing!";

}





let unlocked =
JSON.parse(
localStorage.getItem("newAchievements")
) || [];



let box =
document.getElementById("new-achievements");



if(unlocked.length === 0){

box.textContent =
"No new achievements.";

}

else{


unlocked.forEach(id=>{


let a =
achievements[id];


let div =
document.createElement("div");


div.className =
"achievement";


div.textContent =
"🏆 " + a.name;



box.appendChild(div);


});


}



</script>


</body>

</html>
