<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results | StudySprint</title>

<link rel="stylesheet" href="../css/style.css">

</head>



<body>




<header>


<div class="logo">

🚀 StudySprint

</div>



<nav>

<a href="../index.html">Home</a>

<a href="index.html">📚 Study</a>

<a href="../profile/index.html">👤 Profile</a>

</nav>


</header>









<section class="results-screen">



<div class="results-card">



<h1>

🎉 Quiz Complete!

</h1>





<h2 id="message">

Great job!

</h2>







<div class="score-circle">


<p>

Score

</p>


<h3 id="score">

8/10

</h3>


</div>








<div class="result-stats">



<div>

⭐

<h3 id="xp">

+80 XP

</h3>

</div>





<div>

🎯

<h3 id="percentage">

80%

</h3>

</div>



</div>








<a href="index.html" class="main-button">

📚 Study Again

</a>




<a href="../index.html" class="main-button">

🏠 Home

</a>



</div>


</section>








<footer>

© 2026 StudySprint

</footer>






<script>


let score =
localStorage.getItem("quizScore");


let total =
localStorage.getItem("quizTotal");


let percentage =
localStorage.getItem("quizPercentage");


let xp =
localStorage.getItem("quizXP");





document.getElementById("score").textContent =
score + "/" + total;




document.getElementById("percentage").textContent =
percentage + "%";





document.getElementById("xp").textContent =
"+" + xp + " XP";





let message =
document.getElementById("message");



if(percentage == 100){


message.textContent =
"🏆 Perfect Score!";


}



else if(percentage >= 80){


message.textContent =
"🔥 Amazing Work!";


}



else if(percentage >= 50){


message.textContent =
"👍 Good Progress!";


}



else{


message.textContent =
"💪 Keep Practicing!";


}



</script>





</body>

</html>
