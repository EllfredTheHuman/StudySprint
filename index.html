<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#09090f"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>StudySprint</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;

            overflow-x: hidden;

            background: #09090f;
            color: #ffffff;
        }

        body {
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                24px
                24px
                calc(24px + env(safe-area-inset-bottom));

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        .loading {
            width: 100%;
            max-width: 320px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .logo {
            margin-bottom: 24px;

            font-size: 28px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .spinner {
            width: 26px;
            height: 26px;

            border: 3px solid #24232f;
            border-top-color: #8875f5;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        .message {
            margin-top: 18px;

            color: #777481;

            font-size: 13px;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>


    <div class="loading">

        <div class="logo">
            StudySprint
        </div>

        <div class="spinner"></div>

        <div class="message">
            Loading...
        </div>

    </div>



    <script type="module">

        import {
            createClient
        } from "https://esm.sh/@supabase/supabase-js@2";


        const SUPABASE_URL =
            "https://yfteudoecpkosxjucuky.supabase.co";


        const SUPABASE_KEY =
            "YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY";


        const supabase =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        async function start() {

            try {

                const result =
                    await supabase.auth.getSession();


                if (result.error) {

                    console.error(
                        "StudySprint auth error:",
                        result.error
                    );

                    window.location.replace(
                        "main/account/index.html"
                    );

                    return;

                }


                const session =
                    result.data.session;


                if (session) {

                    window.location.replace(
                        "main/index.html"
                    );

                    return;

                }


                window.location.replace(
                    "main/account/index.html"
                );

            }
            catch (error) {

                console.error(
                    "StudySprint startup error:",
                    error
                );


                window.location.replace(
                    "main/account/index.html"
                );

            }

        }


        start();

    </script>


</body>

</html>
