<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudySprint</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #09090f;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .loader {
            text-align: center;
        }

        .logo {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .text {
            color: #777481;
            font-size: 11px;
        }
    </style>

</head>

<body>

<div class="loader">
    <div class="logo">StudySprint</div>
    <div class="text">Loading...</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

var SUPABASE_URL =
    "https://yfteudoecpkosxjucuky.supabase.co";

var SUPABASE_KEY =
    "YOUR_EXISTING_PUBLISHABLE_KEY";


var supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


async function checkAuth() {

    try {

        var result =
            await supabase.auth.getUser();

        var user =
            result.data.user;


        if (user) {

            window.location.replace(
                "/StudySprint/main/index.html"
            );

            return;

        }


        window.location.replace(
            "/StudySprint/main/account/index.html"
        );

    } catch (error) {

        console.error(
            "Authentication check failed:",
            error
        );


        window.location.replace(
            "/StudySprint/main/account/index.html"
        );

    }

}


checkAuth();

</script>

</body>

</html>
