<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#09090f">

    <title>StudySprint</title>

</head>


<body>

    <p>Loading StudySprint...</p>


    <script>

        var SUPABASE_URL =
            "https://yfteudoecpkosxjucuky.supabase.co";

        var SUPABASE_KEY =
            "sb_publishable_d7w3Cg-X8oTsmJLgIO_OgQ_3DmiqeMo";


        var script =
            document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


        script.onload = async function () {

            var client =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY,
                    {
                        auth: {
                            persistSession: true,
                            autoRefreshToken: true,
                            detectSessionInUrl: true
                        }
                    }
                );


            try {

                var result =
                    await client.auth.getSession();

                var session =
                    result.data.session;


                if (session) {

                    window.location.replace(
                        "/StudySprint/main/index.html"
                    );

                } else {

                    window.location.replace(
                        "/StudySprint/main/account/index.html"
                    );

                }

            } catch (error) {

                console.error(
                    "StudySprint authentication error:",
                    error
                );

                window.location.replace(
                    "/StudySprint/main/account/index.html"
                );

            }

        };


        script.onerror = function () {

            window.location.replace(
                "/StudySprint/main/account/index.html"
            );

        };


        document.head.appendChild(script);

    </script>

</body>

</html>
