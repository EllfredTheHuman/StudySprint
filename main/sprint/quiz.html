<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sprint — StudySprint</title>

    <link rel="stylesheet" href="quiz.css">

</head>


<body>

<main class="quiz-app">

    <header class="quiz-header">

        <a href="index.html" class="quit-link">
            ← Quit
        </a>

        <div
            id="topic-title"
            class="topic-title"
        >
            Sprint
        </div>

        <div
            id="question-number"
            class="question-number"
        >
            1 / 5
        </div>

    </header>


    <div class="progress-track">

        <div
            id="progress-bar"
            class="progress-bar"
        ></div>

    </div>


    <section class="question-card">

        <div class="question-kicker">
            QUESTION
        </div>

        <h1 id="question">
            Loading...
        </h1>

    </section>


    <section
        id="answers"
        class="answers"
    ></section>


    <section
        id="feedback"
        class="feedback hidden"
    >

        <div
            id="feedback-icon"
            class="feedback-icon"
        >
            ✓
        </div>

        <div>

            <strong id="feedback-title">
                Correct
            </strong>

            <p id="feedback-text"></p>

        </div>

    </section>


    <button
        id="next-button"
        class="next-button hidden"
        type="button"
    >

        <span id="next-text">
            Next Question
        </span>

        <span>
            →
        </span>

    </button>

</main>


<script src="quiz.js"></script>

</body>

</html>w
