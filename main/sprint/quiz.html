<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySprint Quiz</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

<header>

    <div class="logo">
        <a href="../index.html">
            sh🚀 StudySprint
        </a>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="../study/index.html">📚 Study</a>
        <a href="../sprint/index.html">🏃 Sprint</a>
        <a href="../profile/index.html">👤 Profile</a>
    </nav>

</header>

<main>

    <section class="hero">

        <p id="quiz-topic">Loading...</p>

        <h1 id="question">
            Loading question...
        </h1>

        <p id="question-number">
            Question 1 of 5
        </p>

    </section>

    <section class="features" id="answers">
    </section>

    <section class="hero" id="written-area" style="display:none;">

        <textarea
            id="written-answer"
            placeholder="Type your answer..."
            rows="5"
        ></textarea>

        <button class="main-button" id="submit-written">
            Submit Answer
        </button>

    </section>

    <section class="hero" id="feedback" style="display:none;">

        <h2 id="feedback-title"></h2>

        <p id="feedback-text"></p>

        <button class="main-button" id="next-question">
            Next Question
        </button>

    </section>

</main>

<script src="quiz.js"></script>

</body>
</html>
