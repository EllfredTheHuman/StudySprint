<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudySprint Quiz</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="quiz.css">

</head>


<body>


<main>

    <!-- =================================================
         QUESTION
    ================================================== -->

    <section class="hero">

        <p id="quiz-topic">
            Loading...
        </p>

        <h1 id="question">
            Loading question...
        </h1>

        <p id="question-number">
            Question 1 of 5
        </p>

    </section>


    <!-- =================================================
         ANSWERS
    ================================================== -->

    <section id="answers">
    </section>


    <!-- =================================================
         WRITTEN ANSWER
    ================================================== -->

    <section
        class="hero"
        id="written-area"
        style="display: none;"
    >

        <textarea
            id="written-answer"
            placeholder="Type your answer..."
            rows="5"
        ></textarea>

        <button
            class="main-button"
            id="submit-written"
        >
            Submit Answer
        </button>

    </section>


    <!-- =================================================
         FEEDBACK
    ================================================== -->

    <section
        class="hero"
        id="feedback"
        style="display: none;"
    >

        <h2 id="feedback-title"></h2>

        <p id="feedback-text"></p>

        <button
            class="main-button"
            id="next-question"
        >
            Next Question
        </button>

    </section>

</main>


<!-- =====================================================
     MOBILE BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">

    <a
        class="nav-item"
        href="../index.html"
    >

        <span class="nav-icon">⌂</span>

        <span>
            Home
        </span>

    </a>


    <a
        class="nav-item"
        href="../study/index.html"
    >

        <span class="nav-icon">▣</span>

        <span>
            Study
        </span>

    </a>


    <a
        class="nav-item sprint-nav"
        href="../sprint/index.html"
    >

        <span class="sprint-icon">
            ▶
        </span>

        <span>
            Sprints
        </span>

    </a>


    <a
        class="nav-item"
        href="../rooms/index.html"
    >

        <span class="nav-icon">♧</span>

        <span>
            Rooms
        </span>

    </a>


    <a
        class="nav-item"
        href="../profile/index.html"
    >

        <span class="nav-icon">●</span>

        <span>
            Profile
        </span>

    </a>

</nav>


<script src="quiz.js"></script>

</body>

</html>
