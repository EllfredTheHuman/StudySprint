<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sprints — StudySprint</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main class="app">

    <header class="page-header">

        <a href="../index.html" class="back-link">
            ← Home
        </a>

        <div class="eyebrow">
            STUDYSPRINT
        </div>

        <h1>
            Sprints
        </h1>

        <p>
            Five questions. One topic. Give it your best.
        </p>

    </header>


    <section class="selection-card">

        <div class="section-heading">

            <span class="section-number">
                01
            </span>

            <div>
                <h2>
                    Choose a subject
                </h2>

                <p>
                    What do you want to practise?
                </p>
            </div>

        </div>


        <div id="subject-grid" class="subject-grid"></div>

    </section>


    <section
        id="topic-section"
        class="selection-card hidden"
    >

        <div class="section-heading">

            <span class="section-number">
                02
            </span>

            <div>

                <h2>
                    Choose a topic
                </h2>

                <p id="topic-description">
                    Pick a topic to begin.
                </p>

            </div>

        </div>


        <div
            id="topic-list"
            class="topic-list"
        ></div>

    </section>


    <section
        id="ready-card"
        class="ready-card hidden"
    >

        <div>

            <span class="ready-label">
                READY?
            </span>

            <h2 id="ready-title">
                Start your Sprint
            </h2>

            <p>
                You'll get 5 random questions.
            </p>

        </div>


        <button
            id="start-button"
            class="start-button"
            type="button"
        >

            <span>
                Start Sprint
            </span>

            <span class="arrow">
                →
            </span>

        </button>

    </section>

</main>


<nav class="bottom-nav">

    <a href="../index.html" class="nav-item">

        <span class="nav-icon">
            ⌂
        </span>

        <span>
            Home
        </span>

    </a>


    <a
        href="../study/index.html"
        class="nav-item"
    >

        <span class="nav-icon">
            ◫
        </span>

        <span>
            Study
        </span>

    </a>


    <a
        href="index.html"
        class="nav-item active"
    >

        <span class="nav-icon sprint-icon">
            S
        </span>

        <span>
            Sprint
        </span>

    </a>


    <a
        href="../rooms/index.html"
        class="nav-item"
    >

        <span class="nav-icon">
            ♧
        </span>

        <span>
            Rooms
        </span>

    </a>


    <a
        href="../profile/index.html"
        class="nav-item"
    >

        <span class="nav-icon">
            ○
        </span>

        <span>
            Profile
        </span>

    </a>

</nav>


<script>

const SUBJECTS = {

    science: {
        name: "Science",
        icon: "S",
        description: "Explore the world around you.",
        topics: [
            {
                name: "Rocks and Minerals",
                file: "../../questions/rocks-and-minerals.js"
            },
            {
                name: "Energy and Forces",
                file: "../../questions/energy-and-forces.js"
            }
        ]
    },


    maths: {
        name: "Maths",
        icon: "M",
        description: "Put your mathematical skills to the test.",
        topics: [
            {
                name: "Year 9 Algebra",
                file: "../../questions/year-9-algebra.js"
            },
            {
                name: "BIDMAS",
                file: "../../questions/bidmas.js"
            },
            {
                name: "Area and Perimeter",
                file: "../../questions/area-and-perimeter.js"
            }
        ]
    },


    english: {
        name: "English",
        icon: "E",
        description: "Test your English knowledge.",
        topics: [
            {
                name: "Film Study",
                file: "../../questions/film-study.js"
            },
            {
                name: "Grammar",
                file: "../../questions/grammar.js"
            },
            {
                name: "English",
                file: "../../questions/english-generic.js"
            }
        ]
    },


    humanities: {
        name: "Humanities",
        icon: "H",
        description: "Explore people, places and society.",
        topics: [
            {
                name: "Humanities",
                file: "../../questions/humanities-generic-1.js"
            },
            {
                name: "Geography",
                file: "../../questions/geography.js"
            }
        ]
    },


    french: {
        name: "French",
        icon: "F",
        description: "Practise your French.",
        topics: [
            {
                name: "Characters",
                file: "../../questions/french-characters.js"
            },
            {
                name: "People, Places & Vehicles",
                file: "../../questions/french-people-places-vehicles.js"
            },
            {
                name: "Travel",
                file: "../../questions/french-travel.js"
            }
        ]
    },


    japanese: {
        name: "Japanese",
        icon: "J",
        description: "Practise your Japanese.",
        topics: [
            {
                name: "Characters",
                file: "../../questions/japanese-characters.js"
            },
            {
                name: "People, Places & Vehicles",
                file: "../../questions/japanese-people-places-vehicles.js"
            },
            {
                name: "Travel",
                file: "../../questions/japanese-travel.js"
            }
        ]
    }

};


const subjectGrid =
    document.getElementById("subject-grid");

const topicSection =
    document.getElementById("topic-section");

const topicList =
    document.getElementById("topic-list");

const topicDescription =
    document.getElementById("topic-description");

const readyCard =
    document.getElementById("ready-card");

const readyTitle =
    document.getElementById("ready-title");

const startButton =
    document.getElementById("start-button");


let selectedSubject = null;
let selectedTopic = null;


function createSubjectButtons() {

    Object.entries(SUBJECTS).forEach(
        ([id, subject]) => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "subject-button";

            button.innerHTML = `

                <span class="subject-icon">
                    ${subject.icon}
                </span>

                <span class="subject-info">

                    <strong>
                        ${subject.name}
                    </strong>

                    <small>
                        ${subject.topics.length} topics
                    </small>

                </span>

                <span class="subject-arrow">
                    →
                </span>

            `;


            button.addEventListener(
                "click",
                function () {

                    selectSubject(
                        id,
                        button
                    );

                }
            );


            subjectGrid.appendChild(button);

        }
    );

}


function selectSubject(
    subjectId,
    selectedButton
) {

    selectedSubject =
        subjectId;

    selectedTopic =
        null;


    document
        .querySelectorAll(".subject-button")
        .forEach(
            button => {
                button.classList.remove(
                    "selected"
                );
            }
        );


    selectedButton.classList.add(
        "selected"
    );


    showTopics(subjectId);

}


function showTopics(subjectId) {

    const subject =
        SUBJECTS[subjectId];


    topicSection.classList.remove(
        "hidden"
    );


    topicDescription.textContent =
        subject.description;


    topicList.innerHTML = "";


    subject.topics.forEach(
        (topic, index) => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "topic-button";


            button.innerHTML = `

                <span class="topic-index">
                    ${String(index + 1).padStart(2, "0")}
                </span>

                <span class="topic-info">

                    <strong>
                        ${topic.name}
                    </strong>

                    <small>
                        5 random questions
                    </small>

                </span>

                <span class="topic-check">
                    ✓
                </span>

            `;


            button.addEventListener(
                "click",
                function () {

                    selectTopic(
                        topic,
                        button
                    );

                }
            );


            topicList.appendChild(button);

        }
    );


    topicSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


function selectTopic(
    topic,
    selectedButton
) {

    selectedTopic =
        topic;


    document
        .querySelectorAll(".topic-button")
        .forEach(
            button => {
                button.classList.remove(
                    "selected"
                );
            }
        );


    selectedButton.classList.add(
        "selected"
    );


    readyCard.classList.remove(
        "hidden"
    );


    readyTitle.textContent =
        topic.name;


    readyCard.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


startButton.addEventListener(
    "click",
    function () {

        if (
            !selectedSubject ||
            !selectedTopic
        ) {
            return;
        }


        const params =
            new URLSearchParams();


        params.set(
            "subject",
            selectedSubject
        );


        params.set(
            "topic",
            selectedTopic.name
        );


        params.set(
            "file",
            selectedTopic.file
        );


        window.location.href =
            "quiz.html?" +
            params.toString();

    }
);


createSubjectButtons();

</script>

</body>

</html>
