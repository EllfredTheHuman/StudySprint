```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudySprint Account</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #090a0c;
    color: #f5f5f7;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.account-card {
    width: 100%;
    max-width: 420px;

    background: #121419;
    border: 1px solid #252831;
    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);
}

.logo {
    text-align: center;

    font-size: 22px;
    font-weight: 850;

    margin-bottom: 30px;
}

h1 {
    margin: 0 0 8px;

    font-size: 30px;
    line-height: 1.1;

    letter-spacing: -1px;
}

.subtitle {
    margin: 0 0 26px;

    color: #858894;

    font-size: 14px;
    line-height: 1.5;
}

label {
    display: block;

    margin: 0 0 7px;

    color: #b8bac2;

    font-size: 12px;
    font-weight: 800;
}

input {
    width: 100%;

    margin-bottom: 17px;
    padding: 14px 15px;

    background: #181a20;
    color: #f5f5f7;

    border: 1px solid #292c34;
    border-radius: 12px;

    outline: none;

    font-family: inherit;
    font-size: 15px;
}

input:focus {
    border-color: #8875f5;

    box-shadow:
        0 0 0 3px rgba(136, 117, 245, 0.12);
}

button {
    width: 100%;

    min-height: 52px;

    border: 0;
    border-radius: 13px;

    background: #8875f5;
    color: white;

    font-family: inherit;
    font-size: 14px;
    font-weight: 850;

    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.secondary-button {
    margin-top: 10px;

    background: #1a1c22;
    border: 1px solid #2a2d35;
}

.switch {
    margin-top: 22px;

    text-align: center;

    color: #777a84;

    font-size: 13px;
}

.switch button {
    width: auto;
    min-height: 0;

    margin-left: 4px;
    padding: 0;

    background: none;
    color: #a493ff;

    border: 0;

    font-size: 13px;
}

.message {
    display: none;

    margin-bottom: 18px;
    padding: 12px 14px;

    background: #191b21;

    border: 1px solid #2a2d35;
    border-radius: 11px;

    color: #bfc1c8;

    font-size: 13px;
    line-height: 1.45;
}

.logged-in {
    display: none;
}

.email-display {
    margin: 18px 0;

    padding: 15px;

    background: #181a20;

    border: 1px solid #292c34;
    border-radius: 12px;

    color: #b8bac2;

    font-size: 14px;
    word-break: break-word;
}

.back-link {
    display: block;

    margin-top: 18px;

    color: #858894;

    text-align: center;
    text-decoration: none;

    font-size: 13px;
}

.back-link:hover {
    color: white;
}

</style>

</head>

<body>

<div class="account-card">

    <div class="logo">
        🚀 StudySprint
    </div>


    <div id="auth-section">

        <h1 id="title">
            Welcome back.
        </h1>

        <p class="subtitle" id="subtitle">
            Log in to continue your StudySprint account.
        </p>


        <div class="message" id="message"></div>


        <form id="auth-form">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Your password"
                minlength="6"
                required
            >


            <button type="submit" id="submit-button">
                Log In
            </button>

        </form>


        <div class="switch">

            <span id="switch-text">
                Don't have an account?
            </span>

            <button type="button" id="switch-button">
                Sign Up
            </button>

        </div>

    </div>


    <div class="logged-in" id="logged-in-section">

        <h1>
            You're signed in.
        </h1>

        <p class="subtitle">
            Your StudySprint account is connected.
        </p>


        <div class="email-display" id="user-email"></div>


        <button id="continue-button">
            Continue to StudySprint
        </button>


        <button
            class="secondary-button"
            id="logout-button"
        >
            Log Out
        </button>

    </div>


    <a
        class="back-link"
        href="../index.html"
    >
        ← Back to StudySprint
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="account.js"></script>

</body>

</html>
```
