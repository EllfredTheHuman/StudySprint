<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account — StudySprint</title>

    <link rel="stylesheet" href="account.css">
</head>

<body>

    <main class="page">

        <section class="account-card">

            <div class="brand">
                <a href="../index.html">
                    <span class="brand-icon">🚀</span>
                    <span>StudySprint</span>
                </a>
            </div>


            <div id="auth-screen">

                <div class="heading">

                    <div class="eyebrow">
                        YOUR ACCOUNT
                    </div>

                    <h1 id="title">
                        Welcome back.
                    </h1>

                    <p id="subtitle">
                        Sign in to continue your StudySprint journey.
                    </p>

                </div>


                <div class="tabs">

                    <button id="signin-tab" class="tab active" type="button">
                        Sign In
                    </button>

                    <button id="signup-tab" class="tab" type="button">
                        Sign Up
                    </button>

                </div>


                <form id="auth-form">

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <div class="label-row">

                            <label for="password">
                                Password
                            </label>

                            <span id="password-hint">
                                6+ characters
                            </span>

                        </div>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <div class="input-group hidden" id="confirm-container">

                        <label for="confirm-password">
                            Confirm password
                        </label>

                        <input
                            id="confirm-password"
                            type="password"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                        >

                    </div>


                    <button id="submit-button" class="primary-button" type="submit">

                        <span id="submit-text">
                            Sign In
                        </span>

                        <span class="button-arrow">
                            →
                        </span>

                    </button>

                </form>


                <div id="message" class="message"></div>


                <div class="switch-area">

                    <span id="switch-text">
                        Don't have an account?
                    </span>

                    <button id="switch-button" type="button">
                        Sign Up
                    </button>

                </div>

            </div>


            <div id="account-screen" class="hidden">

                <div class="success-icon">
                    ✓
                </div>

                <div class="heading">

                    <div class="eyebrow">
                        YOU'RE SIGNED IN
                    </div>

                    <h1>
                        Welcome to StudySprint.
                    </h1>

                    <p>
                        Your account is ready to go.
                    </p>

                </div>


                <div class="account-info">

                    <span class="info-label">
                        SIGNED IN AS
                    </span>

                    <span id="account-email" class="account-email">
                        —
                    </span>

                </div>


                <a href="../index.html" class="primary-button home-button">
                    <span>Continue to StudySprint</span>
                    <span class="button-arrow">→</span>
                </a>


                <button id="logout-button" class="logout-button" type="button">
                    Sign Out
                </button>

            </div>


            <div class="footer-note">
                Study smarter. Level up faster.
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="account.js"></script>

</body>

</html>
