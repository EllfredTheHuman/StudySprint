<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rooms — StudySprint</title>

    <link rel="stylesheet" href="rooms.css">

</head>


<body>


<header>

    <a href="../index.html" class="logo">
        StudySprint
    </a>

</header>


<main>


    <section class="page-header">

        <div class="eyebrow">
            YOUR GROUPS
        </div>

        <h1>
            Rooms
        </h1>

        <p>
            Study together, compete with friends, and keep your group connected.
        </p>

    </section>


    <section class="actions">

        <button class="primary-button" id="create-room-button">
            + Create Room
        </button>

        <button class="secondary-button" id="join-room-button">
            Join Room
        </button>

    </section>


    <section class="rooms-section">

        <div class="section-title">

            <h2>
                Your Rooms
            </h2>

        </div>


        <div id="rooms-list" class="rooms-list">

            <div class="empty-state">

                <div class="empty-icon">
                    🏠
                </div>

                <h3>
                    No rooms yet
                </h3>

                <p>
                    Create a room for your class or invite your friends.
                </p>

            </div>

        </div>

    </section>


</main>


<div class="modal hidden" id="room-modal">

    <div class="modal-backdrop" id="modal-backdrop"></div>

    <div class="modal-card">

        <button class="close-button" id="close-modal">
            ×
        </button>

        <div id="modal-content"></div>

    </div>

</div>


<script type="module" src="rooms.js"></script>


</body>

</html>
