<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study — StudySprint</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="eyebrow">STUDY</p>
                <h1>What are you learning?</h1>
            </div>
        </header>


        <!-- Search -->
        <div class="search">
            <span>⌕</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Search subjects or topics..."
                autocomplete="off"
            >
        </div>


        <!-- Subjects -->
        <section class="subjects">

            <button class="subject-card" data-subject="science">
                <div class="subject-icon">⚗</div>

                <div class="subject-info">
                    <h2>Science</h2>
                    <p>Explore science topics</p>
                </div>

                <span class="arrow">→</span>
            </button>


            <button class="subject-card" data-subject="maths">
                <div class="subject-icon">∑</div>

                <div class="subject-info">
                    <h2>Maths</h2>
                    <p>Numbers, equations and more</p>
                </div>

                <span class="arrow">→</span>
            </button>


            <button class="subject-card" data-subject="english">
                <div class="subject-icon">Aa</div>

                <div class="subject-info">
                    <h2>English</h2>
                    <p>Language and literature</p>
                </div>

                <span class="arrow">→</span>
            </button>


            <button class="subject-card" data-subject="humanities">
                <div class="subject-icon">◉</div>

                <div class="subject-info">
                    <h2>Humanities</h2>
                    <p>History, geography and civics</p>
                </div>

                <span class="arrow">→</span>
            </button>


            <button class="subject-card" data-subject="french">
                <div class="subject-icon">A</div>

                <div class="subject-info">
                    <h2>French</h2>
                    <p>Learn French</p>
                </div>

                <span class="arrow">→</span>
            </button>


            <button class="subject-card" data-subject="japanese">
                <div class="subject-icon">あ</div>

                <div class="subject-info">
                    <h2>Japanese</h2>
                    <p>Learn Japanese</p>
                </div>

                <span class="arrow">→</span>
            </button>

        </section>


        <!-- Bottom Navigation -->
        <nav class="bottom-nav">

            <a href="../index.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </a>

            <a href="index.html" class="nav-item active">
                <span class="nav-icon">▣</span>
                <span>Study</span>
            </a>

            <a href="../sprint/index.html" class="nav-item sprint-nav">
                <span class="sprint-icon">▶</span>
                <span>Sprints</span>
            </a>

            <a href="../rooms/index.html" class="nav-item">
                <span class="nav-icon">♧</span>
                <span>Rooms</span>
            </a>

            <a href="../profile/index.html" class="nav-item">
                <span class="nav-icon">●</span>
                <span>Profile</span>
            </a>

        </nav>

    </main>

    <script src="script.js"></script>

</body>
</html>
