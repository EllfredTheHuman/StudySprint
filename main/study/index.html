<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090f">
    <title>StudySprint — Study</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <a href="../index.html" class="logo">StudySprint</a>
    <a href="../profile/index.html" class="profile-button">👤</a>
</header>

<main>

    <!-- SUBJECT SELECT -->

    <section id="subject-screen">

        <div class="page-heading">
            <p class="small-label">STUDY</p>
            <h1>What do you<br><span>want to learn?</span></h1>
            <p>Choose a subject to get started.</p>
        </div>

        <div class="subject-grid">

            <button class="subject-card" data-subject="science">
                <span>🔬</span>
                <strong>Science</strong>
                <small>Explore the world</small>
            </button>

            <button class="subject-card" data-subject="maths">
                <span>➗</span>
                <strong>Maths</strong>
                <small>Numbers & logic</small>
            </button>

            <button class="subject-card" data-subject="english">
                <span>📖</span>
                <strong>English</strong>
                <small>Words & stories</small>
            </button>

            <button class="subject-card" data-subject="humanities">
                <span>🌍</span>
                <strong>Humanities</strong>
                <small>People & places</small>
            </button>

            <button class="subject-card" data-subject="japanese">
                <span>🇯🇵</span>
                <strong>Japanese</strong>
                <small>日本語</small>
            </button>

            <button class="subject-card" data-subject="french">
                <span>🇫🇷</span>
                <strong>French</strong>
                <small>Français</small>
            </button>

        </div>

    </section>


    <!-- TOPIC SELECT -->

    <section id="topic-screen" class="hidden">

        <button id="back-subjects" class="back-button">← Subjects</button>

        <div class="page-heading compact">
            <p class="small-label" id="selected-subject-label">SUBJECT</p>
            <h1>Choose a<br><span>topic.</span></h1>
        </div>

        <div id="topic-list"></div>

    </section>


    <!-- QUIZ -->

    <section id="quiz-screen" class="hidden">

        <div class="quiz-top">

            <button id="back-topics" class="back-button">
                ← Topics
            </button>

            <div class="progress-area">
                <span id="question-number">Question 1</span>
                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>
            </div>

        </div>

        <div class="quiz-card">

            <p class="question-type" id="question-type">QUESTION</p>

            <h1 id="question-text"></h1>

            <div id="answers-area"></div>

            <div id="written-area" class="hidden">

                <input
                    id="written-answer"
                    type="text"
                    autocomplete="off"
                    placeholder="Type your answer..."
                >

                <button id="submit-written" class="primary-button">
                    Check Answer
                </button>

            </div>

            <div id="feedback" class="feedback hidden">
                <strong id="feedback-title"></strong>
                <p id="feedback-text"></p>
            </div>

            <button id="next-button" class="next-button hidden">
                Next Question →
            </button>

        </div>

    </section>


    <!-- COMPLETE -->

    <section id="complete-screen" class="hidden">

        <div class="complete-card">

            <div class="complete-icon">🎉</div>

            <p class="small-label">SESSION COMPLETE</p>

            <h1>Nice work.</h1>

            <p id="complete-message">
                You finished your study session.
            </p>

            <div class="complete-stats">

                <div>
                    <strong id="score-number">0</strong>
                    <small>Correct</small>
                </div>

                <div>
                    <strong id="total-number">0</strong>
                    <small>Questions</small>
                </div>

            </div>

            <button id="study-again" class="primary-button">
                Study Again
            </button>

            <button id="return-home" class="secondary-button">
                Back Home
            </button>

        </div>

    </section>

</main>


<nav class="bottom-nav">

    <a href="../index.html" class="bottom-item">
        <span>🏠</span>
        <small>Home</small>
    </a>

    <a href="index.html" class="bottom-item active">
        <span>📚</span>
        <small>Study</small>
    </a>

    <a href="../sprint/index.html" class="bottom-item">
        <span>🏃</span>
        <small>Sprint</small>
    </a>

    <a href="../rooms/index.html" class="bottom-item">
        <span>👥</span>
        <small>Rooms</small>
    </a>

    <a href="../profile/index.html" class="bottom-item">
        <span>👤</span>
        <small>Profile</small>
    </a>

</nav>


<script src="study.js"></script>

</body>
</html>
