<script>

    const subjects = {

        science: {
            name: "Science",
            description: "Choose a Science topic.",
            topics: [
                "The Heart",
                "Electricity",
                "Cells",
                "Energy and Forces",
                "Rocks and Minerals"
            ]
        },

        maths: {
            name: "Maths",
            description: "Choose a Maths topic.",
            topics: [
                "Algebra",
                "Geometry",
                "BIDMAS",
                "Area and Perimeter"
            ]
        },

        english: {
            name: "English",
            description: "Choose an English topic.",
            topics: [
                "Grammar",
                "Literature",
                "Poetry",
                "Film Study"
            ]
        },

        humanities: {
            name: "Humanities",
            description: "Choose a Humanities topic.",
            topics: [
                "Geography",
                "History",
                "Civics"
            ]
        },

        french: {
            name: "French",
            description: "Choose a French topic.",
            topics: [
                "Vocabulary",
                "Grammar",
                "Conversation"
            ]
        },

        japanese: {
            name: "Japanese",
            description: "Choose a Japanese topic.",
            topics: [
                "Vocabulary",
                "Characters",
                "Grammar",
                "People, Places and Vehicles",
                "Travel"
            ]
        }

    };



    const subjectButtons =
        document.querySelectorAll(".subject-card");

    const topicsSection =
        document.getElementById("topicsSection");

    const topicList =
        document.getElementById("topicList");

    const topicDescription =
        document.getElementById("topicDescription");

    const startButton =
        document.getElementById("startButton");

    const startText =
        document.getElementById("startText");



    let selectedSubject = null;

    let selectedTopic = null;



    subjectButtons.forEach(function(button) {

        button.addEventListener("click", function() {

            selectedSubject =
                button.dataset.subject;

            selectedTopic = null;


            subjectButtons.forEach(
                function(otherButton) {

                    otherButton.classList.remove(
                        "selected"
                    );

                }
            );


            button.classList.add("selected");


            showTopics(selectedSubject);

        });

    });



    function showTopics(subject) {

        const data = subjects[subject];

        if (!data) {
            return;
        }


        topicsSection.hidden = false;

        topicDescription.textContent =
            data.description;


        topicList.innerHTML = "";


        data.topics.forEach(function(topic) {

            const button =
                document.createElement("button");


            button.className =
                "topic-card";


            const content =
                document.createElement("div");


            const name =
                document.createElement("strong");


            name.className =
                "topic-name";

            name.textContent =
                topic;


            const description =
                document.createElement("small");


            description.textContent =
                "Start studying";


            content.appendChild(name);

            content.appendChild(description);


            const arrow =
                document.createElement("span");

            arrow.className =
                "topic-arrow";

            arrow.textContent =
                "→";


            button.appendChild(content);

            button.appendChild(arrow);


            button.addEventListener(
                "click",
                function() {

                    selectedTopic =
                        topic;


                    document
                        .querySelectorAll(
                            ".topic-card"
                        )
                        .forEach(
                            function(option) {

                                option.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );


                    startButton.disabled =
                        false;


                    startText.textContent =
                        "Start Studying";

                }
            );


            topicList.appendChild(button);

        });


        startButton.disabled = true;

        startText.textContent =
            "Choose a topic";


        setTimeout(function() {

            topicsSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }, 50);

    }



    startButton.addEventListener(
        "click",
        function() {

            if (
                !selectedSubject ||
                !selectedTopic
            ) {
                return;
            }


            const encodedTopic =
                encodeURIComponent(
                    selectedTopic
                );


            window.location.href =
                "quiz.html?subject=" +
                selectedSubject +
                "&topic=" +
                encodedTopic;

        }
    );

</script>


</body>

</html>
