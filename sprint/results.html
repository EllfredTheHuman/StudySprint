<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sprint Results | StudySprint</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>


<nav>

<a href="../index.html">Home</a>

<a href="../study/index.html">📚 Study</a>

<a href="index.html">🏃 Sprint</a>

<a href="../profile/index.html">👤 Profile</a>

</nav>

</header>



<main>


<section class="hero">


<h1>
🏃 Sprint Complete!
</h1>


<p id="message">
Great job!
</p>


</section>



<section class="features">



<div class="stat">

<h2 id="score">
0/5
</h2>

<p>
🎯 Score
</p>

</div>



<div class="stat">

<h2 id="xp">
⭐ +0 XP
</h2>

<p>
Reward
</p>

</div>



<div class="stat">

<h2 id="accuracy">
0%
</h2>

<p>
Accuracy
</p>

</div>



<div class="stat">

<h2 id="streak">
🔥 0
</h2>

<p>
Day Streak
</p>

</div>



</section>



<section class="hero">


<h1>
🔥 Keep Going!
</h1>


<p>
Keep completing your Sprints every day to grow your streak.
</p>


<a href="../index.html" class="main-button">

🏠 Return Home

</a>


</section>



</main>



<footer>

© 2026 StudySprint

</footer>



<script>


// =============================
// GET RESULTS
// =============================

let score =
Number(
localStorage.getItem("sprintScore")
) || 0;


let xp =
Number(
localStorage.getItem("sprintXP")
) || 0;


let streak =
Number(
localStorage.getItem("streak")
) || 0;


let total = 5;


let accuracy =
Math.round(
(score / total) * 100
);



// =============================
// DISPLAY RESULTS
// =============================

document.getElementById(
"score"
).textContent =
score + "/5";


document.getElementById(
"xp"
).textContent =
"⭐ +" + xp + " XP";


document.getElementById(
"accuracy"
).textContent =
accuracy + "%";


document.getElementById(
"streak"
).textContent =
"🔥 " + streak;



// =============================
// MESSAGE
// =============================

let message =
document.getElementById(
"message"
);


if(score === 5){

    message.textContent =
    "🏆 PERFECT SPRINT! Incredible work!";

}

else if(score >= 4){

    message.textContent =
    "🔥 Amazing Sprint!";

}

else if(score >= 3){

    message.textContent =
    "👍 Good Sprint! Keep improving!";

}

else{

    message.textContent =
    "💪 Don't give up! Practice makes progress.";

}


</script>



<script src="../animations.js"></script>


</body>

</html>
