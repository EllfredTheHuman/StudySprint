<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character | StudySprint</title>

<link rel="stylesheet" href="../style.css">

<style>

/* =========================
   PAGE
========================= */

.character-page {

    max-width: 1100px;

    margin: 0 auto;

    padding: 40px 20px 80px;
}


/* =========================
   CHARACTER PREVIEW
========================= */

.character-preview {

    width: 100%;

    min-height: 330px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    margin-bottom: 40px;

    border-radius: 35px;

    overflow: hidden;

    position: relative;

    transition: .2s;
}

.character-preview.purple {
    background: #6366f1;
}

.character-preview.blue {
    background: #2563eb;
}

.character-preview.green {
    background: #16a34a;
}


/* =========================
   CHARACTER
========================= */

.character {

    position: relative;

    width: 150px;
    height: 260px;

    margin-bottom: 15px;
}


/* HEAD */

.head {

    position: absolute;

    width: 100px;
    height: 100px;

    left: 25px;
    top: 20px;

    border-radius: 50%;

    background: #f1c27d;

    z-index: 4;
}

.skin-medium .head {
    background: #c68642;
}

.skin-dark .head {
    background: #6b4226;
}


/* HAIR */

.hair {

    position: absolute;

    width: 108px;
    height: 55px;

    left: 21px;
    top: 10px;

    border-radius:
        55px 55px 25px 25px;

    z-index: 6;
}

.hair.brown {
    background: #6b3e26;
}

.hair.black {
    background: #222;
}

.hair.blonde {
    background: #f4c542;
}


/* FACE */

.eye {

    position: absolute;

    width: 10px;
    height: 14px;

    border-radius: 50%;

    background: #222;

    z-index: 7;
}

.eye.left {

    left: 50px;
    top: 57px;
}

.eye.right {

    left: 90px;
    top: 57px;
}

.mouth {

    position: absolute;

    width: 25px;
    height: 12px;

    left: 63px;
    top: 81px;

    border-bottom:
        4px solid #222;

    border-radius:
        0 0 50% 50%;

    z-index: 7;
}


/* BODY */

.body {

    position: absolute;

    width: 105px;
    height: 80px;

    left: 22px;
    top: 113px;

    border-radius:
        35px 35px 25px 25px;

    z-index: 3;
}

.body.blue {
    background: #3b82f6;
}

.body.red {
    background: #ef4444;
}

.body.green {
    background: #22c55e;
}


/* ARMS */

.arm {

    position: absolute;

    width: 30px;
    height: 65px;

    top: 120px;

    border-radius: 20px;

    background: #f1c27d;

    z-index: 2;
}

.skin-medium .arm {
    background: #c68642;
}

.skin-dark .arm {
    background: #6b4226;
}

.arm.left {

    left: 0;

    transform: rotate(8deg);
}

.arm.right {

    right: 0;

    transform: rotate(-8deg);
}


/* LEGS */

.leg {

    position: absolute;

    width: 38px;
    height: 58px;

    top: 182px;

    border-radius: 18px;

    z-index: 2;
}

.leg.left {
    left: 32px;
}

.leg.right {
    left: 80px;
}

.pants-blue {
    background: #2563eb;
}

.pants-black {
    background: #222;
}

.pants-brown {
    background: #795548;
}


/* SHOES */

.shoe {

    position: absolute;

    width: 43px;
    height: 20px;

    top: 235px;

    border-radius:
        20px 20px 12px 12px;

    background: #333;

    z-index: 3;
}

.shoe.left {
    left: 27px;
}

.shoe.right {
    left: 75px;
}


/* =========================
   BACKPACK
========================= */

.backpack {

    display: none;

    position: absolute;

    width: 40px;
    height: 68px;

    right: 0;
    top: 118px;

    border-radius: 18px;

    z-index: 2;
}

.backpack.blue {

    display: block;

    background: #2563eb;
}

.backpack.red {

    display: block;

    background: #dc2626;
}


/* =========================
   HATS
========================= */

.hat {

    position: absolute;

    z-index: 8;
}


/* CAP */

.hat.cap {

    width: 92px;
    height: 28px;

    left: 29px;
    top: 5px;

    border-radius:
        50px 50px 15px 15px;

    background: #6366f1;
}

.hat.cap::after {

    content: "";

    position: absolute;

    width: 42px;
    height: 10px;

    left: 55px;
    top: 20px;

    border-radius: 50%;

    background: #4f46e5;

    transform: rotate(4deg);
}


/* BEANIE */

.hat.beanie {

    width: 96px;
    height: 48px;

    left: 27px;
    top: 3px;

    border-radius:
        50px 50px 18px 18px;

    background: #ef4444;
}

.hat.beanie::after {

    content: "";

    position: absolute;

    width: 96px;
    height: 12px;

    left: 0;
    bottom: -2px;

    border-radius: 12px;

    background: #dc2626;
}


/* =========================
   CUSTOMISATION
========================= */

.customise {

    background: white;

    padding: 35px;

    border-radius: 30px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.08);
}

.customise-section {

    margin-bottom: 35px;
}

.customise-section h2 {

    font-size: 25px;

    margin-bottom: 15px;
}

.options {

    display: flex;

    flex-wrap: wrap;

    gap: 12px;
}

.option {

    border: 3px solid #e5e7eb;

    background: #f8fafc;

    padding: 12px 20px;

    border-radius: 15px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.option:hover {

    transform:
        translateY(-3px);

    border-color: #6366f1;
}

.option.selected {

    border-color: #6366f1;

    background: #eef2ff;

    box-shadow:
        0 4px 0 #6366f1;
}


/* =========================
   USERNAME
========================= */

.username-input {

    width: 100%;

    max-width: 450px;

    padding: 15px 18px;

    border:
        3px solid #e5e7eb;

    border-radius: 15px;

    font-size: 18px;

    font-weight: 700;

    outline: none;
}

.username-input:focus {

    border-color:
        #6366f1;
}


/* =========================
   PLAYER TAG
========================= */

.tag-note {

    color: #6b7280;

    margin-bottom: 15px;
}

.locked-tag {

    opacity: .55;

    cursor: not-allowed;
}


/* =========================
   SAVE
========================= */

.save-area {

    text-align: center;

    margin-top: 35px;
}

.save-button {

    font-size: 20px;

    padding:
        16px 40px;
}


/* =========================
   SAVED MESSAGE
========================= */

.saved-message {

    margin-top: 15px;

    font-weight: 800;

    color: #16a34a;

    min-height: 24px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .customise {

        padding: 25px 18px;
    }

    .character-preview {

        min-height: 290px;
    }

}

</style>

</head>

<!-- =========================

<div

>

<div

<div

></div>

></div>

class="mouth"
></div>


<div
class="arm left"
></div>

<div
class="arm right"
></div>


<div
class="body blue"
id="shirt"
></div>


<div
class="leg pants-blue left"
id="leg-left"
></div>

<div
class="leg pants-blue right"
id="leg-right"
></div>


<div
class="shoe left"
></div>

<div
class="shoe right"
></div>


<div
class="backpack"
id="backpack"
></div>


</div>

<!-- =========================
     CUSTOMISATION
========================= -->

<section class="customise">


<!-- SKIN -->

>

>

</button>

class="option"
onclick="setOption('skin','dark',this)"
>

</button>

</div>

</div>


<!-- HAIR -->

<div class="customise-section">

<h2>
Hair
</h2>

<div class="options">

class="option"
onclick="setOption('hair','brown',this)"
>

</button>

<button
class="option"
onclick="setOption('hair','black',this)"
>

</button>

<button
class="option"
onclick="setOption('hair','blonde',this)"
>

</button>

<!-- SHIRT -->

<script>

/* =========================
   DEFAULT CHARACTER
========================= */

let characterData = {

    skin: "light",

    hair: "brown",

    shirt: "blue",

    pants: "blue",

    hat: "none",

    backpack: "none",

    banner: "purple",

    username: "Sprinter",

    playerTag: "New Sprinter"

};


/* =========================
   LOAD CHARACTER
========================= */

const savedCharacter =
localStorage.getItem("character");


if (savedCharacter) {

    try {

        characterData = {

            ...characterData,

            ...JSON.parse(
                savedCharacter
            )

        };

    }

    catch {

        console.log(
            "Could not load character."
        );

    }

}


/* =========================
   UPDATE CHARACTER
========================= */

function updateCharacter() {


    const character =
    document.getElementById(
        "character"
    );


    /* SKIN */

    character.className =
    "character skin-" +
    characterData.skin;


    /* HAIR */

    document.getElementById(
        "hair"
    ).className =
    "hair " +
    characterData.hair;


    /* SHIRT */

    document.getElementById(
        "shirt"
    ).className =
    "body " +
    characterData.shirt;


    /* PANTS */

    document.getElementById(
        "leg-left"
    ).className =
    "leg pants-" +
    characterData.pants +
    " left";


    document.getElementById(
        "leg-right"
    ).className =
    "leg pants-" +
    characterData.pants +
    " right";


    /* HAT */

    const hat =
    document.getElementById(
        "hat"
    );


    if (
        characterData.hat ===
        "cap" ||

        characterData.hat ===
        "beanie"
    ) {

        hat.className =
        "hat " +
        characterData.hat;

    }

    else {

        hat.className =
        "hat";

    }


    /* BACKPACK */

    const backpack =
    document.getElementById(
        "backpack"
    );


    if (
        characterData.backpack ===
        "blue" ||

        characterData.backpack ===
        "red"
    ) {

        backpack.className =
        "backpack " +
        characterData.backpack;

    }

    else {

        backpack.className =
        "backpack";

    }


    /* BANNER */

    document.getElementById(
        "character-preview"
    ).className =
    "character-preview " +
    characterData.banner;


    /* USERNAME */

    document.getElementById(
        "username"
    ).value =
    characterData.username || "";

}


/* =========================
   CHANGE OPTION
========================= */

function setOption(
    option,
    value,
    button
) {

    characterData[option] =
    value;


    updateCharacter();


    /*
       Highlight selected option
    */

    const buttons =
    button.parentElement
    .querySelectorAll(
        ".option"
    );


    buttons.forEach(
        function(item) {

            item.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );

}


/* =========================
   PLAYER TAG
========================= */

function setTag(
    tag,
    button
) {

    characterData.playerTag =
    tag;


    const buttons =
    button.parentElement
    .querySelectorAll(
        ".option"
    );


    buttons.forEach(
        function(item) {

            item.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );

}


/* =========================
   SAVE
========================= */

function saveCharacter() {


    const username =
    document.getElementById(
        "username"
    ).value.trim();


    if (username.length > 0) {

        characterData.username =
        username;

    }

    else {

        characterData.username =
        "Sprinter";

    }


    /*
       SAVE EVERYTHING
    */

    localStorage.setItem(
        "character",
        JSON.stringify(
            characterData
        )
    );


    /*
       Show confirmation
    */

    const message =
    document.getElementById(
        "saved-message"
    );


    message.textContent =
    "✓ Character saved!";


    setTimeout(
        function() {

            message.textContent =
            "";

        },
        2000
    );

}


/* =========================
   HIGHLIGHT SAVED OPTIONS
========================= */

function highlightSavedOptions() {


    const allButtons =
    document.querySelectorAll(
        ".option"
    );


    allButtons.forEach(
        function(button) {

            button.classList.remove(
                "selected"
            );

        }
    );


    /*
       Find buttons whose
       onclick contains the
       saved values.
    */

    allButtons.forEach(
        function(button) {

            const action =
            button.getAttribute(
                "onclick"
            );


            if (!action) return;


            if (
                action.includes(
                    "'" +
                    characterData.skin +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.hair +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.shirt +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.pants +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.hat +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.backpack +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.banner +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }


            if (
                action.includes(
                    "'" +
                    characterData.playerTag +
                    "'"
                )
            ) {

                button.classList.add(
                    "selected"
                );

            }

        }
    );

}


/* =========================
   START
========================= */

updateCharacter();

highlightSavedOptions();

</script>
