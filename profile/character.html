<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Customize Character | StudySprint</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="./character.css">

</head>


<body>


<header>

    <div class="logo">
        🚀 StudySprint
    </div>

    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="../study/index.html">
            📚 Study
        </a>

        <a href="../sprint/index.html">
            🏃 Sprint
        </a>

        <a href="index.html">
            👤 Profile
        </a>

    </nav>

</header>


<main class="character-editor">


<section class="hero">

    <h1>
        🎨 Customize Character
    </h1>

    <p>
        Equip your unlocked StudySprint cosmetics.
    </p>

</section>


<!-- =====================================================
     CHARACTER PREVIEW
===================================================== -->

<section
    id="character-preview"
    class="banner-preview"
>


    <div class="player-info">

        <h2 id="character-name">
            Player
        </h2>

        <p id="character-title"></p>

    </div>


    <div class="character-stage">


        <div
            id="character-effects"
            class="character-effects"
        ></div>


        <div class="character">


            <!-- BACKPACK -->

            <div
                id="character-backpack"
                class="character-backpack hidden"
            ></div>


            <!-- LEGS -->

            <div
                id="character-leg-left"
                class="character-leg left"
            ></div>

            <div
                id="character-leg-right"
                class="character-leg right"
            ></div>


            <!-- PANTS -->

            <div
                id="character-pants"
                class="character-pants"
            ></div>


            <!-- BODY -->

            <div
                id="character-body"
                class="character-body"
            ></div>


            <!-- HEAD -->

            <div
                id="character-head"
                class="character-head"
            >

                <div class="character-face">

                    <span class="eye left-eye"></span>

                    <span class="eye right-eye"></span>

                    <span class="mouth"></span>

                </div>

            </div>


            <!-- HAIR -->

            <div
                id="character-hair"
                class="character-hair"
            ></div>


            <!-- HAT -->

            <div
                id="character-hat"
                class="character-hat"
            ></div>


            <!-- CROWN -->

            <div
                id="character-crown"
                class="character-crown"
            >

                <div class="crown-gem gem-red"></div>

                <div class="crown-gem gem-blue"></div>

                <div class="crown-gem gem-purple"></div>

            </div>


        </div>


    </div>


</section>


<!-- =====================================================
     USERNAME
===================================================== -->

<section class="customization-section">

    <h2>
        Username
    </h2>

    <input
        id="username"
        type="text"
        maxlength="16"
        placeholder="Username"
    >

</section>


<!-- =====================================================
     SHIRTS
===================================================== -->

<section class="customization-section">

    <h2>
        👕 Shirts
    </h2>

    <div
        id="shirts-options"
        class="options"
    ></div>

</section>


<!-- =====================================================
     HATS
===================================================== -->

<section class="customization-section">

    <h2>
        🧢 Hats
    </h2>

    <div
        id="hats-options"
        class="options"
    ></div>

</section>


<!-- =====================================================
     PANTS
===================================================== -->

<section class="customization-section">

    <h2>
        👖 Pants
    </h2>

    <div
        id="pants-options"
        class="options"
    ></div>

</section>


<!-- =====================================================
     BANNERS
===================================================== -->

<section class="customization-section">

    <h2>
        🖼️ Banners
    </h2>

    <div
        id="banners-options"
        class="options"
    ></div>

</section>


<!-- =====================================================
     TITLES
===================================================== -->

<section class="customization-section">

    <h2>
        🏷️ Player Titles
    </h2>

    <div
        id="titles-options"
        class="options"
    ></div>

</section>


<!-- =====================================================
     EFFECTS
===================================================== -->

<section class="customization-section">

    <h2>
        ✨ Effects
    </h2>

    <div
        id="effects-options"
        class="options"
    ></div>

</section>


<button
    class="main-button save-button"
    onclick="saveCharacter()"
>
    💾 Save Character
</button>


<a
    href="index.html"
    class="back-button"
>
    ← Back to Profile
</a>


</main>


<footer>

    © 2026 StudySprint

</footer>


<script src="./character.js?v=5"></script>

</body>

</html>
