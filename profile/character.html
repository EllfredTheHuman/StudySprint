<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character | StudySprint</title>

<link rel="stylesheet" href="../style.css">

<style>

/* =============================
CHARACTER
============================= */

.character {
    position: relative;
    width: 220px;
    height: 330px;
    margin: 30px auto;
}

.character-head {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    top: 20px;
    left: 50px;
    z-index: 3;
}

.character-body {
    position: absolute;
    width: 110px;
    height: 120px;
    border-radius: 35px;
    top: 125px;
    left: 55px;
    z-index: 2;
}

.character-pants {
    position: absolute;
    width: 115px;
    height: 75px;
    border-radius: 20px;
    top: 225px;
    left: 52px;
    z-index: 1;
}

.character-hair {
    position: absolute;
    width: 120px;
    height: 42px;
    border-radius: 60px 60px 25px 25px;
    top: 12px;
    left: 50px;
    z-index: 4;
}

.character-hat {
    position: absolute;
    top: 0;
    left: 40px;
    width: 140px;
    height: 45px;
    z-index: 5;
}

.character-backpack {
    position: absolute;
    width: 35px;
    height: 90px;
    border-radius: 15px;
    top: 140px;
    left: 28px;
    z-index: 1;
}

/* =============================
COLOURS
============================= */

.skin-light {
    background: #f6c7a5;
}

.skin-medium {
    background: #c98b61;
}

.skin-dark {
    background: #70452f;
}

.hair-brown {
    background: #6b3e26;
}

.hair-black {
    background: #202020;
}

.hair-blonde {
    background: #e5bd55;
}

.shirt-blue {
    background: #4f7cff;
}

.shirt-red {
    background: #ff4d5a;
}

.shirt-green {
    background: #35b86b;
}

.pants-blue {
    background: #3d5fa8;
}

.pants-black {
    background: #252525;
}

.pants-brown {
    background: #76513b;
}

/* =============================
HATS
============================= */

.hat-cap {
    background: #6366f1;
    border-radius: 70px 70px 15px 15px;
}

.hat-cap::after {
    content: "";
    position: absolute;
    width: 75px;
    height: 15px;
    border-radius: 50%;
    background: #4f46e5;
    bottom: -5px;
    left: 45px;
}

.hat-beanie {
    background: #6366f1;
    border-radius: 70px 70px 20px 20px;
    height: 60px;
}

.hat-beanie::after {
    content: "";
    position: absolute;
    width: 140px;
    height: 12px;
    border-radius: 10px;
    background: #4f46e5;
    bottom: 0;
    left: 0;
}

/* =============================
BACKPACK
============================= */

.backpack-blue {
    background: #3b82f6;
}

.backpack-red {
    background: #ef4444;
}

/* =============================
EDITOR
============================= */

.character-preview {
    background: white;
    width: 500px;
    max-width: 90%;
    margin: 30px auto;
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,.08);
}

.customise-section {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.customise-section h2 {
    text-align: center;
    margin-top: 35px;
}

.options {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 15px 0 30px;
}

.option {
    padding: 12px 20px;
    border: 3px solid #e5e7eb;
    border-radius: 15px;
    background: white;
    font-weight: 800;
    cursor: pointer;
}

.option:hover,
.option.selected {
    border-color: #6366f1;
    background: #eef2ff;
}

.character-input {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 15px auto;
    padding: 15px;
    border: 3px solid #e5e7eb;
    border-radius: 15px;
    font-size: 17px;
}

.save-button {
    display: block;
    margin: 30px auto;
}

.back-button {
    display: block;
    text-align: center;
    margin: 20px;
    color: #6366f1;
    font-weight: 800;
    text-decoration: none;
}

</style>

</head>

<body>

<header>

<div class="logo">
🚀 StudySprint
</div>

<nav>

<a href="../index.html">Home</a> <a href="../study/index.html">📚 Study</a> <a href="../sprint/index.html">🏃 Sprint</a> <a href="index.html">👤 Profile</a>

</nav>

</header>

<main>

<section class="hero">

<h1>🎨 Customise Your Character</h1>

<p>Make your StudySprint character yours.</p>

</section>

<div class="character-preview">

<div class="character" id="character">

<div
class="character-backpack"
id="character-backpack">
</div>

<div
class="character-pants"
id="character-pants">
</div>

<div
class="character-body"
id="character-body">
</div>

<div
class="character-head"
id="character-head">
</div>

<div
class="character-hair"
id="character-hair">
</div>

<div
class="character-hat"
id="character-hat">
</div>

</div>

</div>

<section class="customise-section">

<h2>Skin</h2>

<div class="options">

<button class="option" onclick="setOption('skin','light',this)">
Light
</button>

<button class="option" onclick="setOption('skin','medium',this)">
Medium
</button>

<button class="option" onclick="setOption('skin','dark',this)">
Dark
</button>

</div>

<h2>Hair</h2>

<div class="options">

<button class="option" onclick="setOption('hair','brown',this)">
Brown
</button>

<button class="option" onclick="setOption('hair','black',this)">
Black
</button>

<button class="option" onclick="setOption('hair','blonde',this)">
Blonde
</button>

</div>

<h2>Shirt / Jumper</h2>

<div class="options">

<button class="option" onclick="setOption('shirt','blue',this)">
Blue
</button>

<button class="option" onclick="setOption('shirt','red',this)">
Red
</button>

<button class="option" onclick="setOption('shirt','green',this)">
Green
</button>

</div>

<h2>Pants</h2>

<div class="options">

<button class="option" onclick="setOption('pants','blue',this)">
Blue
</button>

<button class="option" onclick="setOption('pants','black',this)">
Black
</button>

<button class="option" onclick="setOption('pants','brown',this)">
Brown
</button>

</div>

<h2>Hat</h2>

<div class="options">

<button class="option" onclick="setOption('hat','none',this)">
None
</button>

<button class="option" onclick="setOption('hat','cap',this)">
Cap
</button>

<button class="option" onclick="setOption('hat','beanie',this)">
Beanie
</button>

</div>

<h2>Backpack</h2>

<div class="options">

<button class="option" onclick="setOption('backpack','none',this)">
None
</button>

<button class="option" onclick="setOption('backpack','blue',this)">
Blue
</button>

<button class="option" onclick="setOption('backpack','red',this)">
Red
</button>

</div>

<h2>Username</h2>

<input
type="text"
id="username"
class="character-input"
maxlength="16"
placeholder="Username"

>

<button
class="main-button save-button"
onclick="saveCharacter()"

>

💾 Save Character </button>

<a
href="index.html"
class="back-button"

>

← Back to Profile </a>

</section>

</main>

<footer>

© 2026 StudySprint

</footer>

<script>

const defaultCharacter = {

    skin: "light",
    hair: "brown",
    shirt: "blue",
    pants: "blue",
    hat: "none",
    backpack: "none"

};


let character =
JSON.parse(
    localStorage.getItem("character")
) || {...defaultCharacter};


function setOption(type, value, button) {

    character[type] = value;

    updateCharacter();

    document
        .querySelectorAll(
            `.option`
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );

    button.classList.add("selected");

}


function updateCharacter() {

    const head =
        document.getElementById(
            "character-head"
        );

    const hair =
        document.getElementById(
            "character-hair"
        );

    const body =
        document.getElementById(
            "character-body"
        );

    const pants =
        document.getElementById(
            "character-pants"
        );

    const hat =
        document.getElementById(
            "character-hat"
        );

    const backpack =
        document.getElementById(
            "character-backpack"
        );


    head.className =
        "character-head skin-" +
        character.skin;


    hair.className =
        "character-hair hair-" +
        character.hair;


    body.className =
        "character-body shirt-" +
        character.shirt;


    pants.className =
        "character-pants pants-" +
        character.pants;


    hat.className =
        "character-hat";


    if (
        character.hat !== "none"
    ) {

        hat.classList.add(
            "hat-" +
            character.hat
        );

    }


    backpack.className =
        "character-backpack";


    if (
        character.backpack !== "none"
    ) {

        backpack.classList.add(
            "backpack-" +
            character.backpack
        );

    }

}


function saveCharacter() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    localStorage.setItem(
        "character",
        JSON.stringify(character)
    );


    localStorage.setItem(
        "username",
        username
    );


    window.location.href =
        "index.html";

}


function loadCharacter() {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "character"
            )
        );


    if (saved) {

        character = {
            ...defaultCharacter,
            ...saved
        };

    }


    const username =
        localStorage.getItem(
            "username"
        );


    if (username) {

        document.getElementById(
            "username"
        ).value =
            username;

    }


    updateCharacter();

}


loadCharacter();

</script>

</body>

</html>
