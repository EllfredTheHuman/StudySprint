<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customize Character | StudySprint</title>

<link rel="stylesheet" href="../style.css">

<style>

.character-preview {
    display:flex;
    justify-content:center;
    align-items:center;
    margin:30px auto 50px;
}

.character {
    position:relative;
    width:180px;
    height:250px;
}

/* =========================
   CHARACTER
========================= */

.character-body {
    position:absolute;
    width:120px;
    height:120px;
    left:30px;
    top:55px;
    border-radius:50%;
    background:#f2c29b;
    z-index:3;
}

.character-face {
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#222;
    top:105px;
    left:63px;
    z-index:5;
}

.character-face::after {
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#222;
    left:40px;
}

.character-hair {
    position:absolute;
    width:120px;
    height:55px;
    left:30px;
    top:50px;
    border-radius:60px 60px 25px 25px;
    z-index:6;
}

.character-shirt {
    position:absolute;
    width:100px;
    height:75px;
    left:40px;
    top:165px;
    border-radius:25px 25px 15px 15px;
    z-index:2;
}

.character-pants {
    position:absolute;
    width:100px;
    height:45px;
    left:40px;
    top:225px;
    border-radius:10px 10px 20px 20px;
    z-index:1;
}

/* =========================
   HAIR
========================= */

.hair-brown {
    background:#6b3e26;
}

.hair-black {
    background:#222;
}

.hair-blonde {
    background:#f4d35e;
}

/* =========================
   SHIRT
========================= */

.shirt-blue {
    background:#3b82f6;
}

.shirt-red {
    background:#ef4444;
}

.shirt-green {
    background:#22c55e;
}

/* =========================
   PANTS
========================= */

.pants-blue {
    background:#2563eb;
}

.pants-black {
    background:#222;
}

.pants-brown {
    background:#795548;
}

/* =========================
   SKIN
========================= */

.skin-light {
    background:#f6d1ad;
}

.skin-medium {
    background:#c98d63;
}

.skin-dark {
    background:#70452d;
}

/* =========================
   HATS
========================= */

.hat-cap {
    position:absolute;
    width:125px;
    height:45px;
    left:28px;
    top:35px;
    background:#6366f1;
    border-radius:70px 70px 20px 20px;
    z-index:10;
}

.hat-cap::after {
    content:"";
    position:absolute;
    width:60px;
    height:15px;
    left:75px;
    top:30px;
    background:#4f46e5;
    border-radius:0 20px 20px 0;
    transform:rotate(8deg);
}

.hat-beanie {
    position:absolute;
    width:125px;
    height:65px;
    left:28px;
    top:35px;
    background:#ef4444;
    border-radius:70px 70px 20px 20px;
    z-index:10;
}

.hat-beanie::after {
    content:"";
    position:absolute;
    width:125px;
    height:18px;
    left:0;
    bottom:0;
    background:#dc2626;
    border-radius:10px;
}

/* =========================
   BACKPACK
========================= */

.backpack-blue,
.backpack-red {
    position:absolute;
    width:45px;
    height:70px;
    left:5px;
    top:165px;
    border-radius:20px;
    z-index:1;
}

.backpack-blue {
    background:#3b82f6;
}

.backpack-red {
    background:#ef4444;
}

.option-group {
    margin:35px auto;
    max-width:800px;
    text-align:center;
}

.option-group h2 {
    margin-bottom:15px;
}

.option {
    margin:6px;
    padding:12px 22px;
    border:none;
    border-radius:15px;
    background:#e5e7eb;
    font-weight:800;
    cursor:pointer;
}

.option.selected {
    background:#6366f1;
    color:white;
}

input {
    display:block;
    width:100%;
    max-width:450px;
    margin:12px auto;
    padding:15px;
    border:2px solid #e5e7eb;
    border-radius:15px;
    font-size:16px;
}

.save-button {
    margin-top:20px;
}

.back-button {
    display:block;
    text-align:center;
    margin:30px;
    text-decoration:none;
    font-weight:800;
}

</style>

</head>


<body>

<header>

<div class="logo">
🚀 StudySprint
</div>

<nav>

<a href="../index.html">Home</a>

<a href="../study/index.html">📚 Study</a>

<a href="../sprint/index.html">🏃 Sprint</a>

<a href="index.html">👤 Profile</a>

</nav>

</header>


<main>

<section class="hero">

<h1>🎨 Customize Character</h1>

<p>Make your StudySprint character yours.</p>

</section>


<div class="character-preview">

<div class="character" id="character">

<div
class="backpack"
id="preview-backpack">
</div>

<div
class="character-pants"
id="preview-pants">
</div>

<div
class="character-shirt"
id="preview-shirt">
</div>

<div
class="character-body"
id="preview-body">

<div class="character-face"></div>

</div>

<div
class="character-hair"
id="preview-hair">
</div>

<div
class="hat"
id="preview-hat">
</div>

</div>

</div>


<section class="option-group">

<h2>Skin</h2>

<button class="option" onclick="setOption('skin','light',this)">
Light
</button>

<button class="option" onclick="setOption('skin','medium',this)">
Medium
</button>

<button class="option" onclick="setOption('skin','dark',this)">
Dark
</button>

</section>


<section class="option-group">

<h2>Hair</h2>

<button class="option" onclick="setOption('hair','brown',this)">
Brown
</button>

<button class="option" onclick="setOption('hair','black',this)">
Black
</button>

<button class="option" onclick="setOption('hair','blonde',this)">
Blonde
</button>

</section>


<section class="option-group">

<h2>Shirt / Jumper</h2>

<button class="option" onclick="setOption('shirt','blue',this)">
Blue
</button>

<button class="option" onclick="setOption('shirt','red',this)">
Red
</button>

<button class="option" onclick="setOption('shirt','green',this)">
Green
</button>

</section>


<section class="option-group">

<h2>Pants</h2>

<button class="option" onclick="setOption('pants','blue',this)">
Blue
</button>

<button class="option" onclick="setOption('pants','black',this)">
Black
</button>

<button class="option" onclick="setOption('pants','brown',this)">
Brown
</button>

</section>


<section class="option-group">

<h2>Hat</h2>

<button class="option" onclick="setOption('hat','none',this)">
None
</button>

<button class="option" onclick="setOption('hat','cap',this)">
Cap
</button>

<button class="option" onclick="setOption('hat','beanie',this)">
Beanie
</button>

</section>


<section class="option-group">

<h2>Backpack</h2>

<button class="option" onclick="setOption('backpack','none',this)">
None
</button>

<button class="option" onclick="setOption('backpack','blue',this)">
Blue
</button>

<button class="option" onclick="setOption('backpack','red',this)">
Red
</button>

</section>


<section class="option-group">

<h2>Username</h2>

<input
type="text"
id="username"
maxlength="16"
placeholder="Username"
>

</section>


<section class="option-group">

<button
class="main-button save-button"
onclick="saveCharacter()"
>
💾 Save Character
</button>

</section>


<a
href="index.html"
class="back-button"
>
← Back to Profile
</a>

</main>


<footer>

© 2026 StudySprint

</footer>


<script>


// =============================
// DEFAULT CHARACTER
// =============================

let characterData = {

    skin: "light",
    hair: "brown",
    shirt: "blue",
    pants: "blue",
    hat: "none",
    backpack: "none"

};


// =============================
// LOAD SAVED CHARACTER
// =============================

const savedCharacter =
    localStorage.getItem("characterData");

if (savedCharacter) {

    try {

        characterData =
            JSON.parse(savedCharacter);

    }

    catch {

        console.log(
            "Could not load character."
        );

    }

}


// =============================
// SET OPTION
// =============================

function setOption(type, value, button) {

    characterData[type] =
        value;

    updateCharacter();

    document
        .querySelectorAll(
            `.option`
        )
        .forEach(option => {

            option.classList.remove(
                "selected"
            );

        });

    button.classList.add(
        "selected"
    );

}


// =============================
// UPDATE CHARACTER
// =============================

function updateCharacter() {

    const body =
        document.getElementById(
            "preview-body"
        );

    const hair =
        document.getElementById(
            "preview-hair"
        );

    const shirt =
        document.getElementById(
            "preview-shirt"
        );

    const pants =
        document.getElementById(
            "preview-pants"
        );

    const hat =
        document.getElementById(
            "preview-hat"
        );

    const backpack =
        document.getElementById(
            "preview-backpack"
        );


    body.className =
        "character-body skin-" +
        characterData.skin;


    hair.className =
        "character-hair hair-" +
        characterData.hair;


    shirt.className =
        "character-shirt shirt-" +
        characterData.shirt;


    pants.className =
        "character-pants pants-" +
        characterData.pants;


    backpack.className =
        characterData.backpack === "none"
        ? "backpack"
        : "backpack-" +
          characterData.backpack;


    if (
        characterData.hat ===
        "none"
    ) {

        hat.className =
            "hat";

    }

    else {

        hat.className =
            "hat-" +
            characterData.hat;

    }

}


// =============================
// SAVE CHARACTER
// =============================

function saveCharacter() {

    localStorage.setItem(
        "characterData",
        JSON.stringify(
            characterData
        )
    );


    const username =
        document.getElementById(
            "username"
        ).value.trim();


    if (username) {

        localStorage.setItem(
            "username",
            username
        );

    }


    alert(
        "✅ Character saved!"
    );


    window.location.href =
        "index.html";

}


// =============================
// LOAD USERNAME
// =============================

const savedUsername =
    localStorage.getItem(
        "username"
    );

if (savedUsername) {

    document.getElementById(
        "username"
    ).value =
        savedUsername;

}


// =============================
// START
// =============================

updateCharacter();

</script>

</body>

</html>
