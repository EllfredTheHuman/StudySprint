<style>

/* =========================================
   PAGE
========================================= */

.character-page {
    max-width:1100px;
    margin:auto;
    padding:45px 20px 80px;
}

.character-header {
    text-align:center;
    margin-bottom:35px;
}

.character-header h1 {
    font-size:45px;
    font-weight:900;
}

.character-header p {
    color:#6b7280;
    font-size:18px;
}


/* =========================================
   PREVIEW
========================================= */

.character-preview {
    min-height:400px;
    background:white;
    border-radius:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 15px 35px rgba(0,0,0,.08);

    margin-bottom:35px;
}

.character {
    width:180px;
    height:290px;
    position:relative;
}


/* =========================================
   CHARACTER
========================================= */

.character-head {
    position:absolute;

    width:130px;
    height:130px;

    left:25px;
    top:0;

    border-radius:50%;

    z-index:5;
}

.character-face {
    position:absolute;

    width:9px;
    height:9px;

    left:50px;
    top:58px;

    border-radius:50%;

    background:#202020;

    box-shadow:
        30px 0 0 #202020;

    z-index:8;
}

.character-body {
    position:absolute;

    width:115px;
    height:90px;

    left:32px;
    top:110px;

    border-radius:
        35px 35px 18px 18px;

    z-index:3;
}

.character-leg {
    position:absolute;

    width:38px;
    height:78px;

    top:190px;

    border-radius:15px;

    z-index:2;
}

.character-leg.left {
    left:38px;
}

.character-leg.right {
    left:88px;
}

.character-hair {
    position:absolute;

    width:120px;
    height:55px;

    left:30px;
    top:-4px;

    border-radius:
        60px 60px 18px 18px;

    z-index:7;
}


/* =========================================
   HAT
========================================= */

.character-hat {
    position:absolute;

    z-index:12;

    pointer-events:none;

    display:none;
}

.character-hat.cap {
    width:108px;
    height:38px;

    left:36px;
    top:-8px;

    border-radius:
        55px 55px 12px 12px;
}

.character-hat.cap::after {
    content:"";

    position:absolute;

    width:48px;
    height:12px;

    left:67px;
    top:25px;

    border-radius:50%;

    transform:rotate(-8deg);

    background:inherit;
}

.character-hat.beanie {
    width:122px;
    height:61px;

    left:29px;
    top:-9px;

    border-radius:
        60px 60px 18px 18px;
}

.character-hat.beanie::after {
    content:"";

    position:absolute;

    left:0;
    bottom:-3px;

    width:122px;
    height:17px;

    border-radius:10px;

    background:inherit;
}


/* =========================================
   CROWN
========================================= */

.character-hat.crown {
    display:block;

    width:100px;
    height:55px;

    left:40px;
    top:-28px;

    background:#facc15;

    clip-path:
        polygon(
            0% 100%,
            8% 20%,
            30% 55%,
            50% 0%,
            70% 55%,
            92% 20%,
            100% 100%
        );

    filter:
        drop-shadow(0 0 8px #facc15)
        drop-shadow(0 0 18px #fbbf24);
}


/* =========================================
   BACKPACK
========================================= */

.character-backpack {
    position:absolute;

    width:42px;
    height:80px;

    left:1px;
    top:120px;

    border-radius:15px;

    z-index:1;
}


/* =========================================
   EFFECT
========================================= */

.character-effect {
    position:absolute;

    inset:-45px;

    pointer-events:none;

    z-index:20;

    border-radius:50%;

    display:none;
}


/* SPARKLE */

.character-effect.sparkle {
    display:block;

    box-shadow:
        0 -55px 0 -18px #fff,
        55px 0 0 -18px #fff,
        0 55px 0 -18px #fff,
        -55px 0 0 -18px #fff;
}


/* SPEED TRAIL */

.character-effect.speed-trail {
    display:block;

    box-shadow:
        -70px 40px 0 -24px rgba(59,130,246,.5),
        -90px 70px 0 -28px rgba(59,130,246,.35),
        -110px 100px 0 -32px rgba(59,130,246,.2);
}


/* LIGHTNING */

.character-effect.lightning {
    display:block;

    border:5px solid #facc15;

    box-shadow:
        0 0 18px #facc15,
        0 0 35px #fde047;
}


/* RAINBOW */

.character-effect.rainbow {
    display:block;

    border:7px solid transparent;

    box-shadow:
        0 0 0 7px #ef4444,
        0 0 0 14px #f97316,
        0 0 0 21px #facc15,
        0 0 0 28px #22c55e,
        0 0 0 35px #3b82f6,
        0 0 0 42px #8b5cf6;
}


/* FIRE */

.character-effect.fire {
    display:block;

    box-shadow:
        0 0 25px #ef4444,
        0 0 45px #f97316,
        0 0 70px #facc15;
}


/* COSMIC */

.character-effect.cosmic {
    display:block;

    border:4px solid #8b5cf6;

    box-shadow:
        0 0 20px #8b5cf6,
        0 0 45px #3b82f6,
        0 0 70px #ec4899;
}


/* CRYSTAL */

.character-effect.crystal {
    display:block;

    border:5px solid #67e8f9;

    box-shadow:
        0 0 20px #67e8f9,
        0 0 45px #22d3ee;
}


/* SHADOW */

.character-effect.shadow {
    display:block;

    box-shadow:
        0 0 35px 15px rgba(0,0,0,.45);
}


/* GLITCH */

.character-effect.glitch {
    display:block;

    border:4px dashed #ec4899;

    box-shadow:
        8px 0 0 #22d3ee,
        -8px 0 0 #facc15;
}


/* =========================================
   SECTIONS
========================================= */

.customise-section {
    background:white;

    padding:30px;

    margin-bottom:25px;

    border-radius:30px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.07);
}

.customise-section h2 {
    margin-bottom:18px;

    font-size:27px;
}

.option-grid {
    display:flex;

    flex-wrap:wrap;

    gap:12px;
}

.option {
    border:none;

    background:#eef2f7;

    padding:12px 18px;

    border-radius:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.option:hover {
    transform:translateY(-2px);
}

.option.selected {
    background:#6366f1;

    color:white;
}

.option.locked {
    opacity:.4;

    cursor:not-allowed;
}

.option.locked:hover {
    transform:none;
}


/* =========================================
   INPUT
========================================= */

.character-input {
    width:100%;

    padding:15px;

    border:
        2px solid #e5e7eb;

    border-radius:14px;

    font-size:16px;

    font-weight:700;

    box-sizing:border-box;
}

.character-input:focus {
    outline:none;

    border-color:#6366f1;
}


/* =========================================
   BUTTONS
========================================= */

.save-button {
    display:block;

    margin:35px auto 20px;
}

.back-button {
    display:block;

    text-align:center;

    text-decoration:none;

    font-weight:800;

    color:#6366f1;
}

.hidden {
    display:none;
}

</style>

<script>

/* =========================================
   CHARACTER
========================================= */

let character = {

    skin:
        localStorage.getItem("character_skin")
        || "light",

    hair:
        localStorage.getItem("character_hair")
        || "brown",

    shirt:
        localStorage.getItem("character_shirt")
        || "blue",

    pants:
        localStorage.getItem("character_pants")
        || "blue",

    hat:
        localStorage.getItem("character_hat")
        || "none",

    backpack:
        localStorage.getItem("character_backpack")
        || "none",

    banner:
        localStorage.getItem("character_banner")
        || "purple",

    tag:
        localStorage.getItem("character_tag")
        || "none",

    effect:
        localStorage.getItem("character_effect")
        || "none"

};


/* =========================================
   USERNAME
========================================= */

const username =
    document.getElementById(
        "username"
    );


username.value =
    localStorage.getItem(
        "username"
    ) || "";


/* =========================================
   UNLOCKED ITEMS
========================================= */

function getUnlocked(
    storageKey
) {

    try {

        return JSON.parse(
            localStorage.getItem(
                storageKey
            )
        ) || [];

    } catch {

        return [];

    }

}


/* =========================================
   UNLOCK BUTTON
========================================= */

function unlockButton(
    id,
    unlocked
) {

    const button =
        document.getElementById(
            id
        );


    if (!button) {
        return;
    }


    if (unlocked) {

        button.disabled =
            false;

        button.classList.remove(
            "locked"
        );

    }

}


/* =========================================
   UPDATE UNLOCKS
========================================= */

function updateUnlockedCosmetics() {

    const shirts =
        getUnlocked(
            "unlocked_shirts"
        );

    const hats =
        getUnlocked(
            "unlocked_hats"
        );

    const banners =
        getUnlocked(
            "unlocked_banners"
        );

    const titles =
        getUnlocked(
            "unlockedTitles"
        );

    const effects =
        getUnlocked(
            "unlocked_effects"
        );


    unlockButton(
        "sprint-blue-shirt",
        shirts.includes(
            "sprint-blue"
        )
    );


    unlockButton(
        "sprint-cap",
        hats.includes(
            "sprint-cap"
        )
    );


    unlockButton(
        "crown-hat",
        hats.includes(
            "crown"
        )
    );


    unlockButton(
        "sprint-grid-banner",
        banners.includes(
            "sprint-grid"
        )
    );


    unlockButton(
        "sprint-champion-title",
        titles.includes(
            "sprint-champion"
        )
    );


    const effectIDs = [

        "sparkle",
        "speed-trail",
        "lightning",
        "rainbow",
        "fire",
        "cosmic",
        "crystal",
        "shadow",
        "glitch"

    ];


    effectIDs.forEach(
        function(effectID) {

            unlockButton(
                "effect-" + effectID,
                effects.includes(
                    effectID
                )
            );

        }
    );

}


/* =========================================
   SET OPTION
========================================= */

function setOption(
    type,
    value,
    button
) {

    if (
        button.disabled
    ) {

        return;

    }


    character[type] =
        value;


    const buttons =
        button
        .parentElement
        .querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(item) {

            item.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );


    updateCharacter();

}


/* =========================================
   UPDATE CHARACTER
========================================= */

function updateCharacter() {

    const head =
        document.getElementById(
            "character-head"
        );

    const body =
        document.getElementById(
            "character-body"
        );

    const leftLeg =
        document.getElementById(
            "character-leg-left"
        );

    const rightLeg =
        document.getElementById(
            "character-leg-right"
        );

    const hair =
        document.getElementById(
            "character-hair"
        );

    const hat =
        document.getElementById(
            "character-hat"
        );

    const backpack =
        document.getElementById(
            "character-backpack"
        );

    const effect =
        document.getElementById(
            "character-effect"
        );


    /* SKIN */

    const skins = {

        light:"#f6c7a8",
        medium:"#c98b68",
        dark:"#70452f"

    };


    head.style.background =
        skins[
            character.skin
        ];


    /* HAIR */

    const hairs = {

        brown:"#78350f",
        black:"#111827",
        blonde:"#facc15"

    };


    hair.style.background =
        hairs[
            character.hair
        ];


    /* SHIRT */

    const shirts = {

        blue:"#3b82f6",
        red:"#ef4444",
        green:"#22c55e",

        "sprint-blue":
            "#2563eb"

    };


    body.style.background =
        shirts[
            character.shirt
        ];


    /* PANTS */

    const pants = {

        blue:"#2563eb",
        black:"#111827",
        brown:"#78350f"

    };


    leftLeg.style.background =
        pants[
            character.pants
        ];


    rightLeg.style.background =
        pants[
            character.pants
        ];


    /* HAT */

    hat.className =
        "character-hat";


    hat.style.display =
        "none";


    if (
        character.hat ===
        "cap"
    ) {

        hat.classList.add(
            "cap"
        );

        hat.style.display =
            "block";

        hat.style.background =
            "#2563eb";

    }


    else if (
        character.hat ===
        "beanie"
    ) {

        hat.classList.add(
            "beanie"
        );

        hat.style.display =
            "block";

        hat.style.background =
            "#ef4444";

    }


    else if (
        character.hat ===
        "sprint-cap"
    ) {

        hat.classList.add(
            "cap"
        );

        hat.style.display =
            "block";

        hat.style.background =
            "#312e81";

    }


    else if (
        character.hat ===
        "crown"
    ) {

        hat.classList.add(
            "crown"
        );

        hat.style.display =
            "block";

    }


    /* BACKPACK */

    if (
        character.backpack ===
        "none"
    ) {

        backpack.classList.add(
            "hidden"
        );

    }

    else {

        backpack.classList.remove(
            "hidden"
        );


        const backpacks = {

            blue:"#2563eb",
            red:"#dc2626"

        };


        backpack.style.background =
            backpacks[
                character.backpack
            ];

    }


    /* EFFECT */

    effect.className =
        "character-effect";


    if (
        character.effect &&
        character.effect !==
            "none"
    ) {

        effect.classList.add(
            character.effect
        );

    }

}


/* =========================================
   SAVE CHARACTER
========================================= */

function saveCharacter() {

    localStorage.setItem(
        "username",
        username.value

}


/* =========================================
   SELECT CURRENT OPTIONS
========================================= */

function selectCurrentOptions() {

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            function(button) {

                const code =
                    button.getAttribute(
                        "onclick"
                    );


                if (!code) {
                    return;
                }


                const match =
                    code.match(
                        /setOption\('([^']+)','([^']+)'/
                    );


                if (!match) {
                    return;
                }


                const type =
                    match[1];

                const value =
                    match[2];


                if (
                    character[type] ===
                    value
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );

}


/* =========================================
   START
========================================= */

updateUnlockedCosmetics();

updateCharacter();

selectCurrentOptions();
