<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customize Character | StudySprint</title>

<link rel="stylesheet" href="../style.css">

<style>

/* =============================
CUSTOMIZER
============================= */

.customizer {

    width:900px;
    max-width:92%;

    margin:40px auto;

    background:white;

    padding:45px;

    border-radius:35px;

    box-shadow:0 15px 35px rgba(0,0,0,.1);

}


.character-preview {

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:300px;

    margin-bottom:40px;

}


/* =============================
CHARACTER
============================= */

.character {

    position:relative;

    width:190px;

    height:250px;

}


/* HEAD */

.head {

    position:absolute;

    width:125px;

    height:125px;

    left:32px;

    top:10px;

    border-radius:50%;

    background:#ffd1a4;

    z-index:3;

}


/* EYES */

.eye {

    position:absolute;

    width:14px;

    height:20px;

    border-radius:50%;

    background:#222;

    top:50px;

}


.eye.left {

    left:30px;

}


.eye.right {

    right:30px;

}


/* BODY */

.body {

    position:absolute;

    width:135px;

    height:95px;

    left:27px;

    top:125px;

    border-radius:45px 45px 30px 30px;

    background:#6366f1;

    z-index:2;

}


/* LEGS */

.leg {

    position:absolute;

    width:45px;

    height:65px;

    background:#374151;

    border-radius:20px;

    top:200px;

}


.leg.left {

    left:42px;

}


.leg.right {

    right:42px;

}


/* =============================
HAT
============================= */

.hat {

    position:absolute;

    z-index:5;

    display:none;

}


/* CAP */

.hat.cap {

    display:block;

    width:120px;

    height:45px;

    left:35px;

    top:0;

    background:#ef4444;

    border-radius:60px 60px 15px 15px;

}


.hat.cap::after {

    content:"";

    position:absolute;

    width:65px;

    height:18px;

    background:#ef4444;

    left:75px;

    top:30px;

    border-radius:20px;

}


/* BEANIE */

.hat.beanie {

    display:block;

    width:115px;

    height:65px;

    left:37px;

    top:0;

    background:#ef4444;

    border-radius:60px 60px 20px 20px;

}


/* =============================
BACKPACK
============================= */

.backpack {

    position:absolute;

    width:55px;

    height:80px;

    right:5px;

    top:130px;

    border-radius:20px;

    background:#2563eb;

    z-index:1;

    display:none;

}


.backpack.blue {

    display:block;

    background:#2563eb;

}


.backpack.red {

    display:block;

    background:#ef4444;

}


/* =============================
CONTROLS
============================= */

.custom-section {

    margin-top:35px;

}


.custom-section h2 {

    font-size:25px;

    margin-bottom:15px;

}


.options {

    display:flex;

    flex-wrap:wrap;

    gap:12px;

}


.option {

    padding:12px 20px;

    border:3px solid #e5e7eb;

    border-radius:18px;

    background:#f9fafb;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.option:hover {

    transform:translateY(-3px);

}


.option.selected {

    border-color:#6366f1;

    background:#eef2ff;

}


.option.locked {

    opacity:.45;

    cursor:not-allowed;

}


input {

    width:100%;

    padding:15px;

    margin-top:10px;

    border:3px solid #e5e7eb;

    border-radius:18px;

    font-size:18px;

    box-sizing:border-box;

}


.save-button {

    margin-top:35px;

}


.back-button {

    display:block;

    text-align:center;

    margin-top:20px;

}


</style>

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>


<nav>

<a href="../index.html">Home</a>

<a href="../study/index.html">📚 Study</a>

<a href="../sprint/index.html">🏃 Sprint</a>

<a href="index.html">👤 Profile</a>

</nav>

</header>


<main>


<section class="hero">

<h1>
🧑 Customize Your Character
</h1>

<p>
Make your StudySprint character yours.
</p>

</section>


<div class="customizer">


<!-- =============================
CHARACTER PREVIEW
============================= -->

<div class="character-preview">

class="backpack"
id="backpack"

<div

></div>


<div
class="head"

>

<div class="eye left"></div>
<div class="eye right"></div>

</div>


<div

></div>

class="leg left"
id="left-leg"
></div>

></div>

<!-- =============================
SKIN
============================= -->

>

>

</div>


<!-- =============================
HAIR
============================= -->

class="option"
onclick="setOption('hair','brown',this)"
>
Brown
</button>

<button

>

</button>

<button
class="option"

>
Blonde

<!-- =============================
SHIRT

>

</button>

<button

Brown
</button>

<!-- =============================
HAT
============================= -->

<div class="custom-section">

<h2>Hat</h2>

<div class="options">

<button
class="option"
onclick="setOption('hat','none',this)"
>
None
</button>

<button
class="option"
onclick="setOption('hat','cap',this)"
>
Cap
</button>

<button
class="option"
onclick="setOption('hat','beanie',this)"
>

</button>

</div>

</div>


<!-- =============================
BACKPACK
============================= -->

<div class="custom-section">

<h2>Backpack</h2>

<div class="options">

<button
class="option"
onclick="setOption('backpack','none',this)"
>
None
</button>

<button
class="option"
onclick="setOption('backpack','blue',this)"
>
Blue
</button>

<button
class="option"
onclick="setOption('backpack','red',this)"

============================= -->

PLAYER TAG
============================= -->

class="options"

>
</div>

<!-- =============================
BANNER
============================= -->

<h2>Banner</h2>

<div class="options">

<button
class="option"
onclick="setOption('banner','purple',this)"
>
Purple

<button
class="option"

>

</main>

<script>


// =============================
// DEFAULT CHARACTER
// =============================

const defaultCharacter = {

    skin:"light",

    hair:"brown",

    shirt:"blue",

    pants:"black",

    hat:"none",

    backpack:"none",

    banner:"purple",

    username:"Player",

    tag:"New Squeezer"

};


// =============================
// LOAD CHARACTER
// =============================

let character =

JSON.parse(
    localStorage.getItem(
        "characterData"
    )
) || {

    ...defaultCharacter

};


// =============================
// UPDATE OPTION
// =============================

function setOption(
    type,
    value,
    button
) {

    character[type] = value;

    updateCharacter();

    document
        .querySelectorAll(
            `[onclick^="setOption('${type}'"]`
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

}


// =============================
// UPDATE CHARACTER
// =============================

function updateCharacter() {

    const head =
        document.getElementById("head");

    const body =
        document.getElementById("body");

    const legs = [
        document.getElementById("left-leg"),
        document.getElementById("right-leg")
    ];


    // SKIN

    if(character.skin === "light") {

        head.style.background =
            "#ffd1a4";

    }

    else if(character.skin === "medium") {

        head.style.background =
            "#c68642";

    }

    else {

        head.style.background =
            "#6b4423";

    }


    // SHIRT

    if(character.shirt === "blue") {

        body.style.background =
            "#6366f1";

    }

    else if(character.shirt === "red") {

        body.style.background =
            "#ef4444";

    }

    else {

        body.style.background =
            "#22c55e";

    }


    // PANTS

    let pantsColour =
        "#374151";


    if(character.pants === "blue") {

        pantsColour =
            "#2563eb";

    }

    else if(character.pants === "brown") {

        pantsColour =
            "#92400e";

    }


    legs.forEach(
        leg =>
            leg.style.background =
                pantsColour
    );


    // HAT

    const hat =
        document.getElementById("hat");

    hat.className =
        "hat";


    if(
        character.hat === "cap"
    ) {

        hat.classList.add("cap");

    }

    else if(
        character.hat === "beanie"
    ) {

        hat.classList.add("beanie");

    }


    // BACKPACK

    const backpack =
        document.getElementById(
            "backpack"
        );

    backpack.className =
        "backpack";


    if(
        character.backpack !== "none"
    ) {

        backpack.classList.add(
            character.backpack
        );

    }

}


// =============================
// PLAYER TAGS
// =============================

const tags = [

    {
        id:"new_squeezer",
        name:"New Squeezer",
        unlocked:true
    },

    {
        id:"sprint_starter",
        name:"Sprint Starter",
        unlocked:false
    },

    {
        id:"speed_demon",
        name:"Speed Demon",
        unlocked:false
    },

    {
        id:"brainiac",
        name:"Brainiac",
        unlocked:false
    },

    {
        id:"on_fire",
        name:"On Fire",
        unlocked:false
    },

    {
        id:"study_machine",
        name:"Study Machine",
        unlocked:false
    }

];


// =============================
// CHECK TAG UNLOCKS
// =============================

function getUnlockedTags() {

    const quizzes =
        Number(
            localStorage.getItem(
                "quizzes"
            )
        ) || 0;


    const level =
        calculateLevel();


    const streak =
        Number(
            localStorage.getItem(
                "streak"
            )
        ) || 0;


    return {

        new_squeezer:true,

        sprint_starter:
            quizzes >= 5,

        speed_demon:
            quizzes >= 10,

        brainiac:
            level >= 5,

        on_fire:
            streak >= 7,

        study_machine:
            quizzes >= 50

    };

}


// =============================
// CALCULATE LEVEL
// =============================

function calculateLevel() {

    const totalXP =
        Number(
            localStorage.getItem(
                "XP"
            )
        ) || 0;


    let level = 1;

    let remainingXP =
        totalXP;

    let requiredXP =
        100;


    while(
        remainingXP >=
        requiredXP
    ) {

        remainingXP -=
            requiredXP;

        level++;

        requiredXP =
            Math.round(
                100 *
                Math.pow(
                    1.5,
                    level - 1
                )
            );

    }


    return level;

}


// =============================
// DISPLAY TAGS
// =============================

function loadTags() {

    const container =
        document.getElementById(
            "tag-options"
        );


    container.innerHTML = "";


    const unlocked =
        getUnlockedTags();


    tags.forEach(
        tag => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            if(
                unlocked[tag.id]
            ) {

                button.textContent =
                    tag.name;


                button.onclick =
                    () => {

                        character.tag =
                            tag.name;

                        loadTags();

                    };


                if(
                    character.tag ===
                    tag.name
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }

            else {

                button.textContent =
                    "🔒 " + tag.name;

                button.classList.add(
                    "locked"
                );

                button.disabled =
                    true;

            }


            container.appendChild(
                button
            );

        }
    );

}


// =============================
// LOAD SAVED VALUES
// =============================

document.getElementById(
    "username"
).value =

    character.username;


updateCharacter();

loadTags();


// =============================
// SELECT SAVED OPTIONS
// =============================

document
    .querySelectorAll(".option")
    .forEach(
        button => {

            const text =
                button.textContent
                    .trim()
                    .toLowerCase();


            if(
                text ===
                character.skin
            ) {

                button.classList.add(
                    "selected"
                );

            }

        }
    );


// =============================
// USERNAME
// =============================

document.getElementById(
    "username"
).addEventListener(
    "input",
    function() {

        character.username =
            this.value
                .trim()
                .slice(0,16);

    }
);


// =============================
// SAVE
// =============================

function saveCharacter() {

    if(
        !character.username
    ) {

        character.username =
            "Player";

    }


    localStorage.setItem(
        "characterData",
        JSON.stringify(
            character
        )
    );


    alert(
        "✅ Character saved!"
    );


    window.location.href =
        "index.html";

}


</script>


</body>

</html>
