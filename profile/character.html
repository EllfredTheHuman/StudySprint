<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Character | StudySprint</title>

<link
    rel="stylesheet"
    href="../style.css"
>

<style>

/* =========================================
   PAGE
========================================= */

.character-page {

    max-width:1100px;

    margin:auto;

    padding:45px 20px 80px;

}


.character-header {

    text-align:center;

    margin-bottom:35px;

}


.character-header h1 {

    font-size:45px;

    font-weight:900;

}


.character-header p {

    color:#6b7280;

    font-size:18px;

}


/* =========================================
   PREVIEW
========================================= */

.character-preview {

    min-height:400px;

    background:white;

    border-radius:35px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 15px 35px rgba(0,0,0,.08);

    margin-bottom:35px;

}


/* =========================================
   CHARACTER
========================================= */

.character {

    width:180px;

    height:290px;

    position:relative;

}


/* HEAD */

.character-head {

    position:absolute;

    width:130px;

    height:130px;

    left:25px;

    top:0;

    border-radius:50%;

    z-index:5;

}


/* FACE */

.character-face {

    position:absolute;

    width:9px;

    height:9px;

    left:50px;

    top:58px;

    border-radius:50%;

    background:#202020;

    box-shadow:
        30px 0 0 #202020;

    z-index:8;

}


/* BODY */

.character-body {

    position:absolute;

    width:115px;

    height:90px;

    left:32px;

    top:110px;

    border-radius:
        35px 35px 18px 18px;

    z-index:3;

}


/* LEGS */

.character-leg {

    position:absolute;

    width:38px;

    height:78px;

    top:190px;

    border-radius:15px;

    z-index:2;

}


.character-leg.left {

    left:38px;

}


.character-leg.right {

    left:88px;

}


/* HAIR */

.character-hair {

    position:absolute;

    width:120px;

    height:55px;

    left:30px;

    top:-4px;

    border-radius:
        60px 60px 18px 18px;

    z-index:7;

}


/* =========================================
   HATS
========================================= */

.character-hat {

    position:absolute;

    z-index:10;

    pointer-events:none;

}


.character-hat.cap {

    width:108px;

    height:38px;

    left:36px;

    top:-8px;

    border-radius:
        55px 55px 12px 12px;

}


.character-hat.cap::after {

    content:"";

    position:absolute;

    width:48px;

    height:12px;

    left:67px;

    top:25px;

    border-radius:50%;

    transform:rotate(-8deg);

}


.character-hat.beanie {

    width:122px;

    height:61px;

    left:29px;

    top:-9px;

    border-radius:
        60px 60px 18px 18px;

}


.character-hat.beanie::after {

    content:"";

    position:absolute;

    left:0;

    bottom:-3px;

    width:122px;

    height:17px;

    border-radius:10px;

}


/* =========================================
   BACKPACK
========================================= */

.character-backpack {

    position:absolute;

    width:42px;

    height:80px;

    left:1px;

    top:120px;

    border-radius:15px;

    z-index:1;

}


/* =========================================
   SECTIONS
========================================= */

.customise-section {

    background:white;

    padding:30px;

    margin-bottom:25px;

    border-radius:30px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.07);

}


.customise-section h2 {

    margin-bottom:18px;

    font-size:27px;

}


.option-grid {

    display:flex;

    flex-wrap:wrap;

    gap:12px;

}


.option {

    border:none;

    background:#eef2f7;

    padding:12px 18px;

    border-radius:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.option:hover {

    transform:translateY(-2px);

}


.option.selected {

    background:#6366f1;

    color:white;

}


.option.locked {

    opacity:.4;

    cursor:not-allowed;

}


.option.locked:hover {

    transform:none;

}


/* =========================================
   INPUT
========================================= */

.character-input {

    width:100%;

    padding:15px;

    border:
        2px solid #e5e7eb;

    border-radius:14px;

    font-size:16px;

    font-weight:700;

    box-sizing:border-box;

}


.character-input:focus {

    outline:none;

    border-color:#6366f1;

}


/* =========================================
   SAVE
========================================= */

.save-button {

    display:block;

    margin:35px auto 20px;

}


.back-button {

    display:block;

    text-align:center;

    text-decoration:none;

    font-weight:800;

    color:#6366f1;

}


/* =========================================
   HIDDEN
========================================= */

.hidden {

    display:none;

}

</style>

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>

<nav>

<a href="../index.html">
Home
</a>

<a href="../study/index.html">
📚 Study
</a>

<a href="../sprint/index.html">
🏃 Sprint
</a>

<a href="index.html">
👤 Profile
</a>

</nav>

</header>


<main class="character-page">


<section class="character-header">

<h1>
🎨 Customize Character
</h1>

<p>
Build your own StudySprint character.
</p>

</section>


<!-- =========================================
     CHARACTER PREVIEW
========================================= -->

<section class="character-preview">

<div class="character">


<div
    id="character-backpack"
    class="character-backpack hidden"
></div>


<div
    id="character-hat"
    class="character-hat"
></div>


<div
    id="character-hair"
    class="character-hair"
></div>


<div
    id="character-head"
    class="character-head"
></div>


<div
    class="character-face"
></div>


<div
    id="character-body"
    class="character-body"
></div>


<div
    id="character-leg-left"
    class="character-leg left"
></div>


<div
    id="character-leg-right"
    class="character-leg right"
></div>


</div>

</section>


<!-- =========================================
     USERNAME
========================================= -->

<section class="customise-section">

<h2>
Username
</h2>

<input
    type="text"
    id="username"
    class="character-input"
    maxlength="16"
    placeholder="Username"
>

</section>


<!-- =========================================
     SKIN
========================================= -->

<section class="customise-section">

<h2>
Skin
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('skin','light',this)"
>
Light
</button>

<button
    class="option"
    onclick="setOption('skin','medium',this)"
>
Medium
</button>

<button
    class="option"
    onclick="setOption('skin','dark',this)"
>
Dark
</button>

</div>

</section>


<!-- =========================================
     HAIR
========================================= -->

<section class="customise-section">

<h2>
Hair
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('hair','brown',this)"
>
Brown
</button>

<button
    class="option"
    onclick="setOption('hair','black',this)"
>
Black
</button>

<button
    class="option"
    onclick="setOption('hair','blonde',this)"
>
Blonde
</button>

</div>

</section>


<!-- =========================================
     SHIRT
========================================= -->

<section class="customise-section">

<h2>
Shirt
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('shirt','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('shirt','red',this)"
>
Red
</button>

<button
    class="option"
    onclick="setOption('shirt','green',this)"
>
Green
</button>

<button
    id="sprint-blue-shirt"
    class="option locked"
    onclick="setOption('shirt','sprint-blue',this)"
    disabled
>
Sprint Blue
</button>

</div>

</section>


<!-- =========================================
     PANTS
========================================= -->

<section class="customise-section">

<h2>
Pants
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('pants','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('pants','black',this)"
>
Black
</button>

<button
    class="option"
    onclick="setOption('pants','brown',this)"
>
Brown
</button>

</div>

</section>


<!-- =========================================
     HAT
========================================= -->

<section class="customise-section">

<h2>
Hat
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('hat','none',this)"
>
None
</button>

<button
    class="option"
    onclick="setOption('hat','cap',this)"
>
Cap
</button>

<button
    class="option"
    onclick="setOption('hat','beanie',this)"
>
Beanie
</button>

<button
    id="sprint-cap"
    class="option locked"
    onclick="setOption('hat','sprint-cap',this)"
    disabled
>
Sprint Cap
</button>

</div>

</section>


<!-- =========================================
     BACKPACK
========================================= -->

<section class="customise-section">

<h2>
Backpack
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('backpack','none',this)"
>
None
</button>

<button
    class="option"
    onclick="setOption('backpack','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('backpack','red',this)"
>
Red
</button>

</div>

</section>


<!-- =========================================
     BANNER
========================================= -->

<section class="customise-section">

<h2>
Profile Banner
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('banner','purple',this)"
>
Purple
</button>

<button
    class="option"
    onclick="setOption('banner','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('banner','green',this)"
>
Green
</button>

<button
    id="sprint-grid-banner"
    class="option locked"
    onclick="setOption('banner','sprint-grid',this)"
    disabled
>
Sprint Grid
</button>

</div>

</section>


<!-- =========================================
     PLAYER TAG
========================================= -->

<section class="customise-section">

<h2>
Player Tag
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('tag','none',this)"
>
None
</button>

<button
    id="sprint-champion-title"
    class="option locked"
    onclick="setOption('tag','sprint-champion',this)"
    disabled
>
Sprint Champion
</button>

</div>

</section>


<button
    class="main-button save-button"
    onclick="saveCharacter()"
>
💾 Save Character
</button>


<a
    href="index.html"
    class="back-button"
>
← Back to Profile
</a>


</main>


<footer>

© 2026 StudySprint

</footer>


<script>

/* =========================================
   CHARACTER
========================================= */

let character = {

    skin:
        localStorage.getItem(
            "character_skin"
        ) || "light",

    hair:
        localStorage.getItem(
            "character_hair"
        ) || "brown",

    shirt:
        localStorage.getItem(
            "character_shirt"
        ) || "blue",

    pants:
        localStorage.getItem(
            "character_pants"
        ) || "blue",

    hat:
        localStorage.getItem(
            "character_hat"
        ) || "none",

    backpack:
        localStorage.getItem(
            "character_backpack"
        ) || "none",

    banner:
        localStorage.getItem(
            "character_banner"
        ) || "purple",

    tag:
        localStorage.getItem(
            "character_tag"
        ) || "none"

};


/* =========================================
   USERNAME
========================================= */

const username =
    document.getElementById(
        "username"
    );


username.value =
    localStorage.getItem(
        "username"
    ) || "";


/* =========================================
   UNLOCK CHECK
========================================= */

function getUnlocked(
    storageKey
) {

    return JSON.parse(
        localStorage.getItem(
            storageKey
        )
    ) || [];

}


/* =========================================
   UPDATE UNLOCKED COSMETICS
========================================= */

function updateUnlockedCosmetics() {

    const shirts =
        getUnlocked(
            "unlocked_shirts"
        );

    const hats =
        getUnlocked(
            "unlocked_hats"
        );

    const banners =
        getUnlocked(
            "unlocked_banners"
        );

    const titles =
        getUnlocked(
            "unlockedTitles"
        );


    const sprintShirt =
        document.getElementById(
            "sprint-blue-shirt"
        );


    const sprintCap =
        document.getElementById(
            "sprint-cap"
        );


    const sprintBanner =
        document.getElementById(
            "sprint-grid-banner"
        );


    const sprintTitle =
        document.getElementById(
            "sprint-champion-title"
        );


    if (
        shirts.includes(
            "sprint-blue"
        )
    ) {

        sprintShirt.disabled =
            false;

        sprintShirt.classList.remove(
            "locked"
        );

    }


    if (
        hats.includes(
            "sprint-cap"
        )
    ) {

        sprintCap.disabled =
            false;

        sprintCap.classList.remove(
            "locked"
        );

    }


    if (
        banners.includes(
            "sprint-grid"
        )
    ) {

        sprintBanner.disabled =
            false;

        sprintBanner.classList.remove(
            "locked"
        );

    }


    if (
        titles.includes(
            "sprint-champion"
        )
    ) {

        sprintTitle.disabled =
            false;

        sprintTitle.classList.remove(
            "locked"
        );

    }

}


/* =========================================
   SET OPTION
========================================= */

function setOption(
    type,
    value,
    button
) {

    if (
        button.disabled
    ) {

        return;

    }


    character[type] =
        value;


    const buttons =
        button
        .parentElement
        .querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(
            item
        ) {

            item.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );


    updateCharacter();

}


/* =========================================
   UPDATE CHARACTER
========================================= */

function updateCharacter() {

    const head =
        document.getElementById(
            "character-head"
        );


    const body =
        document.getElementById(
            "character-body"
        );


    const leftLeg =
        document.getElementById(
            "character-leg-left"
        );


    const rightLeg =
        document.getElementById(
            "character-leg-right"
        );


    const hair =
        document.getElementById(
            "character-hair"
        );


    const hat =
        document.getElementById(
            "character-hat"
        );


    const backpack =
        document.getElementById(
            "character-backpack"
        );


    /* SKIN */

    const skins = {

        light:"#f6c7a8",

        medium:"#c98b68",

        dark:"#70452f"

    };


    head.style.background =
        skins[
            character.skin
        ];


    /* HAIR */

    const hairs = {

        brown:"#78350f",

        black:"#111827",

        blonde:"#facc15"

    };


    hair.style.background =
        hairs[
            character.hair
        ];


    /* SHIRT */

    const shirts = {

        blue:"#3b82f6",

        red:"#ef4444",

        green:"#22c55e",

        "sprint-blue":
            "#2563eb"

    };


    body.style.background =
        shirts[
            character.shirt
        ];


    /* PANTS */

    const pants = {

        blue:"#2563eb",

        black:"#111827",

        brown:"#78350f"

    };


    leftLeg.style.background =
        pants[
            character.pants
        ];


    rightLeg.style.background =
        pants[
            character.pants
        ];


    /* HAT */

    hat.className =
        "character-hat";


    hat.style.display =
        "none";


    if (
        character.hat ===
        "cap"
    ) {

        hat.classList.add(
            "cap"
        );

        hat.style.display =
            "block";

        hat.style.background =
            "#2563eb";

        hat.style.boxShadow =
            "inset 0 -7px 0 rgba(0,0,0,.15)";

    }


    else if (
        character.hat ===
        "beanie"
    ) {

        hat.classList.add(
            "beanie"
        );

        hat.style.display =
            "block";

        hat.style.background =
            "#ef4444";

    }


    else if (
        character.hat ===
        "sprint-cap"
    ) {

        hat.classList.add(
            "cap"
        );

        hat.style.display =
            "block";

        hat.style.background =
            "#312e81";

        hat.style.boxShadow =
            "inset 0 -7px 0 rgba(255,255,255,.12)";

    }


    /* BACKPACK */

    if (
        character.backpack ===
        "none"
    ) {

        backpack.classList.add(
            "hidden"
        );

    }

    else {

        backpack.classList.remove(
            "hidden"
        );


        const backpacks = {

            blue:"#2563eb",

            red:"#dc2626"

        };


        backpack.style.background =
            backpacks[
                character.backpack
            ];

    }

}


/* =========================================
   SAVE CHARACTER
========================================= */

function saveCharacter() {

    localStorage.setItem(
        "username",
        username.value
    );


    localStorage.setItem(
        "character_skin",
        character.skin
    );


    localStorage.setItem(
        "character_hair",
        character.hair
    );


    localStorage.setItem(
        "character_shirt",
        character.shirt
    );


    localStorage.setItem(
        "character_pants",
        character.pants
    );


    localStorage.setItem(
        "character_hat",
        character.hat
    );


    localStorage.setItem(
        "character_backpack",
        character.backpack
    );


    localStorage.setItem(
        "character_banner",
        character.banner
    );


    localStorage.setItem(
        "character_tag",
        character.tag
    );


    alert(
        "Character saved!"
    );

}


/* =========================================
   SELECT CURRENT OPTIONS
========================================= */

function selectCurrentOptions() {

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            function(button) {

                const code =
                    button.getAttribute(
                        "onclick"
                    );


                if (!code) {
                    return;
                }


                const match =
                    code.match(
                        /setOption\('([^']+)','([^']+)'/
                    );


                if (!match) {
                    return;
                }


                const type =
                    match[1];


                const value =
                    match[2];


                if (
                    character[type] ===
                    value
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );

}


/* =========================================
   START
========================================= */

updateUnlockedCosmetics();

updateCharacter();

selectCurrentOptions();

</script>

    <script src="character.js"></script>

</body>
