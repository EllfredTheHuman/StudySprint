<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Customize Character | StudySprint</title>

<link
    rel="stylesheet"
    href="../style.css"
>

<link
    rel="stylesheet"
    href="character.css"
>

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>

<nav>

<a href="../index.html">
Home
</a>

<a href="../study/index.html">
📚 Study
</a>

<a href="../sprint/index.html">
🏃 Sprint
</a>

<a href="index.html">
👤 Profile
</a>

</nav>

</header>


<main class="character-editor">


<!-- =====================================================
     PAGE HEADER
===================================================== -->

<section class="hero">

<h1>
🎨 Customize Character
</h1>

<p>
Build your own StudySprint character.
</p>

</section>


<!-- =====================================================
     CHARACTER PREVIEW
===================================================== -->

<section
    id="banner-preview"
    class="banner-preview"
>


<div class="character">


<!-- BACKPACK -->

<div
    id="character-backpack"
    class="backpack"
></div>


<!-- CROWN -->

<div
    id="character-crown"
    class="character-crown"
>

<div
    class="crown-gem gem-red"
></div>

<div
    class="crown-gem gem-blue"
></div>

<div
    class="crown-gem gem-purple"
></div>

</div>


<!-- HAT -->

<div
    id="character-hat"
    class="hat"
></div>


<!-- HAIR -->

<div
    id="character-hair"
    class="character-hair"
></div>


<!-- HEAD -->

<div
    id="character-head"
    class="character-head"
>


<div
    class="eye left-eye"
></div>

<div
    class="eye right-eye"
></div>

<div
    class="mouth"
></div>


</div>


<!-- BODY -->

<div
    id="character-body"
    class="character-body"
></div>


<!-- PANTS -->

<div
    id="character-pants"
    class="character-pants"
></div>


<!-- EFFECT LAYER -->

<div
    id="character-effect"
    class="character-effect"
></div>


</div>


<!-- PLAYER INFO -->

<div class="player-info">

<h2
    id="character-preview-name"
>
Player
</h2>

<p
    id="character-title"
>
</p>

</div>


</section>


<!-- =====================================================
     CUSTOMISATION
===================================================== -->

<section class="customization-section">


<!-- USERNAME -->

<h2>
Username
</h2>

<input
    type="text"
    id="username"
    maxlength="16"
    placeholder="Username"
>


<!-- =====================================================
     SKIN
===================================================== -->

<h2>
Skin
</h2>

<div
    id="skin-options"
    class="options"
>

<button
    type="button"
    data-type="skin"
    data-value="light"
>
Light
</button>

<button
    type="button"
    data-type="skin"
    data-value="medium"
>
Medium
</button>

<button
    type="button"
    data-type="skin"
    data-value="dark"
>
Dark
</button>

</div>


<!-- =====================================================
     HAIR
===================================================== -->

<h2>
Hair
</h2>

<div
    id="hair-options"
    class="options"
>

<button
    type="button"
    data-type="hair"
    data-value="brown"
>
Brown
</button>

<button
    type="button"
    data-type="hair"
    data-value="black"
>
Black
</button>

<button
    type="button"
    data-type="hair"
    data-value="blonde"
>
Blonde
</button>

</div>


<!-- =====================================================
     SHIRTS
===================================================== -->

<h2>
Shirts
</h2>

<div
    id="shirts-options"
    class="options"
></div>


<!-- =====================================================
     PANTS
===================================================== -->

<h2>
Pants
</h2>

<div
    id="pants-options"
    class="options"
></div>


<!-- =====================================================
     HATS
===================================================== -->

<h2>
Hats
</h2>

<div
    id="hats-options"
    class="options"
></div>


<!-- =====================================================
     BANNERS
===================================================== -->

<h2>
Banners
</h2>

<div
    id="banners-options"
    class="options"
></div>


<!-- =====================================================
     PLAYER TITLES
===================================================== -->

<h2>
Player Titles
</h2>

<div
    id="titles-options"
    class="options"
></div>


<!-- =====================================================
     EFFECTS
===================================================== -->

<h2>
Effects
</h2>

<div
    id="effects-options"
    class="options"
></div>


<!-- =====================================================
     SAVE
===================================================== -->

<button
    type="button"
    class="main-button save-button"
    id="save-character"
>
💾 Save Character
</button>


</section>


<a
    href="index.html"
    class="back-button"
>
← Back to Profile
</a>


</main>


<footer>

© 2026 StudySprint

</footer>


<script src="./character.js"></script>


<script>

/* =====================================================
   BASIC OPTIONS
===================================================== */

const usernameInput =
    document.getElementById(
        "username"
    );


const skinButtons =
    document.querySelectorAll(
        '#skin-options button'
    );


const hairButtons =
    document.querySelectorAll(
        '#hair-options button'
    );


/* =====================================================
   USERNAME
===================================================== */

usernameInput.value =
    localStorage.getItem(
        "username"
    ) || "";


usernameInput.addEventListener(
    "input",
    function() {

        document.getElementById(
            "character-preview-name"
        ).textContent =
            usernameInput.value ||
            "Player";

    }
);


/* =====================================================
   BASIC CHARACTER OPTIONS
===================================================== */

function setBasicOption(
    type,
    value
) {

    localStorage.setItem(
        "character_" + type,
        value
    );

    renderEditor();

}


/* =====================================================
   SKIN BUTTONS
===================================================== */

skinButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                setBasicOption(
                    "skin",
                    button.dataset.value
                );

            }
        );

    }
);


/* =====================================================
   HAIR BUTTONS
===================================================== */

hairButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                setBasicOption(
                    "hair",
                    button.dataset.value
                );

            }
        );

    }
);


/* =====================================================
   SAVE CHARACTER
===================================================== */

document
    .getElementById(
        "save-character"
    )
    .addEventListener(
        "click",
        function() {

            localStorage.setItem(
                "username",
                usernameInput.value.trim()
            );

            alert(
                "Character saved!"
            );

        }
    );


/* =====================================================
   BASIC CHARACTER RENDERING
===================================================== */

function renderBasicCharacter() {

    const skin =
        localStorage.getItem(
            "character_skin"
        ) || "light";


    const hair =
        localStorage.getItem(
            "character_hair"
        ) || "brown";


    const shirt =
        localStorage.getItem(
            "character_shirt"
        ) || "blue";


    const pants =
        localStorage.getItem(
            "character_pants"
        ) || "blue";


    const skinColours = {

        light:"#f6c7a8",

        medium:"#c98b68",

        dark:"#70452f"

    };


    const hairColours = {

        brown:"#4b2e20",

        black:"#111827",

        blonde:"#facc15"

    };


    const shirtColours = {

        blue:"#6366f1",

        red:"#ef4444",

        green:"#22c55e",

        "sprint-blue":
            "#2563eb"

    };


    const pantsColours = {

        blue:"#374151",

        black:"#111827",

        brown:"#78350f",

        split:
            "linear-gradient(90deg,#2563eb 50%,#ef4444 50%)"

    };


    document.getElementById(
        "character-head"
    ).style.background =
        skinColours[skin];


    document.getElementById(
        "character-hair"
    ).style.background =
        hairColours[hair];


    document.getElementById(
        "character-body"
    ).style.background =
        shirtColours[shirt] ||
        shirtColours.blue;


    document.getElementById(
        "character-pants"
    ).style.background =
        pantsColours[pants] ||
        pantsColours.blue;


    document.getElementById(
        "character-preview-name"
    ).textContent =
        usernameInput.value ||
        "Player";


    skinButtons.forEach(
        function(button) {

            button.classList.toggle(
                "selected",
                button.dataset.value === skin
            );

        }
    );


    hairButtons.forEach(
        function(button) {

            button.classList.toggle(
                "selected",
                button.dataset.value === hair
            );

        }
    );

}


/* =====================================================
   OVERRIDE RENDER EDITOR
===================================================== */

const oldRenderEditor =
    window.renderEditor;


window.renderEditor =
    function() {

        renderBasicCharacter();

        if (
            typeof oldRenderEditor ===
            "function"
        ) {

            oldRenderEditor();

        }

    };


/* =====================================================
   INITIAL RENDER
===================================================== */

renderBasicCharacter();

</script>


</body>

</html>
