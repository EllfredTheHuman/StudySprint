<header>

<div class="logo">
🚀 StudySprint
</div>

<nav>

<a href="../index.html">
Home

<a href="../sprint/index.html">

</nav>

<main>

<section class="hero">

<h1>
🎨 Character
</h1>

<p>
Customize your StudySprint character!
</p>

</section>


<div class="character-editor">


<!-- =====================================================
     CHARACTER PREVIEW
===================================================== -->

<section
    id="banner-preview"
    class="banner-preview purple-grid"
>

<div class="player-info">

<h2 id="player-username">
Player
</h2>

<p
    id="player-tag"
    style="display:none;"
></p>

</div>


<div
    id="character"
    class="character"
>

<!-- GOOBER -->

<div
    id="equipped-goober"
    class="equipped-goober"
></div>


<!-- EFFECT -->

<div
    id="character-effect"
    class="character-effects"
></div>

</div>

</section>


<!-- =====================================================
     CHARACTERS
===================================================== -->

<section class="customization-section">

<h2>
Characters
</h2>

<div
    id="character-options"
    class="options"
></div>

</section>


<!-- =====================================================
     BANNERS
===================================================== -->

<section class="customization-section">

<h2>
Banners
</h2>

<div
    id="banners-options"
    class="options"
></div>

</section>


<!-- =====================================================
     PLAYER TITLES
===================================================== -->

<section class="customization-section">

<h2>
Player Titles
</h2>

<div
    id="titles-options"
    class="options"
></div>

</section>


<!-- =====================================================
     EFFECTS
===================================================== -->

<section class="customization-section">

<h2>
Effects
</h2>

<div
    id="effects-options"
    class="options"
></div>

</section>
