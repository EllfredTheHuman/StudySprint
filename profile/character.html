<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Character | StudySprint</title>

<link
    rel="stylesheet"
    href="../style.css"
>

<style>

/* =========================================
   PAGE
========================================= */

.character-page {

    max-width:1100px;

    margin:0 auto;

    padding:50px 20px 80px;

}


.character-header {

    text-align:center;

    margin-bottom:40px;

}


.character-header h1 {

    font-size:48px;

    font-weight:900;

}


.character-header p {

    color:#6b7280;

    font-size:18px;

}


/* =========================================
   CHARACTER PREVIEW
========================================= */

.character-preview {

    background:white;

    border-radius:35px;

    min-height:380px;

    padding:40px;

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:0 15px 35px rgba(0,0,0,.08);

    margin-bottom:40px;

}


/* =========================================
   ROUND CHARACTER
========================================= */

.character {

    position:relative;

    width:180px;

    height:280px;

}


/* HEAD */

.character-head {

    position:absolute;

    width:130px;

    height:130px;

    left:25px;

    top:0;

    border-radius:50%;

    z-index:5;

}


/* FACE */

.character-face {

    position:absolute;

    width:8px;

    height:8px;

    background:#1f2937;

    border-radius:50%;

    left:48px;

    top:55px;

    box-shadow:

        30px 0 0 #1f2937;

    z-index:7;

}


/* BODY */

.character-body {

    position:absolute;

    width:115px;

    height:90px;

    left:32px;

    top:110px;

    border-radius:35px 35px 20px 20px;

    z-index:3;

}


/* LEGS */

.character-leg {

    position:absolute;

    width:38px;

    height:75px;

    top:190px;

    border-radius:15px;

    z-index:2;

}


.character-leg.left {

    left:38px;

}


.character-leg.right {

    left:88px;

}


/* HAIR */

.character-hair {

    position:absolute;

    width:120px;

    height:55px;

    left:30px;

    top:-5px;

    border-radius:

        60px 60px 20px 20px;

    z-index:6;

}


/* =========================================
   HAT
========================================= */

.character-hat {

    position:absolute;

    z-index:10;

    pointer-events:none;

}


/* CAP */

.character-hat.cap {

    width:115px;

    height:35px;

    left:30px;

    top:-8px;

    border-radius:

        60px 60px 15px 15px;

}


.character-hat.cap::after {

    content:"";

    position:absolute;

    width:55px;

    height:14px;

    left:65px;

    top:24px;

    border-radius:50%;

    transform:rotate(-8deg);

}


/* BEANIE */

.character-hat.beanie {

    width:125px;

    height:65px;

    left:27px;

    top:-10px;

    border-radius:

        65px 65px 20px 20px;

}


.character-hat.beanie::after {

    content:"";

    position:absolute;

    width:125px;

    height:18px;

    left:0;

    bottom:-5px;

    border-radius:10px;

}


/* =========================================
   BACKPACK
========================================= */

.character-backpack {

    position:absolute;

    width:38px;

    height:75px;

    left:5px;

    top:120px;

    border-radius:15px;

    z-index:1;

}


/* =========================================
   OPTIONS
========================================= */

.customise-section {

    background:white;

    padding:35px;

    border-radius:35px;

    box-shadow:

        0 15px 35px rgba(0,0,0,.08);

    margin-bottom:30px;

}


.customise-section h2 {

    font-size:28px;

    margin-bottom:20px;

}


.option-grid {

    display:flex;

    flex-wrap:wrap;

    gap:12px;

}


.option {

    border:none;

    background:#f1f5f9;

    padding:12px 18px;

    border-radius:15px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}


.option:hover {

    transform:translateY(-3px);

    background:#e2e8f0;

}


.option.selected {

    background:#6366f1;

    color:white;

}


/* =========================================
   LOCKED OPTIONS
========================================= */

.option.locked {

    opacity:.45;

    cursor:not-allowed;

}


.option.locked:hover {

    transform:none;

}


/* =========================================
   INPUTS
========================================= */

.character-input {

    width:100%;

    padding:15px 18px;

    border:

        2px solid #e5e7eb;

    border-radius:15px;

    font-size:16px;

    font-weight:700;

    margin-bottom:15px;

    outline:none;

}


.character-input:focus {

    border-color:#6366f1;

}


/* =========================================
   SAVE
========================================= */

.save-button {

    display:block;

    margin:35px auto 0;

}


/* =========================================
   BACK
========================================= */

.back-button {

    display:block;

    text-align:center;

    margin-top:25px;

    color:#6366f1;

    font-weight:800;

    text-decoration:none;

}


/* =========================================
   BANNER
========================================= */

.banner-preview {

    width:100%;

    height:90px;

    border-radius:25px;

    margin-bottom:25px;

    position:relative;

    overflow:hidden;

}


.banner-purple {

    background:

        linear-gradient(

            135deg,

            #7c3aed,

            #6366f1

        );

}


.banner-blue {

    background:

        linear-gradient(

            135deg,

            #2563eb,

            #38bdf8

        );

}


.banner-green {

    background:

        linear-gradient(

            135deg,

            #16a34a,

            #4ade80

        );

}


/* STUDYPASS BANNER */

.banner-sprint-grid {

    background:

        linear-gradient(

            135deg,

            #312e81,

            #6366f1

        );

}


.banner-sprint-grid::before {

    content:"";

    position:absolute;

    inset:0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.12) 1px,
            transparent 1px
        );

    background-size:

        25px 25px;

}


/* =========================================
   HIDDEN
========================================= */

.hidden {

    display:none;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

    .character-header h1 {

        font-size:38px;

    }

    .customise-section {

        padding:25px;

    }

}

</style>

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>


<nav>

<a href="../index.html">
Home
</a>

<a href="../study/index.html">
📚 Study
</a>

<a href="../sprint/index.html">
🏃 Sprint
</a>

<a href="index.html">
👤 Profile
</a>

</nav>

</header>


<main class="character-page">


<section class="character-header">

<h1>
🎨 Customize Character
</h1>

<p>
Make your StudySprint character yours.
</p>

</section>


<!-- =========================================
     CHARACTER PREVIEW
========================================= -->

<section class="character-preview">

<div class="character">

<div
    id="character-backpack"
    class="character-backpack hidden"
></div>

<div
    id="character-hat"
    class="character-hat hidden"
></div>

<div
    id="character-hair"
    class="character-hair"
></div>

<div
    id="character-head"
    class="character-head"
></div>

<div
    class="character-face"
></div>

<div
    id="character-body"
    class="character-body"
></div>

<div
    id="character-leg-left"
    class="character-leg left"
></div>

<div
    id="character-leg-right"
    class="character-leg right"
></div>

</div>

</section>


<!-- =========================================
     USERNAME
========================================= -->

<section class="customise-section">

<h2>
Username
</h2>

<input
    type="text"
    id="username"
    class="character-input"
    maxlength="16"
    placeholder="Username"
>


</section>


<!-- =========================================
     SKIN
========================================= -->

<section class="customise-section">

<h2>
Skin
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('skin','light',this)"
>
Light
</button>

<button
    class="option"
    onclick="setOption('skin','medium',this)"
>
Medium
</button>

<button
    class="option"
    onclick="setOption('skin','dark',this)"
>
Dark
</button>

</div>

</section>


<!-- =========================================
     HAIR
========================================= -->

<section class="customise-section">

<h2>
Hair
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('hair','brown',this)"
>
Brown
</button>

<button
    class="option"
    onclick="setOption('hair','black',this)"
>
Black
</button>

<button
    class="option"
    onclick="setOption('hair','blonde',this)"
>
Blonde
</button>

</div>

</section>


<!-- =========================================
     SHIRT
========================================= -->

<section class="customise-section">

<h2>
Shirt / Jumper
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('shirt','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('shirt','red',this)"
>
Red
</button>

<button
    class="option"
    onclick="setOption('shirt','green',this)"
>
Green
</button>


<!-- STUDYPASS -->

<button
    id="sprint-blue-shirt"
    class="option locked"
    onclick="setOption('shirt','sprint-blue',this)"

>
Sprint Blue
</button>

</div>

</section>


<!-- =========================================
     PANTS
========================================= -->

<section class="customise-section">

<h2>
Pants
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('pants','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('pants','black',this)"
>
Black
</button>

<button
    class="option"
    onclick="setOption('pants','brown',this)"
>
Brown
</button>

</div>

</section>


<!-- =========================================
     HAT
========================================= -->

<section class="customise-section">

<h2>
Hat
</h2>

<div class="option-grid">

<button
    class="option"

>
None

<button
    class="option"

>
Cap
</button>

<button
    class="option"
    onclick="setOption('hat','beanie',this)"
>
Beanie
</button>


<!-- STUDYPASS -->

<button
    id="sprint-cap"
    class="option locked"

>
Sprint Cap
</button>

</div>

</section>


<!-- =========================================
     BACKPACK
========================================= -->

<section class="customise-section">

<h2>
Backpack
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('backpack','none',this)"
>
None
</button>

<button
    class="option"
    onclick="setOption('backpack','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('backpack','red',this)"
>
Red

<!-- =========================================
     BANNER
========================================= -->

Banner
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('banner','purple',this)"
>
Purple
</button>

<button
    class="option"
    onclick="setOption('banner','blue',this)"
>
Blue
</button>

<button
    class="option"
    onclick="setOption('banner','green',this)"
>
Green
</button>


<!-- STUDYPASS -->

<button
    id="sprint-grid-banner"
    class="option locked"
    onclick="setOption('banner','sprint-grid',this)"
    disabled
>
Sprint Grid
</button>

</div>

</section>


<!-- =========================================
     PLAYER TAG
========================================= -->

<section class="customise-section">

<h2>
Player Tag
</h2>

<div class="option-grid">

<button
    class="option"
    onclick="setOption('tag','none',this)"
>
None
</button>


<button
    id="sprint-champion-title"
    class="option locked"
    onclick="setOption('tag','sprint-champion',this)"
    disabled
>
Sprint Champion
</button>

</div>

<button
    class="main-button save-button"
    onclick="saveCharacter()"
>
💾 Save Character
</button>


<a
    href="index.html"
    class="back-button"
>
← Back to Profile
</a>


</main>


<footer>

</footer>


<script>

/* =========================================
   CHARACTER DATA
========================================= */

let character = {

    skin:
        localStorage.getItem(
            "character_skin"
        ) || "light",

    hair:
        localStorage.getItem(
            "character_hair"
        ) || "brown",

    shirt:
        localStorage.getItem(
            "character_shirt"
        ) || "blue",

    pants:
        localStorage.getItem(
            "character_pants"
        ) || "blue",

    hat:
        localStorage.getItem(
            "character_hat"
        ) || "none",

    backpack:
        localStorage.getItem(
            "character_backpack"
        ) || "none",

    banner:
        localStorage.getItem(
            "character_banner"
        ) || "purple",

    tag:
        localStorage.getItem(
            "character_tag"
        ) || "none"

};


/* =========================================
   USERNAME
========================================= */

const usernameInput =
    document.getElementById(
        "username"
    );


usernameInput.value =
    localStorage.getItem(
        "username"
    ) || "";


/* =========================================
   UNLOCKED COSMETICS
========================================= */

function getUnlocked(type) {

    return JSON.parse(
        localStorage.getItem(
            "unlocked_" +
            type +
            "s"
        )
    ) || [];

}


function getUnlockedTitles() {

    return JSON.parse(
        localStorage.getItem(
            "unlockedTitles"
        )
    ) || [];

}


/* =========================================
   CHECK STUDYPASS COSMETICS
========================================= */

function updateUnlockedCosmetics() {

    const shirts =
        getUnlocked(
            "shirt"
        );


    const hats =
        getUnlocked(
            "hat"
        );


    const banners =
        getUnlocked(
            "banner"
        );


    const titles =
        getUnlockedTitles();


    const sprintShirt =
        document.getElementById(
            "sprint-blue-shirt"
        );


    const sprintCap =
        document.getElementById(
            "sprint-cap"
        );


    const sprintBanner =
        document.getElementById(
            "sprint-grid-banner"
        );


    const sprintTitle =
        document.getElementById(
            "sprint-champion-title"
        );


    /* SHIRT */

    if (
        shirts.includes(
            "sprint-blue"
        )
    ) {

        sprintShirt.disabled =
            false;

        sprintShirt.classList.remove(
            "locked"
        );

    }


    /* HAT */

    if (
        hats.includes(
            "sprint-cap"
        )
    ) {

        sprintCap.disabled =
            false;

        sprintCap.classList.remove(
            "locked"
        );

    }


    /* BANNER */

    if (
        banners.includes(
            "sprint-grid"
        )
    ) {

        sprintBanner.disabled =
            false;

        sprintBanner.classList.remove(
            "locked"
        );

    }


    /* TITLE */

    if (
        titles.includes(
            "sprint-champion"
        )
    ) {

        sprintTitle.disabled =
            false;

        sprintTitle.classList.remove(
            "locked"
        );

    }

}


/* =========================================
   SET OPTION
========================================= */

function setOption(
    type,
    value,
    button
) {

    if (
        button.disabled
    ) {

        return;

    }


    character[type] =
        value;


    const buttons =
        button
        .parentElement
        .querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(
            option
        ) {

            option.classList.remove(
                "selected"
            );

        }
    );


    button.classList.add(
        "selected"
    );


    updateCharacter();

}


/* =========================================
   UPDATE CHARACTER
========================================= */

function updateCharacter() {

    const head =
        document.getElementById(
            "character-head"
        );


    const body =
        document.getElementById(
            "character-body"
        );


    const leftLeg =
        document.getElementById(
            "character-leg-left"
        );


    const rightLeg =
        document.getElementById(
            "character-leg-right"
        );


    const hair =
        document.getElementById(
            "character-hair"
        );


    const hat =
        document.getElementById(
            "character-hat"
        );


    const backpack =
        document.getElementById(
            "character-backpack"
        );


    /* SKIN */

    const skinColours = {

        light:"#f6c7a8",

        medium:"#c98b68",

        dark:"#70452f"

    };


    head.style.background =
        skinColours[
            character.skin
        ];


    /* BODY */

    const shirtColours = {

        blue:"#3b82f6",

        red:"#ef4444",

        green:"#22c55e",

        "sprint-blue":
            "#2563eb"

    };


    body.style.background =
        shirtColours[
            character.shirt
        ];


    /* LEGS */

    const pantsColours = {

        blue:"#2563eb",

        black:"#111827",

        brown:"#78350f"

    };


    leftLeg.style.background =
        pantsColours[
            character.pants
        ];


    rightLeg.style.background =
        pantsColours[
            character.pants
        ];


    /* HAIR */

    const hairColours = {

        brown:"#78350f",

        black:"#111827",

        blonde:"#facc15"

    };


    hair.style.background =
        hairColours[
            character.hair
        ];


    /* HAT */

    hat.className =
        "character-hat";


    hat.classList.remove(
        "cap",
        "beanie"
    );


    hat.style.background =
        "";


    hat.innerHTML =
        "";


    if (
        character.hat ===
        "cap"
    ) {

        hat.classList.add(
            "cap"
        );

        hat.style.background =
            "#2563eb";

        hat.style.display =
            "block";

        hat.style.setProperty(
            "--hat-colour",
            "#2563eb"
        );

        hat.style.setProperty(
            "background",
            "#2563eb"
        );

        hat.style.setProperty(
            "box-shadow",
            "inset 0 -8px 0 rgba(0,0,0,.15)"
        );

    }

    else if (
        character.hat ===
        "beanie"
    ) {

        hat.classList.add(
            "beanie"
        );

        hat.style.background =
            "#ef4444";

    }

    else if (
        character.hat ===
        "sprint-cap"
    ) {

        hat.classList.add(
            "cap"
        );

        hat.style.background =
            "#2563eb";

        hat.style.boxShadow =
            "inset 0 -8px 0 rgba(0,0,0,.15)";

    }

    else {

        hat.style.display =
            "none";

    }


    /* BACKPACK */

    if (
        character.backpack ===
        "none"
    ) {

        backpack.classList.add(
            "hidden"
        );

    }

    else {

        backpack.classList.remove(
            "hidden"
        );


        const backpackColours = {

            blue:"#2563eb",

            red:"#dc2626"

        };


        backpack.style.background =
            backpackColours[
                character.backpack
            ];

    }


    /* BANNER */

    document.body.style
        .setProperty(
            "--character-banner",
            character.banner
        );

}


/* =========================================
   SAVE
========================================= */

function saveCharacter() {

    localStorage.setItem(
        "username",
        usernameInput.value
    );


    localStorage.setItem(
        "character_skin",
        character.skin
    );


    localStorage.setItem(
        "character_hair",
        character.hair
    );


    localStorage.setItem(
        "character_shirt",
        character.shirt
    );


    localStorage.setItem(
        "character_pants",
        character.pants
    );


    localStorage.setItem(
        "character_hat",
        character.hat
    );


    localStorage.setItem(
        "character_backpack",
        character.backpack
    );


    localStorage.setItem(
        "character_banner",
        character.banner
    );


    localStorage.setItem(
        "character_tag",
        character.tag
    );


    alert(
        "Character saved!"
    );

}


/* =========================================
   SELECT CURRENT OPTIONS
========================================= */

function selectCurrentOptions() {

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            function(button) {

                const onclick =
                    button.getAttribute(
                        "onclick"
                    );


                if (
                    !onclick
                ) {
                    return;
                }


                const match =
                    onclick.match(
                        /setOption\('([^']+)','([^']+)'/
                    );


                if (
                    !match
                ) {
                    return;
                }


                const type =
                    match[1];


                const value =
                    match[2];


                if (
                    character[type] ===
                    value
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );

}


/* =========================================
   START
========================================= */

updateUnlockedCosmetics();

updateCharacter();

selectCurrentOptions();

</script>


</body>

</html>
