<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Character | StudySprint</title>

<link
    rel="stylesheet"
    href="../style.css"
>

<link
    rel="stylesheet"
    href="character.css"
>

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>


<nav>

<a href="../index.html">
Home
</a>

<a href="../study/index.html">
📚 Study
</a>

<a href="../sprint/index.html">
🏃 Sprint
</a>

<a href="index.html">
👤 Profile
</a>

</nav>

</header>


<main>


<section class="hero">

<h1>
🎨 Character
</h1>

<p>
Customize your StudySprint character!
</p>

</section>


<div class="character-editor">


<!-- =====================================================
     CHARACTER PREVIEW
===================================================== -->

<section
    id="banner-preview"
    class="banner-preview banner-purple"
>


<div class="player-info">

<div
    id="player-username"
    class="player-username"
>
Player
</div>


<div
    id="player-tag"
    class="player-tag"
    style="display:none;"
>
</div>

</div>


<!-- =====================================================
     CHARACTER
===================================================== -->

<div
    id="character"
    class="character"
>


<!-- EFFECT -->

<div
    id="character-effect"
    class="character-effect"
></div>


<!-- CROWN -->

<div
    id="character-crown"
    class="character-crown"
    style="display:none;"
>

<div class="crown-gem gem-red"></div>

<div class="crown-gem gem-blue"></div>

<div class="crown-gem gem-purple"></div>

</div>


<!-- HAT -->

<div
    id="character-hat"
    class="character-hat"
></div>


<!-- HEAD -->

<div
    id="character-head"
    class="character-head"
></div>


<!-- HAIR -->

<div
    id="character-hair"
    class="character-hair"
></div>


<!-- FACE -->

<div
    class="character-face"
></div>


<!-- SHIRT -->

<div
    id="character-body"
    class="character-body"
></div>


<!-- PANTS -->

<div
    id="character-leg-left"
    class="character-leg character-leg-left"
></div>


<div
    id="character-leg-right"
    class="character-leg character-leg-right"
></div>


</div>

</section>


<!-- =====================================================
     SKIN
===================================================== -->

<section class="customization-section">

<h2>
Skin
</h2>

<div
    id="skin-options"
    class="options"
></div>

</section>


<!-- =====================================================
     HAIR
===================================================== -->

<section class="customization-section">

<h2>
Hair
</h2>

<div
    id="hair-options"
    class="options"
></div>

</section>


<!-- =====================================================
     SHIRTS
===================================================== -->

<section class="customization-section">

<h2>
Shirts
</h2>

<div
    id="shirts-options"
    class="options"
></div>

</section>


<!-- =====================================================
     HATS
===================================================== -->

<section class="customization-section">

<h2>
Hats
</h2>

<div
    id="hats-options"
    class="options"
></div>

</section>


<!-- =====================================================
     PANTS
===================================================== -->

<section class="customization-section">

<h2>
Pants
</h2>

<div
    id="pants-options"
    class="options"
></div>

</section>


<!-- =====================================================
     BANNERS
===================================================== -->

<section class="customization-section">

<h2>
Banners
</h2>

<div
    id="banners-options"
    class="options"
></div>

</section>


<!-- =====================================================
     TITLES
===================================================== -->

<section class="customization-section">

<h2>
Player Titles
</h2>

<div
    id="titles-options"
    class="options"
></div>

</section>


<!-- =====================================================
     EFFECTS
===================================================== -->

<section class="customization-section">

<h2>
Effects
</h2>

<div
    id="effects-options"
    class="options"
></div>

</section>


</div>


</main>


<footer>

© 2026 StudySprint

</footer>


<script
    src="character.js"
></script>


</body>

</html>
