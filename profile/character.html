<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character | StudySprint</title>

<link rel="stylesheet" href="../style.css">

<style>

/* =========================
   PAGE
========================= */

.character-page {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px 60px;
}

.character-editor {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    flex-wrap: wrap;
}


/* =========================
   BANNER
========================= */

.profile-banner {
    width: 650px;
    max-width: 90vw;
    min-height: 180px;

    margin: 0 auto 40px;

    border-radius: 30px;

    position: relative;

    overflow: hidden;

    color: white;

    box-shadow:
        0 15px 35px rgba(0,0,0,.15);
}

.profile-banner.purple {
    background: #6366f1;
}

.profile-banner.blue {
    background: #2563eb;
}

.profile-banner.green {
    background: #16a34a;
}

.banner-character {
    position: absolute;

    left: 30px;
    bottom: 10px;

    transform: scale(.65);
    transform-origin: bottom left;
}

.banner-info {
    position: absolute;

    left: 155px;
    top: 50%;

    transform: translateY(-50%);

    text-align: left;
}

.banner-username {
    font-size: 30px;
    font-weight: 900;

    margin-bottom: 5px;
}

.banner-tag {
    font-size: 17px;
    font-weight: 700;

    opacity: .9;
}


/* =========================
   CHARACTER PREVIEW
========================= */

.character-preview-box {
    width: 350px;

    background: white;

    padding: 30px;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 15px 35px rgba(0,0,0,.08);
}

.character-preview {
    width: 220px;
    height: 280px;

    position: relative;

    margin: 20px auto;
}


/* =========================
   CHARACTER
========================= */

.character {
    position: absolute;

    width: 150px;
    height: 250px;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);
}


/* =========================
   HEAD
========================= */

.head {
    position: absolute;

    width: 100px;
    height: 100px;

    left: 25px;
    top: 25px;

    border-radius: 50%;

    background: #f1c27d;

    z-index: 4;
}

.character.skin-medium .head {
    background: #c68642;
}

.character.skin-dark .head {
    background: #6b4226;
}


/* =========================
   HAIR
========================= */

.hair {
    position: absolute;

    width: 108px;
    height: 55px;

    left: 21px;
    top: 16px;

    border-radius:
        55px 55px 25px 25px;

    z-index: 6;
}

.hair.brown {
    background: #6b3e26;
}

.hair.black {
    background: #222;
}

.hair.blonde {
    background: #f4c542;
}


/* =========================
   BODY
========================= */

.body {
    position: absolute;

    width: 110px;
    height: 105px;

    left: 20px;
    top: 125px;

    border-radius:
        35px 35px 25px 25px;

    z-index: 2;
}

.body.blue {
    background: #3b82f6;
}

.body.red {
    background: #ef4444;
}

.body.green {
    background: #22c55e;
}


/* =========================
   ARMS
========================= */

.arm {
    position: absolute;

    width: 34px;
    height: 78px;

    top: 132px;

    border-radius: 20px;

    background: #f1c27d;

    z-index: 1;
}

.character.skin-medium .arm {
    background: #c68642;
}

.character.skin-dark .arm {
    background: #6b4226;
}

.arm.left {
    left: 0;

    transform: rotate(8deg);
}

.arm.right {
    right: 0;

    transform: rotate(-8deg);
}


/* =========================
   BACKPACK
========================= */

.backpack {
    display: none;

    position: absolute;

    width: 42px;
    height: 70px;

    right: 0;
    top: 130px;

    border-radius: 15px;

    z-index: 3;
}

.backpack.blue {
    display: block;
    background: #2563eb;
}

.backpack.red {
    display: block;
    background: #dc2626;
}


/* =========================
   HAT
========================= */

.hat {
    position: absolute;

    z-index: 8;
}


/* CAP */

.hat.cap {
    width: 95px;
    height: 25px;

    left: 28px;
    top: 9px;

    border-radius:
        50px 50px 8px 8px;

    background: #6366f1;
}

.hat.cap::after {
    content: "";

    position: absolute;

    width: 38px;
    height: 9px;

    left: 58px;
    top: 19px;

    border-radius: 50%;

    background: #4f46e5;

    transform: rotate(5deg);
}


/* BEANIE */

.hat.beanie {
    width: 96px;
    height: 47px;

    left: 27px;
    top: 5px;

    border-radius:
        50px 50px 14px 14px;

    background: #ef4444;
}

.hat.beanie::after {
    content: "";

    position: absolute;

    width: 96px;
    height: 12px;

    left: 0;
    bottom: -3px;

    border-radius: 10px;

    background: #dc2626;
}


/* =========================
   EDITOR
========================= */

.editor {
    width: 430px;
    max-width: 90vw;

    background: white;

    padding: 30px;

    border-radius: 30px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.08);
}

.editor h2 {
    margin-top: 0;
}

.option-section {
    margin-bottom: 25px;
}

.option-section h3 {
    margin-bottom: 10px;
}

.options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.option {
    border: none;

    background: #eef2ff;

    padding: 10px 15px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 700;
}

.option:hover {
    background: #c7d2fe;
}

.option.selected {
    background: #6366f1;
    color: white;
}


/* =========================
   USERNAME
========================= */

.editor input {
    width: 100%;

    box-sizing: border-box;

    padding: 14px;

    border:
        2px solid #e5e7eb;

    border-radius: 12px;

    font-size: 16px;
}


/* =========================
   SAVE
========================= */

.save-button {
    width: 100%;
    margin-top: 10px;
}

.save-message {
    text-align: center;

    font-weight: 800;

    margin-top: 15px;
}

.back-button {
    display: block;

    text-align: center;

    margin-top: 15px;

    color: #6366f1;

    font-weight: 700;

    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .profile-banner {
        min-height: 160px;
    }

    .banner-info {
        left: 130px;
    }

    .banner-username {
        font-size: 23px;
    }

}

</style>

</head>


<body>

<div class="logo">

<nav>

<!-- =========================

========================= -->

<div

    <div

            ></div>

            ></div>

        </div>

    <div class="banner-info">

        </div>

            class="banner-tag"
            id="banner-tag"

        </div>

    </div>

</div>


<div class="character-editor">


<!-- =========================
     CHARACTER PREVIEW
========================= -->

<div class="character-preview-box">

<h2>Your Character</h2>


<div class="character-preview">

<div
    class="character"
    id="character"
>


<div
    class="hair brown"
    id="hair"
></div>


<div
    class="hat"
    id="hat"
></div>


<div
    class="head"
    id="head"
></div>


<div class="arm left"></div>

<div class="arm right"></div>


<div
    class="body blue"
    id="shirt"
></div>


<div
    class="backpack"
    id="backpack"
></div>


</div>

</div>


<p

</div>


<!-- =========================

========================= -->

<script>

/* =========================
   DEFAULT CHARACTER
========================= */

let characterData = {

    skin: "light",

    hair: "brown",

    shirt: "blue",

    hat: "none",

    backpack: "none",

    banner: "purple",

    username: "Sprinter",

    playerTag: "New Sprinter"

};


/* =========================
   UNLOCKED PLAYER TAGS
========================= */

/*
   Only tags inside this list
   can be selected.

   Later, when a player unlocks
   another tag, add it to their
   unlocked tags in localStorage.
*/

const defaultTags = [

    "New Sprinter"

];


let unlockedTags =
    JSON.parse(
        localStorage.getItem(
            "unlockedPlayerTags"
        )
    ) || defaultTags;


/* =========================
   LOAD CHARACTER
========================= */

const savedCharacter =
    localStorage.getItem(
        "character"
    );


if (savedCharacter) {

    try {

        const loaded =
            JSON.parse(
                savedCharacter
            );

        characterData = {

            ...characterData,

            ...loaded

        };

    }

    catch {

        console.log(
            "Could not load character."
        );

    }

}


/* =========================
   CHECK PLAYER TAG
========================= */

if (
    !unlockedTags.includes(
        characterData.playerTag
    )
) {

    characterData.playerTag =
        unlockedTags[0];

}


/* =========================
   SET OPTION
========================= */

function setOption(
    type,
    value,
    button
) {

    characterData[type] =
        value;


    updateCharacter();

    updateSelectedButtons();

}


/* =========================
   PLAYER TAG BUTTONS
========================= */

function createTagButtons() {

    const container =
        document.getElementById(
            "tag-options"
        );


    container.innerHTML = "";


    unlockedTags.forEach(
        tag => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.textContent =
                tag;


            button.onclick =
                function() {

                    characterData.playerTag =
                        tag;

                    updateCharacter();

                    updateSelectedButtons();

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================
   UPDATE CHARACTER
========================= */

function updateCharacter() {

    const character =
        document.getElementById(
            "character"
        );


    const hair =
        document.getElementById(
            "hair"
        );


    const shirt =
        document.getElementById(
            "shirt"
        );


    const head =
        document.getElementById(
            "head"
        );


    const hat =
        document.getElementById(
            "hat"
        );


    const backpack =
        document.getElementById(
            "backpack"
        );


    /* SKIN */

    character.className =
        "character skin-" +
        characterData.skin;


    head.className =
        "head";


    /* HAIR */

    hair.className =
        "hair " +
        characterData.hair;


    /* SHIRT */

    shirt.className =
        "body " +
        characterData.shirt;


    /* HAT */

    if (
        characterData.hat ===
        "none"
    ) {

        hat.className =
            "hat";

    }

    else {

        hat.className =
            "hat " +
            characterData.hat;

    }


    /* BACKPACK */

    if (
        characterData.backpack ===
        "none"
    ) {

        backpack.className =
            "backpack";

    }

    else {

        backpack.className =
            "backpack " +
            characterData.backpack;

    }


    /* USERNAME INPUT */

    document.getElementById(
        "username"
    ).value =
        characterData.username;


    /* BANNER */

    const banner =
        document.getElementById(
            "profile-banner"
        );


    banner.className =
        "profile-banner " +
        characterData.banner;


    document.getElementById(
        "banner-username"
    ).textContent =
        characterData.username ||
        "Sprinter";


    document.getElementById(
        "banner-tag"
    ).textContent =
        characterData.playerTag;


    /* UPDATE BANNER CHARACTER */

    updateBannerCharacter();

}


/* =========================
   UPDATE BANNER CHARACTER
========================= */

function updateBannerCharacter() {

    const bannerHair =
        document.getElementById(
            "banner-hair"
        );

    const bannerHat =
        document.getElementById(
            "banner-hat"
        );

    const bannerHead =
        document.getElementById(
            "banner-head"
        );

    const bannerShirt =
        document.getElementById(
            "banner-shirt"
        );

    const bannerBackpack =
        document.getElementById(
            "banner-backpack"
        );


    bannerHair.className =
        "hair " +
        characterData.hair;


    bannerHead.className =
        "head";


    bannerShirt.className =
        "body " +
        characterData.shirt;


    if (
        characterData.hat ===
        "none"
    ) {

        bannerHat.className =
            "hat";

    }

    else {

        bannerHat.className =
            "hat " +
            characterData.hat;

    }


    if (
        characterData.backpack ===
        "none"
    ) {

        bannerBackpack.className =
            "backpack";

    }

    else {

        bannerBackpack.className =
            "backpack " +
            characterData.backpack;

    }


    const bannerCharacter =
        document.querySelector(
            "#banner-character .character"
        );


    bannerCharacter.className =
        "character skin-" +
        characterData.skin;

}


/* =========================
   SELECTED BUTTONS
========================= */

function updateSelectedButtons() {

    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    document
        .querySelectorAll(
            ".option"
        )
        .forEach(
            button => {

                const onclick =
                    button.getAttribute(
                        "onclick"
                    );


                if (!onclick) {

                    return;

                }


                if (
                    onclick.includes(
                        "'" +
                        characterData.skin +
                        "'"
                    )
                ) {

                    if (
                        onclick.includes(
                            "'skin'"
                        )
                    ) {

                        button.classList.add(
                            "selected"
                        );

                    }

                }


                if (
                    onclick.includes(
                        "'" +
                        characterData.hair +
                        "'"
                    ) &&
                    onclick.includes(
                        "'hair'"
                    )
                ) {

                    button.classList.add(
                        "selected"
                    );

                }


                if (
                    onclick.includes(
                        "'" +
                        characterData.shirt +
                        "'"
                    ) &&
                    onclick.includes(
                        "'shirt'"
                    )
                ) {

                    button.classList.add(
                        "selected"
                    );

                }


                if (
                    onclick.includes(
                        "'" +
                        characterData.hat +
                        "'"
                    ) &&
                    onclick.includes(
                        "'hat'"
                    )
                ) {

                    button.classList.add(
                        "selected"
                    );

                }


                if (
                    onclick.includes(
                        "'" +
                        characterData.backpack +
                        "'"
                    ) &&
                    onclick.includes(
                        "'backpack'"
                    )
                ) {

                    button.classList.add(
                        "selected"
                    );

                }


                if (
                    onclick.includes(
                        "'" +
                        characterData.banner +
                        "'"
                    ) &&
                    onclick.includes(
                        "'banner'"
                    )
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );


    /* PLAYER TAG */

    document
        .querySelectorAll(
            "#tag-options .option"
        )
        .forEach(
            button => {

                if (
                    button.textContent ===
                    characterData.playerTag
                ) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );

}


/* =========================
   USERNAME
========================= */

document
    .getElementById(
        "username"
    )
    .addEventListener(
        "input",
        function() {

            characterData.username =
                this.value;

            updateCharacter();

        }
    );


/* =========================
   SAVE
========================= */

function saveCharacter() {

    characterData.username =
        document.getElementById(
            "username"
        ).value.trim();


    if (
        characterData.username === ""
    ) {

        characterData.username =
            "Sprinter";

    }


    localStorage.setItem(
        "character",
        JSON.stringify(
            characterData
        )
    );


    document.getElementById(
        "save-message"
    ).textContent =
        "✅ Character saved!";


    setTimeout(
        function() {

            window.location.href =
                "index.html";

        },
        700
    );

}


/* =========================
   START
========================= */

createTagButtons();

updateCharacter();

updateSelectedButtons();

</script>


</body>
