<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Character | StudySprint</title>

<link
    rel="stylesheet"
    href="../style.css"
>

<style>

/* =========================================================
   CHARACTER EDITOR
========================================================= */

.character-editor {

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:35px;

    padding:30px 20px 80px;

}


/* =========================================================
   PREVIEW
========================================================= */

.banner-preview {

    width:90%;
    max-width:1000px;

    min-height:300px;

    margin:0 auto;

    border-radius:35px;

    position:relative;

    overflow:hidden;

    padding:35px;

    display:flex;
    align-items:center;

    box-shadow:
        0 15px 35px rgba(0,0,0,.10);

}


/* =========================================================
   BANNERS
========================================================= */

.banner-purple {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6366f1
        );

}

.banner-blue {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #38bdf8
        );

}

.banner-green {

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #4ade80
        );

}

.banner-sprint-grid {

    background:
        linear-gradient(
            135deg,
            #312e81,
            #6366f1
        );

}

.banner-purple-grid {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #c084fc
        );

}

.banner-neon-blue {

    background:
        linear-gradient(
            135deg,
            #0891b2,
            #22d3ee
        );

}

.banner-sprint-grid::before,
.banner-purple-grid::before,
.banner-neon-blue::before {

    content:"";

    position:absolute;

    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.12) 1px,
            transparent 1px
        );

    background-size:25px 25px;

    pointer-events:none;

}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    position:absolute;

    left:35px;
    top:35px;

    z-index:30;

    color:white;

}

.player-username {

    margin:0;

    font-size:42px;

    font-weight:900;

    text-shadow:
        0 3px 8px rgba(0,0,0,.25);

}

.player-tag {

    display:inline-block;

    margin-top:8px;

    padding:7px 14px;

    border-radius:12px;

    background:rgba(0,0,0,.20);

    font-weight:800;

}


/* =========================================================
   CHARACTER
   SAME BASE DESIGN AS SHOP
========================================================= */

.character {

    position:absolute;

    right:70px;
    bottom:0;

    width:210px;
    height:320px;

    z-index:10;

}


/* =========================================================
   CHARACTER BODY
========================================================= */

.character-head {

    position:absolute;

    width:144px;
    height:144px;

    left:33px;
    top:20px;

    border-radius:50%;

    background:#f6c7a8;

    z-index:5;

}

.character-hair {

    position:absolute;

    width:136px;
    height:56px;

    left:37px;
    top:16px;

    border-radius:
        40px 40px 10px 10px;

    background:#78350f;

    z-index:8;

}

.character-face {

    position:absolute;

    width:10px;
    height:10px;

    left:60px;
    top:80px;

    border-radius:50%;

    background:#111827;

    box-shadow:
        40px 0 0 #111827;

    z-index:10;

}

.character-body {

    position:absolute;

    width:128px;
    height:106px;

    left:40px;
    top:140px;

    border-radius:
        22px 22px 10px 10px;

    background:#3b82f6;

    z-index:4;

}

.character-leg {

    position:absolute;

    width:44px;
    height:84px;

    top:234px;

    border-radius:9px;

    background:#2563eb;

    z-index:3;

}

.character-leg-left {

    left:50px;

}

.character-leg-right {

    left:116px;

}


/* =========================================================
   HATS
   SAME DESIGNS AS SHOP
========================================================= */

.character-hat {

    position:absolute;

    display:none;

    z-index:15;

    pointer-events:none;

}


/* -------------------------
   CAP
------------------------- */

.character-hat.cap {

    display:block;

    width:124px;
    height:46px;

    left:43px;
    top:5px;

    border-radius:
        40px 40px 7px 7px;

}


/* CAP VISOR */

.character-hat.cap::after {

    content:"";

    position:absolute;

    width:54px;
    height:14px;

    left:76px;
    top:32px;

    border-radius:50%;

    background:inherit;

}


/* -------------------------
   BEANIE
------------------------- */

.character-hat.beanie {

    display:block;

    width:138px;
    height:68px;

    left:36px;
    top:0;

    border-radius:
        40px 40px 10px 10px;

}


/* =========================================================
   CROWN
========================================================= */

.character-hat.crown {

    display:block;

    width:134px;
    height:86px;

    left:38px;
    top:-34px;

    background:
        linear-gradient(
            180deg,
            #fff4a3,
            #ffd43b 35%,
            #d99a00
        );

    clip-path:
        polygon(
            2% 20%,
            18% 55%,
            35% 12%,
            50% 55%,
            66% 12%,
            82% 55%,
            98% 20%,
            89% 90%,
            11% 90%
        );

    filter:
        drop-shadow(
            0 0 5px #ffd43b
        );

    animation:
        crownFloat
        2s
        ease-in-out
        infinite;

}

.character-hat.crown::after {

    content:"";

    position:absolute;

    width:14px;
    height:14px;

    left:24px;
    top:48px;

    border-radius:50%;

    background:#ef4444;

    box-shadow:
        40px 0 #38bdf8,
        80px 0 #c084fc,
        0 0 8px white,
        40px 0 8px white,
        80px 0 8px white;

}


/* =========================================================
   EFFECT
========================================================= */

.character-effect {

    position:absolute;

    inset:-45px;

    z-index:0;

    pointer-events:none;

}


/* =========================================================
   EFFECTS
========================================================= */

.effect-sparkle
.character-effect::before {

    content:"✦   ✧   ✦   ✧";

    position:absolute;

    inset:0;

    color:white;

    font-size:30px;

    text-shadow:
        0 0 8px white,
        0 0 18px #a5b4fc;

    animation:
        sparkleFloat
        2s
        ease-in-out
        infinite;

}


.effect-speed-trail
.character-effect::before {

    content:"";

    position:absolute;

    width:150px;
    height:110px;

    left:-35px;
    top:145px;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 8px,
            rgba(96,165,250,.75) 9px 12px,
            transparent 13px 20px
        );

    filter:blur(1px);

    transform:skewX(-25deg);

    opacity:.85;

    animation:
        speedTrail
        .7s
        linear
        infinite;

}


.effect-lightning
.character-effect::before {

    content:"⚡";

    position:absolute;

    left:5px;
    top:105px;

    font-size:65px;

    color:#fef08a;

    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px #fef08a,
        0 0 30px #60a5fa;

    animation:
        lightningFlash
        .8s
        infinite;

}


.effect-lightning
.character-effect::after {

    content:"⚡";

    position:absolute;

    right:0;
    top:170px;

    font-size:48px;

    color:#bae6fd;

    text-shadow:
        0 0 10px #38bdf8;

    animation:
        lightningFlash
        .6s
        infinite .2s;

}


.effect-rainbow
.character-effect::before {

    content:"";

    position:absolute;

    inset:25px;

    border-radius:50%;

    background:
        conic-gradient(
            #ef4444,
            #f97316,
            #facc15,
            #22c55e,
            #06b6d4,
            #3b82f6,
            #a855f7,
            #ef4444
        );

    filter:blur(18px);

    opacity:.55;

    animation:
        rainbowSpin
        4s
        linear
        infinite;

}


.effect-fire
.character-effect::before {

    content:"";

    position:absolute;

    width:145px;
    height:180px;

    left:32px;
    top:100px;

    border-radius:
        50% 50% 45% 45%;

    background:
        radial-gradient(
            ellipse at 50% 80%,
            #fff7ae 0%,
            #facc15 20%,
            #f97316 48%,
            #ef4444 70%,
            transparent 75%
        );

    filter:blur(6px);

    opacity:.65;

    animation:
        firePulse
        .65s
        ease-in-out
        infinite
        alternate;

}


.effect-glitch
.character-effect::before {

    content:"";

    position:absolute;

    inset:35px;

    border:4px solid #22d3ee;

    box-shadow:
        8px 0 #f43f5e,
        -8px 0 #a78bfa;

    opacity:.7;

    animation:
        glitchEffect
        .35s
        infinite;

}


.effect-shadow
.character-effect::before {

    content:"";

    position:absolute;

    width:160px;
    height:42px;

    left:25px;
    bottom:22px;

    border-radius:50%;

    background:#020617;

    filter:blur(12px);

    opacity:.85;

    animation:
        shadowPulse
        1.8s
        ease-in-out
        infinite;

}


.effect-crystal
.character-effect::before {

    content:"◆   ◇   ◆   ◇";

    position:absolute;

    inset:0;

    color:#67e8f9;

    font-size:25px;

    text-shadow:
        0 0 8px #67e8f9,
        0 0 18px #a78bfa;

    animation:
        crystalFloat
        2.4s
        ease-in-out
        infinite;

}


.effect-cosmic
.character-effect::before {

    content:"✦   ·   ★   ·   ✧   ·   ✦";

    position:absolute;

    inset:0;

    color:white;

    font-size:25px;

    text-shadow:
        0 0 8px #60a5fa,
        0 0 18px #a78bfa,
        0 0 25px white;

    animation:
        cosmicDrift
        3s
        ease-in-out
        infinite;

}


.effect-cosmic
.character-effect::after {

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    left:20px;
    top:70px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(99,102,241,.25),
            transparent 70%
        );

    filter:blur(10px);

}


.effect-crown
.character-effect::before {

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    left:15px;
    top:55px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,215,0,.35),
            rgba(255,215,0,.12) 40%,
            transparent 72%
        );

    filter:blur(9px);

    animation:
        crownGlow
        1.7s
        ease-in-out
        infinite
        alternate;

}


/* =========================================================
   CUSTOMISATION
========================================================= */

.customization-section {

    width:90%;
    max-width:1000px;

    background:white;

    padding:30px;

    border-radius:30px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.08);

}

.customization-section h2 {

    margin-top:0;

    margin-bottom:18px;

}

.options {

    display:flex;

    flex-wrap:wrap;

    gap:10px;

}

.character-option {

    border:none;

    padding:12px 18px;

    border-radius:14px;

    background:#eef2ff;

    color:#3730a3;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

}

.character-option:hover {

    transform:
        translateY(-3px);

    background:#e0e7ff;

}

.character-option.selected {

    background:#4f46e5;

    color:white;

    box-shadow:
        0 5px 15px rgba(79,70,229,.3);

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes crownFloat {

    0%,100% {

        transform:
            translateY(0)
            rotate(-1deg);

    }

    50% {

        transform:
            translateY(-6px)
            rotate(1deg);

    }

}

@keyframes sparkleFloat {

    0%,100% {

        transform:
            translateY(10px)
            scale(.9);

        opacity:.55;

    }

    50% {

        transform:
            translateY(-15px)
            scale(1.1);

        opacity:1;

    }

}

@keyframes speedTrail {

    from {

        transform:
            translateX(0)
            skewX(-25deg);

    }

    to {

        transform:
            translateX(-30px)
            skewX(-25deg);

    }

}

@keyframes lightningFlash {

    0%,100% {

        opacity:.35;
        transform:scale(.9);

    }

    45% {

        opacity:1;
        transform:scale(1.1);

    }

}

@keyframes rainbowSpin {

    from {
        transform:rotate(0deg);
    }

    to {
        transform:rotate(360deg);
    }

}

@keyframes firePulse {

    from {

        transform:
            scale(.92)
            translateY(3px);

    }

    to {

        transform:
            scale(1.08)
            translateY(-4px);

    }

}

@keyframes glitchEffect {

    0% {

        transform:translate(0);
        opacity:.7;

    }

    25% {

        transform:translate(6px,-2px);

    }

    50% {

        transform:translate(-5px,3px);
        opacity:.35;

    }

    75% {

        transform:translate(4px,1px);

    }

    100% {

        transform:translate(0);
        opacity:.7;

    }

}

@keyframes shadowPulse {

    0%,100% {

        transform:scaleX(.9);
        opacity:.6;

    }

    50% {

        transform:scaleX(1.1);
        opacity:1;

    }

}

@keyframes crystalFloat {

    0%,100% {

        transform:translateY(6px);
        opacity:.65;

    }

    50% {

        transform:translateY(-10px);
        opacity:1;

    }

}

@keyframes cosmicDrift {

    0%,100% {

        transform:
            translate(0,6px)
            rotate(0deg);

        opacity:.65;

    }

    50% {

        transform:
            translate(6px,-10px)
            rotate(5deg);

        opacity:1;

    }

}

@keyframes crownGlow {

    from {

        opacity:.45;
        transform:scale(.9);

    }

    to {

        opacity:.9;
        transform:scale(1.08);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .banner-preview {

        min-height:350px;

        padding:25px;

    }

    .player-info {

        left:25px;
        top:25px;

    }

    .player-username {

        font-size:32px;

    }

    .character {

        right:15px;

        transform:
            scale(.78);

        transform-origin:
            bottom right;

    }

    .customization-section {

        padding:25px;

    }

}

</style>

<script>

/* =========================================================
   CHARACTER OPTIONS
========================================================= */

const EDITOR_OPTIONS = {

    skin: [

        ["light","Light Skin"],
        ["medium","Medium Skin"],
        ["dark","Dark Skin"]

    ],

    hair: [

        ["brown","Brown Hair"],
        ["black","Black Hair"],
        ["blonde","Blonde Hair"]

    ],

    shirts: [

        ["blue","Blue Shirt"],
        ["red","Red Shirt"],
        ["green","Green Shirt"],
        ["sprint-blue","Sprint Shirt"]

    ],

    hats: [

        ["none","None"],
        ["sprint-cap","Sprint Cap"],
        ["star-cap","Star Cap"],
        ["visor","Sprint Visor"]

    ],

    pants: [

        ["blue","Blue Pants"],
        ["black","Black Pants"],
        ["brown","Brown Pants"],
        ["split","Split Pants"]

    ],

    banners: [

        ["purple","Purple"],
        ["blue","Blue"],
        ["green","Green"],
        ["sprint-grid","Sprint Grid"],
        ["purple-grid","Purple Grid"],
        ["neon-blue","Neon Blue"]

    ],

    titles: [

        ["none","No Title"],
        ["first-sprinter","The First Sprinter"]

    ],

    effects: [

        ["none","None"],
        ["sparkle","Sparkle"],
        ["speed-trail","Speed Trail"],
        ["lightning","Lightning"],
        ["rainbow","Rainbow"],
        ["fire","Fire"],
        ["glitch","Glitch"],
        ["shadow","Shadow"],
        ["crystal","Crystal"],
        ["cosmic","Cosmic"],
        ["crown","Crown + Glow"]

    ]

};


/* =========================================================
   COLOURS
========================================================= */

const skinColours = {

    light:"#f6c7a8",

    medium:"#c98b68",

    dark:"#70452f"

};


const hairColours = {

    brown:"#78350f",

    black:"#111827",

    blonde:"#facc15"

};


const shirtColours = {

    blue:"#3b82f6",

    red:"#ef4444",

    green:"#22c55e",

    "sprint-blue":"#2563eb"

};


const pantsColours = {

    blue:"#2563eb",

    black:"#111827",

    brown:"#78350f"

};


/* =========================================================
   GET VALUE
========================================================= */

function editorValue(
    key,
    fallback
) {

    return (
        localStorage.getItem(key) ||
        fallback
    );

}


/* =========================================================
   SAVE VALUE
========================================================= */

function saveCharacterValue(
    key,
    value
) {

    localStorage.setItem(
        key,
        value
    );

    renderCharacterPreview();

}


/* =========================================================
   CREATE OPTION BUTTON
========================================================= */

function createOptionButton(
    key,
    option
) {

    const button =
        document.createElement(
            "button"
        );

    button.type="button";

    button.className =
        "character-option";

    button.textContent =
        option[1];


    if(
        editorValue(
            key,
            option[0]
        ) === option[0]
    ) {

        button.classList.add(
            "selected"
        );

    }


    button.onclick =
        function() {

            saveCharacterValue(
                key,
                option[0]
            );

            renderAllOptions();

        };


    return button;

}


/* =========================================================
   RENDER OPTIONS
========================================================= */

function renderAllOptions() {

    const sections = {

        skin:
            "skin-options",

        hair:
            "hair-options",

        shirts:
            "shirts-options",

        hats:
            "hats-options",

        pants:
            "pants-options",

        banners:
            "banners-options",

        titles:
            "titles-options",

        effects:
            "effects-options"

    };


    Object.entries(
        sections
    ).forEach(
        function([key,id]) {

            const container =
                document.getElementById(
                    id
                );

            if(!container)
                return;


            container.innerHTML="";


            EDITOR_OPTIONS[key]
                .forEach(
                    function(option) {

                        const button =
                            createOptionButton(
                                key === "titles"
                                    ? "character_tag"
                                    : "character_" + key.slice(0,-1),
                                option
                            );


                        /*
                         * Correct singular storage names.
                         */

                        if(key === "shirts") {

                            button.onclick =
                                function() {

                                    saveCharacterValue(
                                        "character_shirt",
                                        option[0]
                                    );

                                    renderAllOptions();

                                };

                        }

                        if(key === "hats") {

                            button.onclick =
                                function() {

                                    saveCharacterValue(
                                        "character_hat",
                                        option[0]
                                    );

                                    renderAllOptions();

                                };

                        }

                        if(key === "pants") {

                            button.onclick =
                                function() {

                                    saveCharacterValue(
                                        "character_pants",
                                        option[0]
                                    );

                                    renderAllOptions();

                                };

                        }

                        if(key === "banners") {

                            button.onclick =
                                function() {

                                    saveCharacterValue(
                                        "character_banner",
                                        option[0]
                                    );

                                    renderAllOptions();

                                };

                        }

                        if(key === "effects") {

                            button.onclick =
                                function() {

                                    saveCharacterValue(
                                        "character_effect",
                                        option[0]
                                    );

                                    renderAllOptions();

                                };

                        }


                        container.appendChild(
                            button
                        );

                    }
                );

        }
    );

}


/* =========================================================
   RENDER CHARACTER
========================================================= */

function renderCharacterPreview() {

    const skin =
        editorValue(
            "character_skin",
            "light"
        );

    const hair =
        editorValue(
            "character_hair",
            "brown"
        );

    const shirt =
        editorValue(
            "character_shirt",
            "blue"
        );

    const pants =
        editorValue(
            "character_pants",
            "blue"
        );

    const banner =
        editorValue(
            "character_banner",
            "purple"
        );

    const effect =
        editorValue(
            "character_effect",
            "none"
        );

    const title =
        editorValue(
            "character_tag",
            "none"
        );


    /* =====================================================
       USERNAME
    ===================================================== */

    document.getElementById(
        "player-username"
    ).textContent =
        localStorage.getItem(
            "username"
        ) ||
        "Player";


    /* =====================================================
       TITLE
    ===================================================== */

    const titleElement =
        document.getElementById(
            "player-tag"
        );


    if(title !== "none") {

        titleElement.textContent =
            getCosmeticName(
                title
            );

        titleElement.style.display =
            "inline-block";

    }

    else {

        titleElement.style.display =
            "none";

    }


    /* =====================================================
       SKIN
    ===================================================== */

    document.getElementById(
        "character-head"
    ).style.background =
        skinColours[skin] ||
        skinColours.light;


    /* =====================================================
       HAIR
    ===================================================== */

    document.getElementById(
        "character-hair"
    ).style.background =
        hairColours[hair] ||
        hairColours.brown;


    /* =====================================================
       SHIRT
    ===================================================== */

    document.getElementById(
        "character-body"
    ).style.background =
        shirtColours[shirt] ||
        shirtColours.blue;


    /* =====================================================
       PANTS
    ===================================================== */

    const leftLeg =
        document.getElementById(
            "character-leg-left"
        );

    const rightLeg =
        document.getElementById(
            "character-leg-right"
        );


    leftLeg.style.background =
        pantsColours[pants] ||
        pantsColours.blue;

    rightLeg.style.background =
        pantsColours[pants] ||
        pantsColours.blue;


    /*
     * SPLIT PANTS
     * EXACT SAME COLOURS AS SHOP
     */

    if(pants === "split") {

        leftLeg.style.background =
            "#111827";

        rightLeg.style.background =
            "#f97316";

    }


    /* =====================================================
       BANNER
    ===================================================== */

    const bannerElement =
        document.getElementById(
            "banner-preview"
        );


    bannerElement.className =
        "banner-preview";


    bannerElement.classList.add(
        "banner-" +
        banner
    );


    /* =====================================================
       EFFECT
    ===================================================== */

    const character =
        document.getElementById(
            "character"
        );


    character.classList.remove(

        "effect-sparkle",
        "effect-speed-trail",
        "effect-lightning",
        "effect-rainbow",
        "effect-fire",
        "effect-glitch",
        "effect-shadow",
        "effect-crystal",
        "effect-cosmic",
        "effect-crown"

    );


    if(effect !== "none") {

        character.classList.add(
            "effect-" +
            effect
        );

    }


    /* =====================================================
       HAT
    ===================================================== */

    renderEditorHat();

}


/* =========================================================
   HAT
========================================================= */

function renderEditorHat() {

    const hat =
        editorValue(
            "character_hat",
            "none"
        );


    const element =
        document.getElementById(
            "character-hat"
        );


    element.innerHTML="";

    element.className =
        "character-hat";


    element.style.display =
        "none";

    element.style.background =
        "";

    element.style.color =
        "";

    element.textContent =
        "";


    /* =====================================================
       SPRINT CAP
    ===================================================== */

    if(hat === "sprint-cap") {

        element.classList.add(
            "cap"
        );

        element.style.display =
            "block";

        element.style.background =
            "#2563eb";

    }


    /* =====================================================
       STAR CAP
    ===================================================== */

    else if(hat === "star-cap") {

        element.classList.add(
            "cap"
        );

        element.style.display =
            "block";

        element.style.background =
            "#7c3aed";

        element.textContent =
            "★";

        element.style.color =
            "white";

        element.style.textAlign =
            "center";

        element.style.fontSize =
            "30px";

        element.style.lineHeight =
            "46px";

    }


    /* =====================================================
       VISOR
    ===================================================== */

    else if(hat === "visor") {

        element.classList.add(
            "cap"
        );

        element.style.display =
            "block";

        element.style.background =
            "#06b6d4";

    }


    /* =====================================================
       CROWN
    ===================================================== */

    else if(hat === "crown") {

        element.classList.add(
            "crown"
        );

        element.style.display =
            "block";

    }

}


/* =========================================================
   INITIALISE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderAllOptions();

        renderCharacterPreview();

    }
);

</script>
