<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | StudySprint</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>

<nav>

<a href="../index.html">Home</a>
<a href="../study/index.html">📚 Study</a>
<a href="index.html">👤 Profile</a>

</nav>

</header>




<main>


<section class="hero">

<h1>
👤 Your Profile
</h1>

<p>
Track your learning progress!
</p>

</section>





<section class="features">


<div class="stat">

<h2 id="xp">0</h2>

<p>
⭐ XP
</p>

</div>


<div class="stat">

<h2 id="level">1</h2>

<p>
🏆 Level
</p>

</div>


<div class="stat">

<h2 id="quizzes">0</h2>

<p>
📝 Quizzes
</p>

</div>


</section>







<section class="hero">


<h1>
📊 Progress
</h1>


<div class="progress">

<div id="xp-bar" class="progress-bar"></div>

</div>


<p id="xp-text">
0 / 100 XP
</p>


</section>







<section class="features">


<div class="feature-card">

<h2>
🏅 Best Score
</h2>

<p id="best-score">
No quizzes completed yet.
</p>

</div>





<div class="feature-card">

<h2>
🏆 Achievements
</h2>

<div id="achievement-list">

Loading...

</div>

</div>


</section>



</main>





<footer>

© 2026 StudySprint

</footer>





<script src="../achievements.js"></script>


<script>


let xp =
Number(localStorage.getItem("XP")) || 0;


let quizzes =
Number(localStorage.getItem("quizzes")) || 0;


let best =
Number(localStorage.getItem("bestScore")) || 0;



let level =
Math.floor(xp / 100) + 1;


let progress =
xp % 100;



document.getElementById("xp").textContent =
xp;


document.getElementById("level").textContent =
level;


document.getElementById("quizzes").textContent =
quizzes;



document.getElementById("xp-bar").style.width =
progress + "%";


document.getElementById("xp-text").textContent =
progress + " / 100 XP to next level";



if(best > 0){

document.getElementById("best-score").textContent =
best + "%";

}




let list =
document.getElementById("achievement-list");


let unlocked =
getUnlockedAchievements();



if(unlocked.length === 0){

list.innerHTML =
"🔒 No achievements yet";

}

else{


list.innerHTML = "";


unlocked.forEach(id=>{


let achievement =
achievements[id];


let div =
document.createElement("div");


div.className="achievement";


div.innerHTML =
`
<h3>${achievement.name}</h3>
<p>${achievement.description}</p>
`;


list.appendChild(div);


});


}


</script>


</body>

</html>
