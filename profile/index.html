<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | StudySprint</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<header>

<div class="logo">
🚀 StudySprint
</div>


<nav>

<a href="../index.html">Home</a>

<a href="../study/index.html">📚 Study</a>

<a href="index.html">👤 Profile</a>

</nav>

</header>







<main>


<section class="hero">

<h1>
👤 Your Profile
</h1>

<p>
Track your learning progress!
</p>

</section>







<section class="features">



<div class="stat">

<h2 id="xp">
0
</h2>

<p>
⭐ XP
</p>

</div>





<div class="stat">

<h2 id="level">
1
</h2>

<p>
🏆 Level
</p>

</div>





<div class="stat">

<h2 id="quizzes">
0
</h2>

<p>
📝 Quizzes Completed
</p>

</div>



</section>









<section class="hero">


<h1>
📊 Progress
</h1>



<div class="progress">

<div class="progress-bar" id="xp-bar"></div>

</div>



<p id="xp-text">

0 / 100 XP to next level

</p>



</section>









<section class="features">



<div class="feature-card">


<h2>
🏅 Best Score
</h2>


<p id="best-score">

No quizzes completed yet.

</p>


</div>







<div class="feature-card">


<h2>
🏆 Achievements
</h2>


<p id="achievement-count">

0 / 0 Unlocked

</p>



<a href="../achievements.html" class="main-button">

View Achievements

</a>


</div>





</section>





</main>







<footer>

© 2026 StudySprint

</footer>









<script src="../achievements.js"></script>


<script>


// LOAD DATA


let xp =
Number(localStorage.getItem("XP")) || 0;



let quizzes =
Number(localStorage.getItem("quizzes")) || 0;



let best =
Number(localStorage.getItem("bestScore")) || 0;





// LEVEL


let level =
Math.floor(xp / 100) + 1;



let progress =
xp % 100;






// UPDATE STATS


document.getElementById("xp").textContent =
xp;



document.getElementById("level").textContent =
level;



document.getElementById("quizzes").textContent =
quizzes;





// XP BAR


document.getElementById("xp-bar").style.width =
progress + "%";



document.getElementById("xp-text").textContent =
`${progress} / 100 XP to next level`;






// BEST SCORE


if(best > 0){

document.getElementById("best-score").textContent =
best + "%";

}







// ACHIEVEMENTS


let unlocked =
getUnlockedAchievements();



document.getElementById("achievement-count").textContent =
`${unlocked.length} / ${Object.keys(achievements).length} Unlocked`;



</script>





</body>

</html>
